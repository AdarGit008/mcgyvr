[project]
name = "mcgyvr"
version = "0.0.0"
description = "Offload scoped coding work from your agent to a configurable worker ladder"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/AdarGit008/mcgyvr"
Issues = "https://github.com/AdarGit008/mcgyvr/issues"

[project.scripts]
mcgyvr = "mcgyvr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16",
    "mypy>=1.18",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcgyvr"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# tools/baseline/ is a vendored, hash-pinned tree (REC-06). Linting it would
# invite edits that break the pin.
extend-exclude = ["tools/baseline"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
