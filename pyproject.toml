[project]
name = "mcgyvr"
version = "0.0.0"
description = "Offload scoped coding work from your agent to a configurable worker ladder"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/AdarGit008/mcgyvr"
Issues = "https://github.com/AdarGit008/mcgyvr/issues"

[project.scripts]
mcgyvr = "mcgyvr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16.2",
    "mypy>=1.18",
    "types-pyyaml>=6.0.12.20260724",
]
# Measurement-only, and deliberately not in `dev`. #117 measures the token
# estimator's error against real tokenizers, which needs one; the product must
# never acquire one, because a tokenizer in `dependencies` would make the
# estimator's whole reason for existing — a model-free proxy — pointless. Not a
# default group, so `make setup` and CI never install it:
#     uv sync --frozen --group measure
measure = [
    "tokenizers>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcgyvr"]

# The shipped data files are read at runtime through `importlib.resources`, so
# they have to be inside the package in a wheel — `data/` sits at the repo root
# for editing, and the loaders' checkout fallback only works from a source tree.
# Without this a wheel install cannot load the task catalog, and since the
# contract schema reads it, `import mcgyvr.contract` would fail outright.
[tool.hatch.build.targets.wheel.force-include]
"data/capability-table.json" = "mcgyvr/data/capability-table.json"
"data/task-catalog.json" = "mcgyvr/data/task-catalog.json"
# The semantic rung's resolver engine (#123, ADR-0011). These four files are
# third-party source vendored as evidence under `records/` and pinned by
# sha256 there and again in `gate/semantic.py`; they are *staged into the
# sandbox* as data and are never imported by mcgyvr, so they ship as files
# rather than as a dependency. Same reason as the data files above: a record
# outside `src/` does not exist in a wheel.
"records/evidence/ghostcall-2026-08-02/src/ghostcall/__init__.py" = "mcgyvr/gate/_engine/ghostcall/__init__.py"
"records/evidence/ghostcall-2026-08-02/src/ghostcall/parser.py" = "mcgyvr/gate/_engine/ghostcall/parser.py"
"records/evidence/ghostcall-2026-08-02/src/ghostcall/checker.py" = "mcgyvr/gate/_engine/ghostcall/checker.py"
"records/evidence/ghostcall-2026-08-02/src/ghostcall/suggest.py" = "mcgyvr/gate/_engine/ghostcall/suggest.py"
"records/evidence/ghostcall-2026-08-02/LICENSE" = "mcgyvr/gate/_engine/ghostcall/LICENSE"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# records/measurements/ holds run artifacts, including the harness as it was
# actually run. Reformatting one is not a tidy-up: the file stops being what
# produced the numbers beside it. Same reason as records/evidence/ below.
# records/evidence/ is third-party source
# vendored as evidence and hashed in its MANIFEST.json (#118): a formatter run
# there does not tidy anything, it invalidates the citation.
#
# tools/bundle/python/tasks/ is the same case one step removed. Its acceptance
# scripts and reference solutions are copied byte for byte out of the recovered
# instrument, and `tests/test_python_arm.py` holds them to that copy by digest.
# They are also what decides whether a cell passes, so reformatting them would
# not be a tidy-up: it would change the instrument #167 exists to keep fixed,
# and the arm would stop being CLM-0004's task set. The contracts beside them
# are ours and are not excluded — YAML is not ruff's anyway.
extend-exclude = [
    "records/measurements",
    "records/evidence",
    # evidence prose moved out of records/evidence on 2026-09-05 (round r4) and
    # stays as it was written; a formatter pass on it would alter the record.
    "archive/docs/2026-09-02-srv1-kernel-arms-ARTIFACT-CONTRACT.md",
    "archive/docs/2026-09-02-srv1-kernel-arms-RUN-ORDER.md",
    "tools/bundle/python/tasks",
    # tools/problems/tasks/ is digest-pinned by tools/problems/admissions.jsonl the
    # way the python arm is pinned by test_python_arm.py: run directories pin
    # the task set's digests, so a formatter pass is not a tidy-up, it
    # invalidates every prior run's resume and the manifest's pins (#197).
    "tools/problems/tasks",
    # tools/bench/ task material is the same case again (#225): both halves are
    # digest-pinned by tools/bench/admissions.jsonl, and the bench half is the
    # instrument every lever is judged against. A formatter pass would break
    # every pin and change the instrument, not tidy it.
    "tools/bench/tasks",
    "tools/bench/reserve",
    # src/mcgyvr/serving/ggufscan.py began as a verbatim copy of
    # records/evidence/2026-09-01-bandwidth-and-ncmoe-floor/ggufscan.py, excluded
    # above for the reason every evidence file is. It has since DIVERGED: the
    # GGUF parser (the `T`/`NAME` type maps and the reader) is still byte-for-
    # byte the evidence copy, and everything after the tensor walk is new --
    # per-block expert bytes, NextN/MTP and recurrent block detection, the
    # caching-layer rules, and the KV/SSM geometry. The parser half is what must
    # stay comparable line for line, because it is the half a formatter pass
    # would make impossible to diff against the file a published measurement was
    # computed with. Keeping the whole file excluded is the cheap way to hold
    # that half still; the added half is covered by tests/test_serving_vramfit.py
    # against measured rig readings rather than by the formatter.
    "src/mcgyvr/serving/ggufscan.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

# The formatter is declared explicitly (not left to defaults) so the repo's
# formatting is pinned to a file rather than inherited from whichever ruff a
# machine has; `make lint` enforces it with `ruff format --check .`. These are
# ruff's current defaults, so `ruff format` behaviour is unchanged.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# `tools/` is here for the same reason `src` and `tests` are: `make
# journal-index` and `make journal-review` run tools/live/*.py over the live
# journal, and tests/conftest.py imports tools/bench/*.py at collection. A
# directory ruff lints and the type checker never sees is a check that reports
# green over code nothing measured.
files = ["src", "tests", "tools"]
strict = true
# The four task-material directories ruff already excludes, for the reason
# stated there: their contents are digest-pinned instruments, not code this
# repository maintains.
exclude = "^tools/(bundle/python/tasks|problems/tasks|bench/tasks|bench/reserve)/"
# `tools/` is not a package (tests/conftest.py:109), so two rigs may both hold
# a `measure.py` and neither is `measure`. Naming each file by its path is what
# lets both be checked; MYPYPATH puts `src` ahead of the repository root so a
# module under it stays `mcgyvr.*` and is not also found as `src.mcgyvr.*`.
explicit_package_bases = true
mypy_path = "src"

# ggufscan.py is held byte-comparable with the evidence copy (see the ruff
# exclusion above); it is shipped to the rig as text and checked by
# tests/test_ggufscan_self_contained.py and tests/test_serving_vramfit.py.
[[tool.mypy.overrides]]
module = "mcgyvr.serving.ggufscan"
ignore_errors = true

# The siblings a rig under `tools/` reaches by bare name. `tools/` is not a
# package, so these scripts put their neighbour's directory on `sys.path` and
# import it as `mode`, `mde`, `frames` — a name no import system resolves from
# the repository root. The files themselves are checked in full under their
# own paths; this says only that the *importer's* view of them is untyped,
# which is what the path-loading already made true at runtime.
[[tool.mypy.overrides]]
module = ["mode", "mde", "power.mde", "frames", "emit", "product", "responsiveness"]
ignore_missing_imports = true

# Third-party packages with no stubs, installed only on the machines that run
# these two rigs (a fine-tune box and the okf service).
[[tool.mypy.overrides]]
module = ["datasets", "tokenizers", "trl", "unsloth.*", "unsloth", "okf_rag.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
