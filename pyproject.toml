[project]
name = "mcgyvr"
# The version is the git tag's (hatch-vcs, `[tool.hatch.version]` below) and
# is spelled nowhere in the tree: a wheel is built once from a `v*` tag by
# .github/workflows/release.yml, and `mcgyvr --version` says what was
# installed. A literal here would be a second version that drifts.
dynamic = ["version"]
description = "Offload scoped coding work from your agent to a configurable worker ladder"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/AdarGit008/mcgyvr"
Issues = "https://github.com/AdarGit008/mcgyvr/issues"

[project.scripts]
mcgyvr = "mcgyvr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16.2",
    "mypy>=1.18",
    "types-pyyaml>=6.0.12.20260724",
    "pytest-xdist>=3.8.0",
]
# Measurement-only, and deliberately not in `dev`. #117 measures the token
# estimator's error against real tokenizers, which needs one; the product must
# never acquire one, because a tokenizer in `dependencies` would make the
# estimator's whole reason for existing — a model-free proxy — pointless. Not a
# default group, so `make setup` and CI never install it:
#     uv sync --frozen --group measure
measure = [
    "tokenizers>=0.20",
]

[build-system]
# hatch-vcs is a build requirement and not a runtime one: it reads the
# version from git while the wheel is built, and the wheel carries the
# result in its metadata. `dependencies` above is unchanged. Pinned, all
# three, because they are the algorithm that turns a tag into a version:
# a build backend resolved from the PyPI of the day would make "built
# once" mean "built once per backend release".
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# A tree with no git at all (a source tarball unpacked by hand) has no
# version to read; the fallback names that rather than failing the build,
# and is the same "not a version" `mcgyvr.__version__` reports when the
# package was never installed. A checkout without tags is NOT that case: it
# reads as `0.0.1.dev<N>+g<sha>`, the distance from nothing. Nothing built
# for a release ever sees the fallback: the release workflow checks the
# wheel's version against the tag.
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Only a `v<digit>…` tag is a version. This repository also names tags
# `archive/<lane>`; the default `--match '*[0-9]*'` picks the nearest tag of
# any name, and an `archive/<lane>` tag nearer than the last release does not
# parse as a version.
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v[0-9]*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcgyvr"]

# The shipped data files are read at runtime through `importlib.resources`, so
# they have to be inside the package in a wheel — `data/` sits at the repo root
# for editing, and the loaders' checkout fallback only works from a source tree.
# Without this a wheel install cannot load the task catalog, and since the
# contract schema reads it, `import mcgyvr.contract` would fail outright.
[tool.hatch.build.targets.wheel.force-include]
"data/capability-table.json" = "mcgyvr/data/capability-table.json"
"data/task-catalog.json" = "mcgyvr/data/task-catalog.json"
"data/numbers.json" = "mcgyvr/data/numbers.json"
"data/model-catalog.json" = "mcgyvr/data/model-catalog.json"
"data/model-geometry.json" = "mcgyvr/data/model-geometry.json"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# The GGUF parser in src/mcgyvr/serving/ggufscan.py (the `T`/`NAME` type maps
# and the reader) is byte for byte the one a published bandwidth/ncmoe-floor
# measurement vendored as evidence. The parser half must stay comparable line
# for line with that evidence file, and a formatter pass would make that diff
# impossible. Excluding the whole file holds that half still; the rest is
# covered by tests/test_serving_vramfit.py rather than by the formatter.
extend-exclude = [
    "src/mcgyvr/serving/ggufscan.py",
    # The semantic rung's resolver engine: third-party source copied byte for
    # byte and pinned by sha256 in gate/semantic.py, which refuses to run it on
    # any other bytes. It is staged into the sandbox as data, never imported.
    "src/mcgyvr/gate/_engine",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

# The formatter is declared explicitly (not left to defaults) so the repo's
# formatting is pinned to a file rather than inherited from whichever ruff a
# machine has; `make lint` enforces it with `ruff format --check .`. These are
# ruff's current defaults, so `ruff format` behaviour is unchanged.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
# The resolver engine is excluded for the reason stated at its ruff exclusion.
exclude = "^src/mcgyvr/gate/_engine/"
explicit_package_bases = true
mypy_path = "src"

# ggufscan.py is held byte-comparable with the evidence copy (see the ruff
# exclusion above); it is shipped to the rig as text and checked by
# tests/test_ggufscan_self_contained.py and tests/test_serving_vramfit.py.
[[tool.mypy.overrides]]
module = "mcgyvr.serving.ggufscan"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
