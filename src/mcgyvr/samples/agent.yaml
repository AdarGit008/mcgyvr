# The agent use case's sample task: one question grounded in one source, put
# straight to an awake unit of the staged setup (mcgyvr.fleet.sampler). Green
# when the reply is grounded -- every sentence cites the source and the reply
# states each fact in `facts`. `files` are the sources the question is asked
# over, and `reference` is one reply the grounded check accepts.
use_case: agent
task: |
  Read harbour-notes. In two short sentences, say what colour the sky was
  and on which day. End each sentence with the citation [1].
citation: "[1]"
facts: ["green", "tuesday"]
files:
  harbour-notes: |
    On Tuesday the sky over the harbour was green.
reference:
  answer: |
    The sky was green [1]. It was Tuesday [1].
