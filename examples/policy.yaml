# mcgyvr policy.yaml — how work moves between units. NOT locked.
#
# Copy this to ~/.mcgyvr/config/policy.yaml and edit it. fleet.yaml holds what
# runs where (locked); this file holds the routing over it (not locked). Every
# key's meaning is in `skills/mcgyvr/SETUP.md` (generated by `make docs`).

ladder:
  - local                       # ordered list of unit names, cheapest first
  - gpu

fanout: idle                    # none | idle | full — how a batch spreads
