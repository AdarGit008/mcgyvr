id: b503-path-toll
task_type: function_implementation
task: >-
  step_cost names what one step of a kind costs. path_toll totals a
  path, except that every third step along it is free, counting the
  steps from one. Implement path_toll. A path of no steps costs
  nothing.
target: solution.py
interface: "def step_cost(kind: str) -> int
def path_toll(steps: list[str]) -> int"
stop_conditions:
  - Whether a path should be counted afresh after a rest is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
