id: b338-count-back
task_type: bug_fix
task: >-
  count_back returns the numbers from a starting count down to one,
  and it runs one step too far and ends at zero. Fix it. A start of
  zero or less returns nothing at all. Return the complete fixed file.
target: solution.py
target_content: |
  def count_back(start: int) -> list:
      """The numbers from a start down to one."""
      counted = []
      for value in range(start, -1, -1):
          counted.append(value)
      return counted
interface: "def count_back(start: int) -> list"
stop_conditions:
  - Whether the count should be able to run upward instead is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
