id: b390-cell-count
task_type: function_implementation
task: >-
  Implement cell_count. Given a grid written as a list of rows, return
  how many of its cells hold a stated value. A grid with no rows, and
  a grid whose rows hold nothing, both hold none of anything.
target: solution.py
interface: "def cell_count(grid: list, value: int) -> int"
stop_conditions:
  - Whether cells holding values of different kinds should ever match is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
