id: b315-long-word
task_type: function_implementation
task: >-
  Implement long_word. Return the longest word of a sentence, where
  any run of spaces separates two words. When two words are equally
  long the one appearing first wins, and a sentence holding no words
  at all gives back empty text.
target: solution.py
interface: "def long_word(sentence: str) -> str"
stop_conditions:
  - Whether punctuation attached to a word should count toward its length is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
