id: b306-fill-gaps
task_type: bug_fix
task: >-
  is_gap says whether a reading is missing, a missing reading being
  written as minus one. fill_gaps replaces each missing reading with
  the last real one seen before it, and it uses the next real one
  after it instead. Fix fill_gaps. A missing reading before any real
  one stays missing. Return the complete fixed file.
target: solution.py
target_content: |
  def is_gap(reading: int) -> bool:
      return reading == -1


  def fill_gaps(readings: list) -> list:
      """Missing readings replaced by the last real one seen."""
      filled = list(readings)
      for i in range(len(filled)):
          if is_gap(filled[i]):
              for later in filled[i + 1 :]:
                  if not is_gap(later):
                      filled[i] = later
                      break
      return filled
interface: "def is_gap(reading: int) -> bool
def fill_gaps(readings: list) -> list"
stop_conditions:
  - Whether a reading of minus one that was genuinely measured could be told apart from a missing one is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
