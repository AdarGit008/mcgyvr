id: b347-file-size
task_type: bug_fix
task: >-
  size_unit names the unit a byte count is written in. size_text
  writes the count in whole units of that size, and it divides by a
  thousand where a kilobyte is a thousand and twenty-four bytes. Fix
  size_text. A count below zero is rejected with an error. Return the
  complete fixed file.
target: solution.py
target_content: |
  def size_unit(bytes_count: int) -> str:
      if bytes_count < 1024:
          return "B"
      if bytes_count < 1024 * 1024:
          return "KB"
      return "MB"


  def size_text(bytes_count: int) -> str:
      """A byte count written in whole units."""
      if bytes_count < 0:
          raise ValueError("a byte count cannot be negative")
      unit = size_unit(bytes_count)
      if unit == "B":
          return str(bytes_count) + " B"
      if unit == "KB":
          return str(bytes_count // 1000) + " KB"
      return str(bytes_count // (1000 * 1000)) + " MB"
interface: "def size_unit(bytes_count: int) -> str
def size_text(bytes_count: int) -> str"
stop_conditions:
  - Whether a count of a thousand megabytes or more should take a further unit is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
