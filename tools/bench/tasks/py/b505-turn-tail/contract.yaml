id: b505-turn-tail
task_type: bug_fix
task: >-
  turn_tail turns round the closing stretch of a run, leaving
  everything before it standing as it was. A count reaching past the
  run turns the whole of it. Fix turn_tail. A count of nothing leaves
  the run alone. Return the complete fixed file.
target: solution.py
target_content: |
  def turn_tail(entries: list[str], count: int) -> list[str]:
      out = []
      stop = len(entries) if count > len(entries) else count
      for i in range(stop - 1, -1, -1):
          out.append(entries[i])
      for i in range(stop, len(entries)):
          out.append(entries[i])
      return out
interface: "def turn_tail(entries: list[str], count: int) -> list[str]"
stop_conditions:
  - Whether a count below nothing should turn the opening stretch instead is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
