id: b219-cut-roll
task_type: function_implementation
task: >-
  Implement cut_roll. A mill sells a fabric roll of length whole metres by
  cutting it into sellable pieces. board lists what the pieces fetch as
  [metres, price] pairs, each metres a positive whole number listed once and
  each price a non-negative whole number; metres the mill does not cut into a
  piece are scrap and fetch nothing. Return a mapping with takings, the
  greatest price the roll can fetch, and pieces, the metre lengths of a cut
  that fetches it, largest first. Build the answer up from a roll of 0 metres,
  which fetches 0: for a roll of some length, weigh cutting each board piece
  that fits off its end against scrapping its last metre, and keep the best —
  on a tie prefer cutting a piece to scrapping, and the longer piece to the
  shorter. A roll of 0 metres, and a roll no board piece fits, fetch 0 with no
  pieces. Reject a length that is not a non-negative whole number with an
  error.
target: solution.py
target_content: |
  """Cut a fabric roll for the greatest takings the price board allows."""


  def cut_roll(length: int, board: list[tuple[int, int]]) -> dict:
      if isinstance(length, bool) or not isinstance(length, int) or length < 0:
          raise ValueError("length must be a non-negative whole number")
      order = sorted(board, key=lambda entry: -entry[0])
      best = [0] * (length + 1)
      taken = [0] * (length + 1)
      for metres in range(1, length + 1):
          best[metres] = -1
          for piece, price in order:
              if piece <= metres and price + best[metres - piece] > best[metres]:
                  best[metres] = price + best[metres - piece]
                  taken[metres] = piece
          if best[metres - 1] > best[metres]:
              best[metres] = best[metres - 1]
              taken[metres] = 0
      pieces: list[int] = []
      # TODO: walk back from the full roll, collecting the piece cut at each step.
      return {"takings": best[length], "pieces": pieces}
interface: "def cut_roll(length: int, board: list[tuple[int, int]]) -> dict"
stop_conditions:
  - Whether a piece longer than the roll itself may appear on the board is not stated.
acceptance: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
