id: b004-install-order
task_type: bug_fix
task: >-
  install_order arranges packages into an installation order incorrectly.
  Fix it: the input is a list of package names and a list of requirement
  pairs, each pair [pkg, needed] meaning needed must already be installed
  when pkg is installed. Every package is installed exactly once,
  requirements always come first, and whenever several packages could
  equally go next the one whose name sorts alphabetically first goes
  next — at present the newest available package jumps the queue instead.
  A repeated requirement pair is harmless. Also add the missing
  validation: reject a package name listed twice, a requirement pair
  naming a package absent from the list, and requirements that chase
  each other in a cycle — at present a cycle silently yields a truncated
  order. Reject each with an error. Return the complete fixed file.
target: solution.py
target_content: |
  """An installation order for packages under prerequisite pairs."""


  def install_order(packages, requires):
      needs = {name: 0 for name in packages}
      enables = {name: [] for name in packages}
      for pkg, needed in requires:
          needs[pkg] += 1
          enables[needed].append(pkg)
      ready = [name for name in packages if needs[name] == 0]
      order = []
      while ready:
          next_name = ready.pop()
          order.append(next_name)
          for follower in enables[next_name]:
              needs[follower] -= 1
              if needs[follower] == 0:
                  ready.append(follower)
      return order
interface: "def install_order(packages: list, requires: list) -> list"
stop_conditions:
  - Whether the packages list itself may be reordered in place is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
