      # TODO: reject a bad slot count and non-integer keys, then replay
      # the stream against the slot table, counting hits and evicting
      # on every miss.
      held = [None] * slots
      hits = 0
      return hits
interface: "def slot_hits(keys: list, slots: int) -> int"
stop_conditions:
  - How a keys argument that is not a list is treated is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
