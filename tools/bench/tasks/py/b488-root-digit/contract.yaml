id: b488-root-digit
task_type: bug_fix
task: >-
  root_digit folds a whole count down to a single figure by adding its
  figures together, then adding the figures of that answer, again and
  again until one figure is left. Fix root_digit. A count already
  standing as one figure is given back as it is. Return the complete
  fixed file.
target: solution.py
target_content: |
  def root_digit(value: int) -> int:
      left = value
      if left >= 10:
          total = 0
          while left > 0:
              total += left % 10
              left = left // 10
          left = total
      return left
interface: "def root_digit(value: int) -> int"
stop_conditions:
  - Whether a count below nothing should be folded is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
