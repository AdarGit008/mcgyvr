id: b428-run-decode
task_type: function_implementation
task: >-
  Implement run_decode. A run is written as a letter followed by how
  many times it repeats, so A3B1 stands for AAAB. Return the letters
  written out in full. A count may run to more than one digit, and
  empty text decodes to empty text.
target: solution.py
interface: "def run_decode(coded: str) -> str"
stop_conditions:
  - What a letter followed by no count at all should decode to is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
