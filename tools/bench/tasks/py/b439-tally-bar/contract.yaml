id: b439-tally-bar
task_type: function_implementation
task: >-
  Implement tally_bar. Draw a count as that many hashes, but never
  more than a stated width, and mark a bar that had to be cut short by
  ending it in a greater-than sign in place of the last hash. A count
  of nothing draws an empty bar.
target: solution.py
interface: "def tally_bar(count: int, width: int) -> str"
stop_conditions:
  - Whether a width of nothing should still mark a cut bar is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
