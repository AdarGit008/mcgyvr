id: b243-bin-spill
task_type: bug_fix
task: >-
  bin_add and bin_spill keep counts per bin. bin_add adds a count to
  one bin and returns the updated record without changing the one it
  was given. bin_spill lists the bins standing above a limit, in the
  order the bins were first added, and it has the comparison wrong: it
  also lists a bin sitting exactly at the limit. Fix it. Return the
  complete fixed file.
target: solution.py
target_content: |
  def bin_spill(bins: dict, limit: int) -> list:
      """The bins standing above a limit, in the order they were added."""
      return [name for name, held in bins.items() if held >= limit]


  def bin_add(bins: dict, name: str, count: int) -> dict:
      updated = dict(bins)
      updated[name] = updated.get(name, 0) + count
      return updated
interface: "def bin_spill(bins: dict, limit: int) -> list\ndef bin_add(bins: dict, name: str, count: int) -> dict"
stop_conditions:
  - Whether a bin holding a negative count can ever spill is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
