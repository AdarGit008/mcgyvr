id: b418-over-count
task_type: bug_fix
task: >-
  over_count returns how many of a store's values reach a floor, and
  it counts the ones standing below it instead. Fix it. A store
  holding nothing counts nothing. Return the complete fixed file.
target: solution.py
target_content: |
  def over_count(store: dict, floor: int) -> int:
      """How many of a store's values reach a floor."""
      found = 0
      for value in store.values():
          if value < floor:
              found += 1
      return found
interface: "def over_count(store: dict, floor: int) -> int"
stop_conditions:
  - Whether a value that is not a number should be counted is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
