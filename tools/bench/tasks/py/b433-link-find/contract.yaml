id: b433-link-find
task_type: function_implementation
task: >-
  Implement link_find. Return every piece of a line standing between
  an opening and a closing marker, in the order they appear and
  without the markers themselves. An opening marker never closed
  yields nothing, and the markers do not nest.
target: solution.py
interface: "def link_find(line: str, opens: str, closes: str) -> list"
stop_conditions:
  - Whether a closing marker standing alone should be a mistake is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
