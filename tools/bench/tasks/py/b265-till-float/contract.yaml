id: b265-till-float
task_type: bug_fix
task: >-
  till_float works out how many of each coin to hand back for an
  amount, always reaching for the largest coin it can, and it reaches
  wrongly: having used a coin once it moves straight on to the next
  one. Fix it so it uses as many of each coin as will fit. Coins
  arrive largest first. Return the complete fixed file.
target: solution.py
target_content: |
  def till_float(amount: int, coins: list) -> list:
      """How many of each coin to hand back, largest coin first."""
      counts = []
      left = amount
      for coin in coins:
          if left >= coin:
              counts.append(1)
              left -= coin
          else:
              counts.append(0)
      return counts
interface: "def till_float(amount: int, coins: list) -> list"
stop_conditions:
  - Whether an amount that cannot be made exactly should be reported somehow is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
