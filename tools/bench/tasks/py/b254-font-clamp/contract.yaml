id: b254-font-clamp
task_type: function_implementation
task: >-
  Implement font_clamp. Bring a requested size inside an allowed
  range: a size under the smallest allowed becomes the smallest, a
  size over the largest becomes the largest, and a size already inside
  comes back unchanged. Reject a range whose smallest is above its
  largest with an error.
target: solution.py
interface: "def font_clamp(size: int, smallest: int, largest: int) -> int"
stop_conditions:
  - Whether a fractional size should be rounded before clamping is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
