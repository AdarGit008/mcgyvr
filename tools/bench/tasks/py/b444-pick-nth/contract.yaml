id: b444-pick-nth
task_type: bug_fix
task: >-
  pick_nth returns the entry standing at a place in a list, counting
  places from one, or empty text when the place falls outside the
  list, and it counts places from zero. Fix it. Return the complete
  fixed file.
target: solution.py
target_content: |
  def pick_nth(entries: list, place: int) -> str:
      """The entry at a place, counting places from one."""
      if place < 0 or place >= len(entries):
          return ""
      return entries[place]
interface: "def pick_nth(entries: list, place: int) -> str"
stop_conditions:
  - Whether a place below one should count from the end is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
