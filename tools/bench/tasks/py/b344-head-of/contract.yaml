id: b344-head-of
task_type: bug_fix
task: >-
  head_of returns the first few entries of a list and it returns the
  last few instead. Fix it. Asking for more entries than the list
  holds returns all of them, and asking for none returns nothing.
  Return the complete fixed file.
target: solution.py
target_content: |
  def head_of(entries: list, count: int) -> list:
      """The first few entries of a list."""
      if count <= 0:
          return []
      return entries[-count:]
interface: "def head_of(entries: list, count: int) -> list"
stop_conditions:
  - Whether a count below zero should be treated as none is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
