id: b253-route-stops
task_type: function_implementation
task: >-
  Implement route_stops and route_hops. route_stops breaks a route
  written as stop names joined by greater-than signs into the stops
  themselves, trimming any spaces around each one. route_hops counts
  the journeys between stops, one fewer than the stops, and none at
  all for a blank route.
target: solution.py
interface: "def route_stops(route: str) -> list\ndef route_hops(route: str) -> int"
stop_conditions:
  - Whether a route may name the same stop twice is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
