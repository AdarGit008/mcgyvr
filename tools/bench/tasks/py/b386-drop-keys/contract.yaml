id: b386-drop-keys
task_type: bug_fix
task: >-
  drop_keys returns a store without the keys a list names, and it
  keeps only those keys instead. Fix it. Naming a key the store does
  not hold changes nothing, and the store it was given is never
  altered. Return the complete fixed file.
target: solution.py
target_content: |
  def drop_keys(store: dict, keys: list) -> dict:
      """The store without the keys a list names."""
      kept = {}
      for key, value in store.items():
          if key in keys:
              kept[key] = value
      return kept
interface: "def drop_keys(store: dict, keys: list) -> dict"
stop_conditions:
  - Whether a key named twice should be dropped twice is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
