id: b298-price-vat
task_type: bug_fix
task: >-
  gross_price adds a whole-percent tax to a net price and returns
  whole pence, and it adds the rate as a number of pence instead of as
  a percentage. Fix it. The tax is rounded down, and a rate of zero
  leaves the price exactly as it was. Return the complete fixed file.
target: solution.py
target_content: |
  def gross_price(net: int, rate: int) -> int:
      """A net price with a whole-percent tax added, in whole pence."""
      return net + rate
interface: "def gross_price(net: int, rate: int) -> int"
stop_conditions:
  - Whether a rate carrying a fraction of a percent should be accepted is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
