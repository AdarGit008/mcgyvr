id: b233-slot-pack
task_type: bug_fix
task: >-
  slot_pack groups items into slots holding at most a given capacity,
  keeping the original order, and it gets the boundary wrong: one
  extra item lands in every slot and items repeat across slots. Fix it
  so no slot exceeds the capacity and each item appears once. The
  final slot may be short. Return the complete fixed file.
target: solution.py
target_content: |
  def slot_pack(items: list, capacity: int) -> list:
      """Group items into slots of a fixed capacity, in order."""
      slots = []
      for i in range(0, len(items), capacity):
          slots.append(items[i : i + capacity + 1])
      return slots
interface: "def slot_pack(items: list, capacity: int) -> list"
stop_conditions:
  - What a capacity of zero should produce is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
