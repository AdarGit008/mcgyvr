id: b391-oxford-join
task_type: function_implementation
task: >-
  Implement oxford_join. Join a list of names into one phrase. Two
  names are joined by the word and; three or more take a comma between
  every pair but the last, which takes the word and. One name stands
  alone and no names at all give empty text.
target: solution.py
interface: "def oxford_join(names: list) -> str"
stop_conditions:
  - Whether a comma should also stand before the word and is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
