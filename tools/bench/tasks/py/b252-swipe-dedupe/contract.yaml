id: b252-swipe-dedupe
task_type: function_implementation
task: >-
  Implement swipe_dedupe. Given card swipes in the order they were
  recorded, drop any swipe that simply repeats the one immediately
  before it, keeping the first of each such run. A card swiped again
  later, with a different card in between, is kept.
target: solution.py
interface: "def swipe_dedupe(swipes: list) -> list"
stop_conditions:
  - Whether two swipes far apart in time should ever be collapsed is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
