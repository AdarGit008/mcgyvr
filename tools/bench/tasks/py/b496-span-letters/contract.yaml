id: b496-span-letters
task_type: bug_fix
task: >-
  span_letters opens out a written span such as a dash between two
  letters into every letter from the first to the last, the last one
  included. Anything not written as exactly two letters with a dash
  between them, or running backward, is given back untouched. Fix
  span_letters. Return the complete fixed file.
target: solution.py
target_content: |
  def span_letters(span: str) -> str:
      if len(span) != 3 or span[1] != "-":
          return span
      start = ord(span[0])
      end = ord(span[2])
      if start > end:
          return span
      out = ""
      for code in range(start, end):
          out += chr(code)
      return out
interface: "def span_letters(span: str) -> str"
stop_conditions:
  - Whether a span written across the two cases should be opened out is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
