id: b205-apply-charges
task_type: function_implementation
task: >-
  Implement apply_charges. Quotas arrive as a mapping from bucket name to a
  pair of the bucket's whole allowance and the largest single charge that
  bucket will take. Charges are triples of charge id, bucket name and
  amount, applied one after another in the order given. A charge naming a
  bucket the mapping does not hold is refused for the reason "unknown"; a
  charge whose amount stands above its bucket's largest single charge is
  refused for "single"; a charge whose amount stands above what its bucket
  has left is refused for "cap"; any charge surviving those three tests is
  accepted and its amount comes off what the bucket has left. The tests run
  in that order and only the first reason that fits is recorded. Return an
  object holding left, the allowance still standing in every bucket of the
  mapping, and refused, the pairs of charge id and reason in the order they
  were refused. Reject an amount that is not a positive whole number with
  an error.
target: solution.py
target_content: |
  def _why_refused(cap, left: int, amount: int) -> str:
      if cap is None:
          return "unknown"
      if amount > cap[1]:
          return "single"
      return "cap" if amount > left else ""


  def apply_charges(caps: dict, charges: list) -> dict:
      left = {name: cap[0] for name, cap in caps.items()}
      refused = []
      # TODO: put every charge through _why_refused before it is spent, and
      # send the ones that come back with a reason to the refused list
      # instead of taking their amount off the bucket. This placeholder
      # spends every charge blindly.
      for _, bucket, amount in charges:
          left[bucket] -= amount
      return {"left": left, "refused": refused}
interface: "def apply_charges(caps: dict, charges: list) -> dict"
stop_conditions:
  - Whether the same charge id may appear on more than one charge is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
