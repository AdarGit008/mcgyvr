id: b324-grid-flip
task_type: function_implementation
task: >-
  Implement grid_flip. Given a grid written as a list of rows, return
  it turned so that its columns become its rows: the first row of the
  answer holds the first value of every row in order. A grid with no
  rows gives an empty grid.
target: solution.py
interface: "def grid_flip(grid: list) -> list"
stop_conditions:
  - Whether rows of differing lengths should be handled is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
