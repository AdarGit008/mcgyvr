id: b294-ramp-plan
task_type: function_implementation
task: >-
  Implement ramp_step and ramp_plan. ramp_step returns the next value
  moving from one value toward a target by at most a given step, never
  overshooting the target. ramp_plan returns every value visited going
  from a start to a target, both ends included. A start already at the
  target gives just that one value.
target: solution.py
interface: "def ramp_step(current: int, target: int, step: int) -> int
def ramp_plan(start: int, target: int, step: int) -> list"
stop_conditions:
  - What should happen when the step is zero and the start is not already at the target is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
