id: b341-key-miss
task_type: bug_fix
task: >-
  look_up returns the value a mapping holds for a key, or a stated
  fallback when the key is absent, and it hands back the fallback when
  the stored value is empty text as well. Fix it so only an absent key
  takes the fallback. Return the complete fixed file.
target: solution.py
target_content: |
  def look_up(store: dict, key: str, fallback: str) -> str:
      """A mapping's value for a key, or a fallback when it is absent."""
      return store.get(key) or fallback
interface: "def look_up(store: dict, key: str, fallback: str) -> str"
stop_conditions:
  - Whether a key should be matched ignoring case is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
