id: b266-span-merge
task_type: function_implementation
task: >-
  Implement span_merge. Given booking spans as a start and an end
  each, combine every span that overlaps another, or merely touches it
  end to start, into a single span. Return what is left ordered by
  start. Spans arrive in no particular order.
target: solution.py
interface: "def span_merge(spans: list) -> list"
stop_conditions:
  - Whether a span whose end precedes its start is possible is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
