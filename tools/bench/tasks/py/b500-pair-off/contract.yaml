id: b500-pair-off
task_type: bug_fix
task: >-
  pair_off takes marks away in neighbouring pairs. Where a mark meets
  one of its own kind standing next to it, both go, and whatever they
  stood between becomes neighbouring in turn and may pair off as well.
  Fix pair_off. Return the complete fixed file.
target: solution.py
target_content: |
  def pair_off(marks: list[str]) -> list[str]:
      left = []
      for mark in marks:
          if len(left) > 0 and left[len(left) - 1] == mark:
              continue
          left.append(mark)
      return left
interface: "def pair_off(marks: list[str]) -> list[str]"
stop_conditions:
  - Whether three of a kind standing together should leave one or none is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
