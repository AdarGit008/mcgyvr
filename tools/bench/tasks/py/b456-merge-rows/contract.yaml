id: b456-merge-rows
task_type: bug_fix
task: >-
  row_keys returns the names a row holds, in the order it holds them.
  merge_rows lays one row over another so the second row's values win
  where both hold a name, and it lets the first row win instead. Fix
  merge_rows. Neither row given is ever altered. Return the complete
  fixed file.
target: solution.py
target_content: |
  def row_keys(row: dict) -> list:
      return list(row.keys())


  def merge_rows(under: dict, over: dict) -> dict:
      """One row laid over another, the row above winning."""
      merged = dict(over)
      for key in row_keys(under):
          merged[key] = under[key]
      return merged
interface: "def row_keys(row: dict) -> list
def merge_rows(under: dict, over: dict) -> dict"
stop_conditions:
  - Whether a name holding empty text should still win is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
