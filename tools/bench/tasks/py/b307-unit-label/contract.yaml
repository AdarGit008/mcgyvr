id: b307-unit-label
task_type: bug_fix
task: >-
  short_unit returns the short form of a unit's name, its first three
  letters. label_of writes an amount with its unit, using the singular
  form when the amount is one and adding an s otherwise, and it adds
  the s for one as well. Fix label_of. An amount below zero is
  rejected with an error. Return the complete fixed file.
target: solution.py
target_content: |
  def short_unit(unit: str) -> str:
      return unit[:3]


  def label_of(amount: int, unit: str) -> str:
      """An amount written with its unit."""
      if amount < 0:
          raise ValueError("amount cannot be negative")
      return str(amount) + " " + unit + "s"
interface: "def short_unit(unit: str) -> str
def label_of(amount: int, unit: str) -> str"
stop_conditions:
  - Whether a unit whose plural is irregular should be written differently is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
