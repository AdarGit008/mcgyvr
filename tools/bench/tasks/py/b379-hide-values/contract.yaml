id: b379-hide-values
task_type: bug_fix
task: >-
  hide_values returns a store with every value starred out, one star
  for each character it held, and it stars out the keys instead. Fix
  it. A store holding nothing comes back holding nothing. Return the
  complete fixed file.
target: solution.py
target_content: |
  def hide_values(store: dict) -> dict:
      """A store with every value starred out."""
      hidden = {}
      for key, value in store.items():
          hidden["*" * len(key)] = value
      return hidden
interface: "def hide_values(store: dict) -> dict"
stop_conditions:
  - Whether the keys should be hidden too when they carry secrets is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
