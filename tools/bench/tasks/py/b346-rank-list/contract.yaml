id: b346-rank-list
task_type: bug_fix
task: >-
  rank_of returns a score's rank among the others: one more than the
  number of scores standing above it. rank_all ranks a whole list in
  the order it was given, and it hands tied scores different ranks.
  Fix rank_all so tied scores share a rank. Return the complete fixed
  file.
target: solution.py
target_content: |
  def rank_of(score: int, scores: list) -> int:
      above = 0
      for other in scores:
          if other > score:
              above += 1
      return above + 1


  def rank_all(scores: list) -> list:
      """Each score's rank, in the order the scores were given."""
      ordered = sorted(scores, reverse=True)
      places = {}
      for i, value in enumerate(ordered):
          places[value] = i + 1
      return [places[score] for score in scores]
interface: "def rank_of(score: int, scores: list) -> int
def rank_all(scores: list) -> list"
stop_conditions:
  - Whether scores should be ranked lowest first when the contest is a race is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
