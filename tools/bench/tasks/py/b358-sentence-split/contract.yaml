id: b358-sentence-split
task_type: bug_fix
task: >-
  sentence_split breaks a passage into its sentences, which end at a
  full stop, a question mark or an exclamation mark, and it only ever
  breaks at a full stop. Fix it. Each sentence comes back trimmed of
  surrounding spaces, and empty pieces are left out. Return the
  complete fixed file.
target: solution.py
target_content: |
  import re


  def sentence_split(passage: str) -> list:
      """A passage broken into its sentences."""
      pieces = re.split(r"[.]", passage)
      return [piece.strip() for piece in pieces if piece.strip()]
interface: "def sentence_split(passage: str) -> list"
stop_conditions:
  - Whether a full stop inside an abbreviation should end a sentence is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
