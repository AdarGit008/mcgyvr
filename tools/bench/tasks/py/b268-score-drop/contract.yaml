id: b268-score-drop
task_type: function_implementation
task: >-
  Implement score_drop. Given a list of scores, return their total
  with the single lowest score left out. When the lowest score appears
  more than once only one of them is dropped. A list holding one score
  or none at all totals zero.
target: solution.py
interface: "def score_drop(scores: list) -> int"
stop_conditions:
  - Whether a score below zero should be treated as a real score or as a missing entry is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
