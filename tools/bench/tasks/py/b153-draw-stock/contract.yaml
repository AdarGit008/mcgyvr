id: b153-draw-stock
task_type: function_implementation
task: >-
  Implement draw_stock. The shelf maps each item name to a count on hand,
  and the order is a list of [item, count] lines to pull from the shelf,
  applied first to last. Return a new mapping of what remains on the shelf,
  every shelf item still present even when its count reaches zero; the
  shelf passed in is never modified. Reject a shelf count that is not a
  non-negative whole number, an order that is not a list, a line whose
  count is not a positive whole number, a line naming an item the shelf
  does not hold, and a line pulling more of an item than the earlier lines
  left, with an error.
target: solution.py
interface: "def draw_stock(shelf: dict, order: list) -> dict"
stop_conditions:
  - Whether an order line may carry a shape other than exactly an item and a count is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
