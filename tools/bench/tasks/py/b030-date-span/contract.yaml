id: b030-date-span
task_type: bug_fix
task: >-
  span_days counts the days between two calendar dates incorrectly around
  leap years. Fix it: each date is a [year, month, day] triple of the
  proleptic Gregorian calendar, and the result is how many days lie from
  the start date to the end date, the start day counted and the end day
  not, so equal dates span zero. A leap year is one divisible by 4, except
  that century years are leap only when divisible by 400: 1900 gives
  February 28 days while 2000 gives it 29. The current code applies the
  divisible-by-4 rule alone, so any span touching a century year drifts.
  Also add the missing validation: reject with an error a start date after
  the end date, a month outside 1 to 12, a day outside the real length of
  its month in its year (February 29 only in a leap year), and a date
  component that is not an integer. Return the complete fixed file.
target: solution.py
target_content: |
  """How many days lie between two proleptic Gregorian calendar dates."""

  MONTH_LENGTHS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]


  def _is_leap(year):
      return year % 4 == 0


  def _month_length(year, month):
      if month == 2 and _is_leap(year):
          return 29
      return MONTH_LENGTHS[month - 1]


  def _to_ordinal(date):
      year, month, day = date
      prior = year - 1
      days = prior * 365 + prior // 4
      for earlier in range(1, month):
          days += _month_length(year, earlier)
      return days + day


  def span_days(start: list, end: list) -> int:
      return _to_ordinal(end) - _to_ordinal(start)
interface: "def span_days(start: list, end: list) -> int"
stop_conditions:
  - Whether years before 1 or a date list of the wrong length must be handled is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
