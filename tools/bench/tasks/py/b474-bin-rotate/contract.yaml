id: b474-bin-rotate
task_type: bug_fix
task: >-
  bin_rotate moves every entry forward by a given number of places,
  with entries running off the end coming back at the front. Fix
  bin_rotate. A move of nothing leaves the run as it is, an empty run
  stays empty, and a move as long as the run returns it unchanged.
  Return the complete fixed file.
target: solution.py
target_content: |
  def bin_rotate(entries: list[str], places: int) -> list[str]:
      if len(entries) == 0:
          return []
      shift = places % len(entries)
      out = []
      for i in range(len(entries)):
          out.append(entries[(i + shift) % len(entries)])
      return out
interface: "def bin_rotate(entries: list[str], places: int) -> list[str]"
stop_conditions:
  - Whether a number of places below nothing should turn the run the other way is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
