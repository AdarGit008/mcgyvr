id: b140-folder-heft
task_type: function_implementation
task: >-
  Implement heavy_folders, the report at the top of a small storage-tree
  module whose two companions are already written. A tree node is a
  mapping holding name plus either bytes, making it a file of that many
  bytes, or children, making it a folder over a list of nodes; a node's
  path joins the names from the root down to it with slashes. file_paths
  lists the path of every file, walking each folder's children in order,
  a folder's contents before its next sibling; a file root yields its own
  name alone. tree_bytes totals the bytes a node holds — a file its own, a
  folder the sum over its children, an empty folder zero. heavy_folders
  returns a [path, bytes] pair for every folder whose total reaches at
  least min_bytes — the root included when it is a folder, a file root
  yielding an empty list — in the same walking order as file_paths. All
  three reject, at any depth, a node that is not a mapping, a name that
  is not a non-empty string or holds a slash, a node with both bytes and
  children or neither, a bytes that is not a non-negative whole number,
  and a children that is not a list; heavy_folders also rejects a min_bytes
  that is not a non-negative whole number, with an error.
target: solution.py
target_content: |
  """A storage report over a tree of named folders and byte-sized files."""


  def check_node(node):
      if not isinstance(node, dict):
          raise ValueError("each node must be a mapping")
      name = node.get("name")
      if not isinstance(name, str) or not name or "/" in name:
          raise ValueError("each name must be a non-empty string without slashes")
      if ("bytes" in node) == ("children" in node):
          raise ValueError("a node holds either bytes or children")
      size = node.get("bytes", 0)
      if isinstance(size, bool) or not isinstance(size, int) or size < 0:
          raise ValueError("bytes must be a non-negative whole number")
      if "children" in node and not isinstance(node["children"], list):
          raise ValueError("children must be a list")


  def file_paths(root: dict) -> list:
      paths = []
      stack = [(root, "")]
      while stack:
          node, prefix = stack.pop()
          check_node(node)
          path = prefix + node["name"]
          if "bytes" in node:
              paths.append(path)
          else:
              for child in reversed(node["children"]):
                  stack.append((child, path + "/"))
      return paths


  def tree_bytes(root: dict) -> int:
      total = 0
      stack = [root]
      while stack:
          node = stack.pop()
          check_node(node)
          if "bytes" in node:
              total += node["bytes"]
          else:
              stack.extend(node["children"])
      return total


  def heavy_folders(root: dict, min_bytes: int) -> list:
      # TODO: validate min_bytes, walk the folders in file_paths' order, and
      # report a [path, total] pair for every folder reaching min_bytes.
      total = tree_bytes(root)
      return [[root["name"], total]] if total >= min_bytes else []
interface: |-
  def file_paths(root: dict) -> list
  def tree_bytes(root: dict) -> int
  def heavy_folders(root: dict, min_bytes: int) -> list
stop_conditions:
  - Whether two sibling nodes may share a name is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
