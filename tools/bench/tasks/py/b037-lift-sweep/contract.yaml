id: b037-lift-sweep
task_type: bug_fix
task: >-
  run_lift serves a lift's calls in the wrong order. The module splits
  calls with split_calls, where each call is a [floor, direction] pair
  whose direction is up or down, repeated identical calls collapse to one,
  and the result carries the up-call floors at or above the boarding floor
  (up_ahead), the up-call floors below it (up_behind) and every down-call
  floor (down), each list ascending; it rejects a boarding floor that is
  not an integer, a calls argument that is not a list, a call that is not
  a two-item pair, a call floor that is not an integer and a direction
  that is neither up nor down, with an error. lift_distance totals the
  floors travelled from the boarding floor through a stop list in order,
  rejecting a non-integer boarding floor, a stops argument that is not a
  list and a non-integer stop with an error. sweep_report bundles one
  sweep: its stops, the travel they cost, and how many direction
  reversals the lift makes serving them, counting only moves that change
  floors. A correct sweep serves up_ahead ascending, then the down calls
  from the highest floor to the lowest, then up_behind ascending, and no
  calls yields no stops; run_lift instead serves up_behind before the
  down sweep has run, and walks the down calls lowest-first — backwards.
  Fix run_lift so the stops come back in correct service order. Return
  the complete fixed file.
target: solution.py
target_content: |
  """A lift's service sweep: split directional call buttons around the
  boarding floor, run the sweep, and measure the travel it costs."""


  def split_calls(start: int, calls: list) -> dict:
      if isinstance(start, bool) or not isinstance(start, int):
          raise ValueError("boarding floor must be an integer")
      if not isinstance(calls, list):
          raise ValueError("calls must be a list")
      up = set()
      down = set()
      for call in calls:
          if not isinstance(call, list) or len(call) != 2:
              raise ValueError("each call is a [floor, direction] pair")
          floor, direction = call
          if isinstance(floor, bool) or not isinstance(floor, int):
              raise ValueError("call floor must be an integer")
          if direction not in ("up", "down"):
              raise ValueError("call direction must be up or down")
          if direction == "up":
              up.add(floor)
          else:
              down.add(floor)
      up_floors = sorted(up)
      return {
          "up_ahead": [floor for floor in up_floors if floor >= start],
          "up_behind": [floor for floor in up_floors if floor < start],
          "down": sorted(down),
      }


  def run_lift(start: int, calls: list) -> list:
      parts = split_calls(start, calls)
      stops = list(parts["up_ahead"])
      for floor in parts["up_behind"]:
          stops.append(floor)
      for floor in parts["down"]:
          stops.append(floor)
      return stops


  def lift_distance(start: int, stops: list) -> int:
      if isinstance(start, bool) or not isinstance(start, int):
          raise ValueError("boarding floor must be an integer")
      if not isinstance(stops, list):
          raise ValueError("stops must be a list")
      at = start
      travelled = 0
      for stop in stops:
          if isinstance(stop, bool) or not isinstance(stop, int):
              raise ValueError("each stop must be an integer")
          travelled += abs(stop - at)
          at = stop
      return travelled


  def sweep_report(start: int, calls: list) -> dict:
      stops = run_lift(start, calls)
      travelled = lift_distance(start, stops)
      reversals = 0
      at = start
      last_step = 0
      for stop in stops:
          step = 0 if stop == at else (1 if stop > at else -1)
          if step != 0:
              if last_step != 0 and step != last_step:
                  reversals += 1
              last_step = step
          at = stop
      return {"stops": stops, "travelled": travelled, "reversals": reversals}
interface: |-
  def split_calls(start: int, calls: list) -> dict
  def run_lift(start: int, calls: list) -> list
  def lift_distance(start: int, stops: list) -> int
  def sweep_report(start: int, calls: list) -> dict
stop_conditions:
  - Whether call floors may be negative is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
