id: b404-digit-count
task_type: function_implementation
task: >-
  Implement digit_count. Return how many digits a whole number is
  written with. Nothing is written with one digit, and a minus sign in
  front of a number is not a digit and is not counted.
target: solution.py
interface: "def digit_count(value: int) -> int"
stop_conditions:
  - Whether a number written with separators should be counted the same way is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
