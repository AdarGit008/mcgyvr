      # exactly; reject a label no sequence can spell.
      raise NotImplementedError
interface: |-
  def stamp_cover(label: str, dies: list) -> int
  def stamp_table(dies: list) -> dict
stop_conditions:
  - How long a label the engraver may be asked to price is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
