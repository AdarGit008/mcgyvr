id: b339-net-pay
task_type: bug_fix
task: >-
  net_pay takes a percentage off gross pay and then subtracts a flat
  fee, and it subtracts the fee first, so the percentage comes off the
  wrong amount. Fix it. The percentage is rounded down and pay never
  falls below zero. Return the complete fixed file.
target: solution.py
target_content: |
  def net_pay(gross: int, rate: int, fee: int) -> int:
      """Gross pay less a percentage and then a flat fee."""
      after_fee = gross - fee
      return max(after_fee - after_fee * rate // 100, 0)
interface: "def net_pay(gross: int, rate: int, fee: int) -> int"
stop_conditions:
  - Whether the flat fee should still apply when gross pay is nothing is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
