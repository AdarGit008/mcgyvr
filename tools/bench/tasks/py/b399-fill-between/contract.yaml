id: b399-fill-between
task_type: function_implementation
task: >-
  Implement fill_between. Return a list with a filler placed between
  every two neighbouring entries, so three entries come back as five.
  A list of one entry, or none at all, takes no filler.
target: solution.py
interface: "def fill_between(entries: list, filler: str) -> list"
stop_conditions:
  - Whether the filler may equal one of the entries is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
