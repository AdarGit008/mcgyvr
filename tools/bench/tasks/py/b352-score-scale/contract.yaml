id: b352-score-scale
task_type: function_implementation
task: >-
  Implement score_scale. Restate a mark given out of one total as a
  mark out of another, rounded down. A mark standing above the total
  it was given out of still cannot pass the new total, and a total of
  nothing to scale from gives a mark of nothing.
target: solution.py
interface: "def score_scale(mark: int, was_out_of: int, now_out_of: int) -> int"
stop_conditions:
  - Whether a mark below zero should scale in the same way is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
