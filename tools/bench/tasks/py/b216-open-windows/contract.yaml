id: b216-open-windows
task_type: function_implementation
task: >-
  Implement open_windows. A clinic's day is described by span, its opening
  stretch written as two clock times joined by a hyphen in the form
  HH:MM-HH:MM, and by booked, the appointments of the day written the same
  way. The appointments arrive in no particular order, never overlap one
  another, and always sit inside the span. Return the free stretches of the
  day — the parts of the span no appointment covers — each rendered
  HH:MM-HH:MM with two digits for the hour and two for the minute, in time
  order and joined by ", ". Appointments that meet exactly leave no free
  stretch between them, and a day whose span is covered end to end returns
  the word "none". Reject a span or an appointment that is not two such
  clock times around a single hyphen with an error.
target: solution.py
target_content: |
  """Report the stretches of a clinic's day that no appointment covers."""

  import re


  def open_windows(span: str, booked: list[str]) -> str:
      def minutes(text: str) -> list[int]:
          parts = text.split("-")
          if len(parts) != 2 or any(re.fullmatch(r"\d{2}:\d{2}", p) is None for p in parts):
              raise ValueError("a range must be written HH:MM-HH:MM: " + text)
          return [int(p[:2]) * 60 + int(p[3:]) for p in parts]

      def stamp(at: int) -> str:
          return f"{at // 60:02d}:{at % 60:02d}"

      free: list[str] = []
      # TODO: sweep the appointments in time order and keep what the span has left over.
      return ", ".join(free) if free else "none"
interface: "def open_windows(span: str, booked: list[str]) -> str"
stop_conditions:
  - Whether an appointment may run past midnight into the next day is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
