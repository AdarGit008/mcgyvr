id: b304-pad-code
task_type: bug_fix
task: >-
  pad_code pads a code with zeros on its left until it reaches a fixed
  width, and it pads on the right instead. Fix it. A code already at
  or beyond the width comes back unchanged. Return the complete fixed
  file.
target: solution.py
target_content: |
  def pad_code(code: str, width: int) -> str:
      """A code padded with zeros to a fixed width."""
      return code.ljust(width, "0")
interface: "def pad_code(code: str, width: int) -> str"
stop_conditions:
  - Whether a character other than a zero should ever be used for the padding is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
