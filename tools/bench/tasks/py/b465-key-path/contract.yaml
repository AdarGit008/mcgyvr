id: b465-key-path
task_type: function_implementation
task: >-
  Implement key_path. Given a store whose names are joined by full
  stops, return the names standing directly under a stated head,
  without the head and its stop. Names under a deeper head are left
  out, in the order the store holds them.
target: solution.py
interface: "def key_path(store: dict, head: str) -> list"
stop_conditions:
  - Whether a name holding no stop at all should ever be under a head is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
