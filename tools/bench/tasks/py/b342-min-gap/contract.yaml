id: b342-min-gap
task_type: bug_fix
task: >-
  min_gap returns the smallest difference between any two of the
  values it is given, and it only ever compares neighbours without
  putting the values in order first. Fix it. Fewer than two values
  have no gap and give back minus one. Return the complete fixed file.
target: solution.py
target_content: |
  def min_gap(values: list) -> int:
      """The smallest difference between any two values."""
      if len(values) < 2:
          return -1
      smallest = abs(values[1] - values[0])
      for i in range(1, len(values)):
          gap = abs(values[i] - values[i - 1])
          if gap < smallest:
              smallest = gap
      return smallest
interface: "def min_gap(values: list) -> int"
stop_conditions:
  - Whether the two values making the smallest gap should be reported as well is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
