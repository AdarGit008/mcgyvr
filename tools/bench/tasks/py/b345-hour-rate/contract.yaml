id: b345-hour-rate
task_type: bug_fix
task: >-
  hour_rate returns what one hour is worth at a stated rate. week_pay
  pays that rate for up to forty hours and half as much again for
  every hour beyond, and it pays the higher rate on all the hours
  worked. Fix week_pay. Anything paid is rounded down. Return the
  complete fixed file.
target: solution.py
target_content: |
  def hour_rate(rate: int) -> int:
      return rate


  def week_pay(hours: int, rate: int) -> int:
      """Pay for a week, with overtime beyond forty hours."""
      if hours > 40:
          return hours * hour_rate(rate) * 3 // 2
      return hours * hour_rate(rate)
interface: "def hour_rate(rate: int) -> int
def week_pay(hours: int, rate: int) -> int"
stop_conditions:
  - Whether hours beyond a second threshold should be paid more again is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
