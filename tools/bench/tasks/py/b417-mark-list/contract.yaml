id: b417-mark-list
task_type: bug_fix
task: >-
  mark_list returns a list with a marker put against every entry that
  reaches a floor, written as the entry followed by a star, and it
  marks the entries below the floor instead. Fix it. Entries that do
  not qualify come back unchanged. Return the complete fixed file.
target: solution.py
target_content: |
  def mark_list(scores: list, floor: int) -> list:
      """Scores written out, with a star against those that reach a floor."""
      out = []
      for score in scores:
          out.append(str(score) + "*" if score < floor else str(score))
      return out
interface: "def mark_list(scores: list, floor: int) -> list"
stop_conditions:
  - Whether a marker other than a star should ever be used is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
