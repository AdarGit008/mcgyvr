id: b054-lane-pick
task_type: bug_fix
task: >-
  pickLane chooses which checkout lane a customer should join and chooses
  badly: it can point at a closed lane and it loses ties. Fix it: the first
  argument lists how many people wait in each lane, index by index; the
  second lists the indexes of the closed lanes. Return the index of the
  open lane with the fewest people waiting, and when several open lanes tie
  for fewest, the lowest index among them wins; a closed lane must never be
  returned, not even the first one. Also add the missing validation: reject
  a queues argument that is not a non-empty list, a queue length that is
  not a non-negative integer, a closed index that is not an integer
  pointing at a lane, and a call in which every lane is closed, with an
  error. Return the complete fixed file.
target: solution.ts
target_content: |
  export function pickLane(queues: number[], closed: number[]): number {
    let best = 0;
    for (let lane = 1; lane < queues.length; lane++) {
      if (queues[lane] <= queues[best] && !closed.includes(lane)) {
        best = lane;
      }
    }
    return best;
  }
interface: "export function pickLane(queues: number[], closed: number[]): number"
stop_conditions:
  - Whether the closed list may name the same lane twice is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
