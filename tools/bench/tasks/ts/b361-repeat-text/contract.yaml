id: b361-repeat-text
task_type: function_implementation
task: >-
  Implement repeatText. Return a phrase written out a given number of
  times, the copies joined by a stated separator. Asking for one copy
  gives the phrase alone with no separator, and asking for none or
  fewer gives empty text.
target: solution.ts
interface: "export function repeatText(phrase: string, times: number, between: string): string"
stop_conditions:
  - Whether the separator may itself be empty text is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
