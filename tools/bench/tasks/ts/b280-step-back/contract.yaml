id: b280-step-back
task_type: function_implementation
task: >-
  Implement stepBack. A walker starts at zero and follows a line of
  moves, F stepping one forward and B stepping one back. Return the
  furthest forward position reached at any point during the walk. A
  walk that never goes forward reaches zero, and any letter that is
  neither F nor B is ignored.
target: solution.ts
interface: "export function stepBack(moves: string): number"
stop_conditions:
  - Whether a lower-case f or b should count as a move is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
