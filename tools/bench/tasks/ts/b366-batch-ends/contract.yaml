id: b366-batch-ends
task_type: bug_fix
task: >-
  batchEnds reports the position of the last entry of each full batch
  of a stated size, and it reports the position of the first entry
  instead. Fix it. A final part-batch has no last entry to report and
  is left out. Return the complete fixed file.
target: solution.ts
target_content: |
  /** The position of the last entry of each full batch. */
  export function batchEnds(count: number, size: number): number[] {
    const ends: number[] = [];
    for (let start = 0; start + size <= count; start += size) {
      ends.push(start);
    }
    return ends;
  }
interface: "export function batchEnds(count: number, size: number): number[]"
stop_conditions:
  - What a batch size of zero or less should report is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
