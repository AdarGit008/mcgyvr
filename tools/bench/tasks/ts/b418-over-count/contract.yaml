id: b418-over-count
task_type: bug_fix
task: >-
  overCount returns how many of a store's values reach a floor, and it
  counts the ones standing below it instead. Fix it. A store holding
  nothing counts nothing. Return the complete fixed file.
target: solution.ts
target_content: |
  /** How many of a store's values reach a floor. */
  export function overCount(
    store: Record<string, number>,
    floor: number,
  ): number {
    let found = 0;
    for (const key of Object.keys(store)) {
      if (store[key] < floor) {
        found += 1;
      }
    }
    return found;
  }
interface: "export function overCount(store: Record<string, number>, floor: number): number"
stop_conditions:
  - Whether a value that is not a number should be counted is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
