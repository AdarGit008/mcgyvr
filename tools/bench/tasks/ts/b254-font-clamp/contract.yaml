id: b254-font-clamp
task_type: function_implementation
task: >-
  Implement fontClamp. Bring a requested size inside an allowed range:
  a size under the smallest allowed becomes the smallest, a size over
  the largest becomes the largest, and a size already inside comes
  back unchanged. Reject a range whose smallest is above its largest
  with an error.
target: solution.ts
interface: "export function fontClamp(size: number, smallest: number, largest: number): number"
stop_conditions:
  - Whether a fractional size should be rounded before clamping is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
