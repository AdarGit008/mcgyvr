id: b069-patrol-bot
task_type: function_implementation
task: >-
  Implement runPatrol; clampMove is already written. A patrol bot walks a
  corridor of width cells numbered 0 to width minus one. clampMove applies
  one signed move to a position: the bot lands at position plus delta,
  except that a wall stops it at cell 0 or at cell width minus one, and it
  reports the landing cell together with a flag telling whether a wall cut
  the move short. It rejects a width that is not a positive integer, a
  position that is not an integer inside the corridor, and a move that is
  not a non-zero integer, with an error. runPatrol starts the bot at start
  and applies the moves in order through clampMove, so those rejections
  carry through; it additionally rejects a moves argument that is not a
  list, with an error. Return {position, bumps, visited}: the final cell,
  how many moves a wall cut short, and how many distinct cells the bot has
  stood on after a move, counting the start; cells passed over mid-move do
  not count, and no moves leaves the bot at its start with one cell
  visited.
target: solution.ts
target_content: |
  export function clampMove(position: number, delta: number, width: number): [number, boolean] {
    if (!Number.isInteger(width) || width < 1) {
      throw new Error("width must be a positive integer");
    }
    if (!Number.isInteger(position) || position < 0 || position >= width) {
      throw new Error("position must sit inside the corridor");
    }
    if (!Number.isInteger(delta) || delta === 0) {
      throw new Error("a move must be a non-zero integer");
    }
    const raw = position + delta;
    const landed = Math.min(width - 1, Math.max(0, raw));
    return [landed, landed !== raw];
  }

  export function runPatrol(width: number, start: number, moves: number[]): Record<string, number> {
    // TODO: reject a non-list moves argument, then walk the moves with
    // clampMove, counting wall bumps and the distinct cells stood on
    // (the start counts), and report {position, bumps, visited}.
    throw new Error("not implemented");
  }
interface: |-
  export function runPatrol(width: number, start: number, moves: number[]): Record<string, number>
  export function clampMove(position: number, delta: number, width: number): [number, boolean]
stop_conditions:
  - How large the corridor may grow is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
