id: b412-step-plan
task_type: function_implementation
task: >-
  Implement stepAllowed and stepPlan. stepAllowed says whether moving
  from one state to another appears among the allowed moves. stepPlan
  returns the position of the first move a run of states makes that is
  not allowed, or minus one when every move is. Reject a run holding
  no states with an error.
target: solution.ts
interface: "export function stepAllowed(from: string, to: string, allowed: string[][]): boolean
export function stepPlan(states: string[], allowed: string[][]): number"
stop_conditions:
  - Whether a state may move to itself without that move being listed is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
