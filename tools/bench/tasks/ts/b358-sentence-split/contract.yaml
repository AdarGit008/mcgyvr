id: b358-sentence-split
task_type: bug_fix
task: >-
  sentenceSplit breaks a passage into its sentences, which end at a
  full stop, a question mark or an exclamation mark, and it only ever
  breaks at a full stop. Fix it. Each sentence comes back trimmed of
  surrounding spaces, and empty pieces are left out. Return the
  complete fixed file.
target: solution.ts
target_content: |
  /** A passage broken into its sentences. */
  export function sentenceSplit(passage: string): string[] {
    return passage
      .split(/[.]/)
      .map((piece) => piece.trim())
      .filter((piece) => piece !== "");
  }
interface: "export function sentenceSplit(passage: string): string[]"
stop_conditions:
  - Whether a full stop inside an abbreviation should end a sentence is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
