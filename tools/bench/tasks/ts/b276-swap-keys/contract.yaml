id: b276-swap-keys
task_type: function_implementation
task: >-
  Implement swapKeys. Given a mapping of names to codes, return the
  mapping the other way round, from each code to a name. When two
  names share one code, the name that sorts first is the one kept. A
  name whose code is empty text is left out altogether.
target: solution.ts
interface: "export function swapKeys(names: Record<string, string>): Record<string, string>"
stop_conditions:
  - Whether codes should be compared ignoring case when deciding that two names share one is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
