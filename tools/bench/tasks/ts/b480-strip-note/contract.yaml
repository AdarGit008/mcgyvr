id: b480-strip-note
task_type: bug_fix
task: >-
  stripNote takes a closing note off a title. A note is a round
  bracket opening somewhere in the title and closing at its very end,
  and only then is it removed, along with any spaces left trailing.
  Fix stripNote. A title with no such note is given back whole. Return
  the complete fixed file.
target: solution.ts
target_content: |
  export function stripNote(title: string): string {
    const opened = title.indexOf("(");
    if (opened === -1) {
      return title;
    }
    return title.slice(0, opened).trimEnd();
  }
interface: "export function stripNote(title: string): string"
stop_conditions:
  - Whether a title holding several notes should lose more than the last is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
