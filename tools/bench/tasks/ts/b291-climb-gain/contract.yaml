id: b291-climb-gain
task_type: function_implementation
task: >-
  Implement legGain and climbGain. legGain returns the height gained
  on one leg: the rise when the ground goes up, and zero when it goes
  down or stays level. climbGain adds the gains of every leg of a
  walk, given the heights in order. A walk of fewer than two heights
  gains nothing.
target: solution.ts
interface: "export function legGain(start: number, end: number): number
export function climbGain(heights: number[]): number"
stop_conditions:
  - Whether a rise smaller than the accuracy of the measurement should be ignored is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
