id: b338-count-back
task_type: bug_fix
task: >-
  countBack returns the numbers from a starting count down to one, and
  it runs one step too far and ends at zero. Fix it. A start of zero
  or less returns nothing at all. Return the complete fixed file.
target: solution.ts
target_content: |
  /** The numbers from a start down to one. */
  export function countBack(start: number): number[] {
    const counted: number[] = [];
    for (let value = start; value >= 0; value -= 1) {
      counted.push(value);
    }
    return counted;
  }
interface: "export function countBack(start: number): number[]"
stop_conditions:
  - Whether the count should be able to run upward instead is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
