id: b140-folder-heft
task_type: function_implementation
task: >-
  Implement heavyFolders, the report at the top of a small storage-tree
  module whose two companions are already written. A tree node is a
  mapping holding name plus either bytes, making it a file of that many
  bytes, or children, making it a folder over a list of nodes; a node's
  path joins the names from the root down to it with slashes. filePaths
  lists the path of every file, walking each folder's children in order,
  a folder's contents before its next sibling; a file root yields its own
  name alone. treeBytes totals the bytes a node holds — a file its own, a
  folder the sum over its children, an empty folder zero. heavyFolders
  returns a [path, bytes] pair for every folder whose total reaches at
  least minBytes — the root included when it is a folder, a file root
  yielding an empty list — in the same walking order as filePaths. All
  three reject, at any depth, a node that is not a mapping, a name that
  is not a non-empty string or holds a slash, a node with both bytes and
  children or neither, a bytes that is not a non-negative whole number,
  and a children that is not a list; heavyFolders also rejects a minBytes
  that is not a non-negative whole number, with an error.
target: solution.ts
target_content: |
  /** A storage report over a tree of named folders and byte-sized files. */

  function checkNode(node: any): void {
    if (typeof node !== "object" || node === null || Array.isArray(node)) {
      throw new Error("each node must be a mapping");
    }
    if (typeof node.name !== "string" || node.name.length === 0 || node.name.includes("/")) {
      throw new Error("each name must be a non-empty string without slashes");
    }
    if (("bytes" in node) === ("children" in node)) {
      throw new Error("a node holds either bytes or children");
    }
    if ("bytes" in node) {
      if (!Number.isInteger(node.bytes) || node.bytes < 0) {
        throw new Error("bytes must be a non-negative whole number");
      }
    } else if (!Array.isArray(node.children)) {
      throw new Error("children must be a list");
    }
  }

  export function filePaths(root: object): string[] {
    const paths: string[] = [];
    const stack: [any, string][] = [[root, ""]];
    while (stack.length > 0) {
      const [node, prefix] = stack.pop()!;
      checkNode(node);
      const path = prefix + node.name;
      if ("bytes" in node) {
        paths.push(path);
      } else {
        for (let i = node.children.length - 1; i >= 0; i--) {
          stack.push([node.children[i], path + "/"]);
        }
      }
    }
    return paths;
  }

  export function treeBytes(root: object): number {
    let total = 0;
    const stack: any[] = [root];
    while (stack.length > 0) {
      const node = stack.pop();
      checkNode(node);
      if ("bytes" in node) {
        total += node.bytes;
      } else {
        for (const child of node.children) {
          stack.push(child);
        }
      }
    }
    return total;
  }

  export function heavyFolders(root: object, minBytes: number): [string, number][] {
    // TODO: validate minBytes, walk the folders in filePaths' order, and
    // report a [path, total] pair for every folder reaching minBytes.
    const total = treeBytes(root);
    return total >= minBytes ? [[(root as any).name, total]] : [];
  }
interface: |-
  export function filePaths(root: object): string[]
  export function treeBytes(root: object): number
  export function heavyFolders(root: object, minBytes: number): [string, number][]
stop_conditions:
  - Whether two sibling nodes may share a name is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
