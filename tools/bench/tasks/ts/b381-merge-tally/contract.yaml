id: b381-merge-tally
task_type: function_implementation
task: >-
  Implement addOne and mergeTally. addOne returns a tally with a
  stated amount added to one name's count, leaving the tally it was
  given unchanged. mergeTally returns the two tallies combined, with
  counts for a shared name added together.
target: solution.ts
interface: "export function addOne(tally: Record<string, number>, name: string, amount: number): Record<string, number>
export function mergeTally(left: Record<string, number>, right: Record<string, number>): Record<string, number>"
stop_conditions:
  - Whether a count may fall below zero once combined is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
