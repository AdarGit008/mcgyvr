id: b395-cross-up
task_type: function_implementation
task: >-
  Implement crossUp. Return how many times a run of readings crosses a
  level going upward, a crossing being a reading that reaches the
  level when the reading immediately before it stood below.
target: solution.ts
interface: "export function crossUp(readings: number[], level: number): number"
stop_conditions:
  - Whether the first reading should count as a crossing when it already reaches the level is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
