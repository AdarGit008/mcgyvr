id: b077-buffer-replay
task_type: bug_fix
task: >-
  replayBuffer replays a list of operations against a bounded
  first-in-first-out buffer incorrectly. Fix it: an add:<text> operation
  appends <text> to the buffer and must fail with an error once the buffer
  already holds capacity entries — today it lets the buffer grow one entry
  past its capacity — and a take operation must remove the oldest entry
  and append it to the taken list, but today a take on an empty buffer
  quietly records a missing value instead of failing with an error. An
  operation that is neither add:<text> nor take is currently swallowed as
  if it were a take; make it an error. Also add the missing validation:
  reject a capacity that is not a positive integer with an error. Return a
  mapping with held, the entries still buffered oldest first, and taken,
  the entries removed in order. Return the complete fixed file.
target: solution.ts
target_content: |
  export function replayBuffer(
    ops: string[],
    capacity: number,
  ): { held: string[]; taken: string[] } {
    const held: string[] = [];
    const taken: string[] = [];
    for (const op of ops) {
      if (op.startsWith("add:")) {
        if (held.length > capacity) {
          throw new Error("buffer is full");
        }
        held.push(op.slice(4));
      } else {
        taken.push(held.shift()!);
      }
    }
    return { held, taken };
  }
interface: "export function replayBuffer(ops: string[], capacity: number): { held: string[]; taken: string[] }"
stop_conditions:
  - Whether the text of an add operation may itself contain a colon is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
