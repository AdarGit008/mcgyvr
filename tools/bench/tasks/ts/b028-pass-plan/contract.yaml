id: b028-pass-plan
task_type: function_implementation
task: >-
  Implement cheapestPassPlan. The first argument lists the calendar days on
  which trips happen, as strictly increasing positive integers; the second
  lists the pass kinds on sale, each a mapping with span (how many
  consecutive days the pass covers, counted from the day it starts) and
  cost. A pass starting on day d covers days d through d plus span minus 1,
  any number of passes may be bought, and every trip day must fall inside
  at least one bought pass. Return a mapping with total, the smallest
  amount that covers every trip day, and purchases, the [start day, span]
  pairs of one cheapest plan in increasing start-day order, where each
  purchase starts on the earliest trip day not yet covered and, when
  several pass kinds tie for a cheapest plan at such a day, the one listed
  first is bought. An empty trip list yields total 0 and no purchases.
  Reject with an error: a trip day that is not a positive integer, trip
  days not strictly increasing, an empty pass list, a span that is not a
  positive integer, and a cost that is not a non-negative integer.
target: solution.ts
target_content: |
  /** The cheapest set of travel passes covering every trip day. */

  function validatePlan(
    tripDays: number[],
    passes: { span: number; cost: number }[],
  ): void {
    for (const day of tripDays) {
      if (!Number.isInteger(day) || day < 1) {
        throw new Error("trip days must be positive integers");
      }
    }
    for (let i = 1; i < tripDays.length; i += 1) {
      if (tripDays[i] <= tripDays[i - 1]) {
        throw new Error("trip days must be strictly increasing");
      }
    }
    if (passes.length === 0) {
      throw new Error("at least one pass kind is required");
    }
    for (const pass of passes) {
      if (!Number.isInteger(pass.span) || pass.span < 1) {
        throw new Error("pass span must be a positive integer");
      }
      if (!Number.isInteger(pass.cost) || pass.cost < 0) {
        throw new Error("pass cost must be a non-negative integer");
      }
    }
  }

  export function cheapestPassPlan(
    tripDays: number[],
    passes: { span: number; cost: number }[],
  ): { total: number; purchases: number[][] } {
    validatePlan(tripDays, passes);
    // TODO: find the cheapest combination of passes covering every trip
    // day and reconstruct its purchases in increasing start-day order.
    throw new Error("not implemented");
  }
interface: "export function cheapestPassPlan(tripDays: number[], passes: { span: number; cost: number }[]): { total: number; purchases: number[][] }"
stop_conditions:
  - Whether the same pass kind may be listed twice is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
