id: b147-fresh-value
task_type: function_implementation
task: >-
  Implement freshValue. A cache keeps each record as a mapping of three
  fields: value, the cached string; stored, the integer tick the record
  was written; and ttl, how many ticks the record stays usable. The record
  is usable from tick stored up to but not including tick stored + ttl.
  Given a record and the current tick now, return the record's value while
  the record is still usable. Reject an entry that is not such a record, a
  value that is not a string, a stored that is not a non-negative integer,
  a ttl that is not a positive integer, a now that is not an integer at
  least stored, and a record no longer usable at now, with an error.
target: solution.ts
interface: |-
  type CacheEntry = { value: string; stored: number; ttl: number };
  export function freshValue(entry: CacheEntry, now: number): string
stop_conditions:
  - How a record carrying extra fields beyond the three is treated is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
