id: b235-crumb-path
task_type: function_implementation
task: >-
  Implement crumbSplit and crumbJoin. crumbSplit breaks a breadcrumb
  trail on forward slashes and discards every empty segment, so
  /docs//api/ yields docs then api. crumbJoin puts segments back with
  a single slash between them and no slash at either end, discarding
  empty segments the same way.
target: solution.ts
interface: "export function crumbSplit(trail: string): string[]\nexport function crumbJoin(parts: string[]): string"
stop_conditions:
  - Whether a segment made only of spaces counts as empty is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
