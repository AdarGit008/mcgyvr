id: b240-hue-band
task_type: function_implementation
task: >-
  Implement hueBand. Given a hue in degrees, name the band it falls
  in: red below 60, green below 180, blue below 300, and red again
  from 300 up. A reading outside zero to 359 wraps around the circle
  first, so 400 is read as 40 and a negative reading counts backwards
  from 360.
target: solution.ts
interface: "export function hueBand(degrees: number): string"
stop_conditions:
  - Whether a fractional degree should be rounded before banding is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
