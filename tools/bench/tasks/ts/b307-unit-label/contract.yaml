id: b307-unit-label
task_type: bug_fix
task: >-
  shortUnit returns the short form of a unit's name, its first three
  letters. labelOf writes an amount with its unit, using the singular
  form when the amount is one and adding an s otherwise, and it adds
  the s for one as well. Fix labelOf. An amount below zero is rejected
  with an error. Return the complete fixed file.
target: solution.ts
target_content: |
  export function shortUnit(unit: string): string {
    return unit.slice(0, 3);
  }

  /** An amount written with its unit. */
  export function labelOf(amount: number, unit: string): string {
    if (amount < 0) {
      throw new Error("amount cannot be negative");
    }
    return String(amount) + " " + unit + "s";
  }
interface: "export function shortUnit(unit: string): string
export function labelOf(amount: number, unit: string): string"
stop_conditions:
  - Whether a unit whose plural is irregular should be written differently is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
