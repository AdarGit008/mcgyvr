id: b014-fill-order
task_type: bug_fix
task: >-
  fillOrder plans how an order for needed units is covered from a list of
  sources and plans it wrongly. Each source is a [cost, stock] pair: the
  price of one unit and the units it holds. Fix it: units come from the
  cheapest cost first, a tie on cost going to the earlier-listed source, and
  no source is ever drawn past the still-uncovered need — the plan buys
  exactly needed units in total, never more. The current code drains whole
  every source it visits, so it overbuys whenever the source it is drawing
  from holds more than the need still open, and when all stock together
  cannot cover the order it reports a short plan instead of failing. Return
  a mapping with cost, the total paid; taken, one entry per source in the
  given order saying how many units came from it, zero where none did; and
  leftover, one entry per source saying how many units it still holds. Also
  add the missing validation: reject a needed that is not a positive
  integer, a source that is not a pair of a positive integer cost and a
  positive integer stock, and a source list whose stock in all cannot cover
  needed, with an error. Return the complete fixed file.
target: solution.ts
target_content: |
  export function fillOrder(
    sources: number[][],
    needed: number,
  ): { cost: number; taken: number[]; leftover: number[] } {
    const order = sources.map((_, index) => index);
    order.sort((a, b) => sources[a][0] - sources[b][0]);
    const taken = sources.map(() => 0);
    let cost = 0;
    let remaining = needed;
    for (const index of order) {
      if (remaining <= 0) {
        break;
      }
      const unitCost = sources[index][0];
      const stock = sources[index][1];
      taken[index] = stock;
      cost += stock * unitCost;
      remaining -= stock;
    }
    const leftover = sources.map((source, index) => source[1] - taken[index]);
    return { cost, taken, leftover };
  }
interface: "export function fillOrder(sources: number[][], needed: number): { cost: number; taken: number[]; leftover: number[] }"
stop_conditions:
  - Whether needed has an upper bound is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
