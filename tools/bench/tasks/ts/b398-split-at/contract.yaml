id: b398-split-at
task_type: function_implementation
task: >-
  Implement splitAt. Break a list in two at the first entry equal to a
  marker, returning what stood before it and what stood after, with
  the marker itself in neither. A list not holding the marker gives
  everything as the first part and nothing as the second.
target: solution.ts
interface: "export function splitAt(entries: string[], marker: string): string[][]"
stop_conditions:
  - Whether the marker should be reported alongside the two parts is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
