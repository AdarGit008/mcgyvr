id: b458-limit-map
task_type: bug_fix
task: >-
  heldDown returns a value brought down to a ceiling, leaving a value
  already under it alone. limitMap brings every value of a store down
  that way, and it drops the names whose values were over the ceiling
  instead of bringing them down. Fix limitMap. Return the complete
  fixed file.
target: solution.ts
target_content: |
  export function heldDown(value: number, ceiling: number): number {
    return value > ceiling ? ceiling : value;
  }

  /** Every value of a store brought down to a ceiling. */
  export function limitMap(
    store: Record<string, number>,
    ceiling: number,
  ): Record<string, number> {
    const out: Record<string, number> = {};
    for (const key of Object.keys(store)) {
      if (store[key] <= ceiling) {
        out[key] = store[key];
      }
    }
    return out;
  }
interface: "export function heldDown(value: number, ceiling: number): number
export function limitMap(store: Record<string, number>, ceiling: number): Record<string, number>"
stop_conditions:
  - Whether a ceiling below nothing should be accepted is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
