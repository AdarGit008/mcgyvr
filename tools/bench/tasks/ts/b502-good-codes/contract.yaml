id: b502-good-codes
task_type: function_implementation
task: >-
  codeSum totals the figures written in a code, passing over anything
  that is not a figure. goodCodes keeps the codes whose total divides
  evenly by three, in the order they arrived. Implement goodCodes. A
  code holding no figures totals nothing, which divides evenly.
target: solution.ts
interface: "export function codeSum(code: string): number
export function goodCodes(codes: string[]): string[]"
stop_conditions:
  - Whether a code holding a figure written as a word should count is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
