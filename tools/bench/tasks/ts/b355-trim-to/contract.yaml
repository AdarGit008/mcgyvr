id: b355-trim-to
task_type: function_implementation
task: >-
  Implement trimTo. Cut a line down to at most a given number of
  characters. A line that had to be cut ends in three dots, and those
  dots count toward the limit. A line already short enough is left
  alone. Reject a limit under four with an error.
target: solution.ts
interface: "export function trimTo(line: string, limit: number): string"
stop_conditions:
  - Whether a cut should fall on a word boundary is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
