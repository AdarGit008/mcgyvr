id: b275-camel-break
task_type: function_implementation
task: >-
  Implement camelBreak. An identifier is written with its words run
  together, each word after the first beginning with a capital. Return
  those words in order, all in lower case. A capital at the very start
  does not produce an empty first word, and an identifier holding no
  capitals comes back as a single word.
target: solution.ts
interface: "export function camelBreak(name: string): string[]"
stop_conditions:
  - How a run of consecutive capitals, as in an abbreviation, should be divided is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
