id: b424-mid-pair
task_type: function_implementation
task: >-
  Implement midPair. Return the two values standing closest to the
  middle of a list once it is put in order, the lower one first. A
  list of an odd length gives its middle value twice, and a list
  holding nothing gives two nothings.
target: solution.ts
interface: "export function midPair(values: number[]): number[]"
stop_conditions:
  - Whether the two values should be averaged instead is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
