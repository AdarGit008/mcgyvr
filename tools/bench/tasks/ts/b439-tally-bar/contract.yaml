id: b439-tally-bar
task_type: function_implementation
task: >-
  Implement tallyBar. Draw a count as that many hashes, but never more
  than a stated width, and mark a bar that had to be cut short by
  ending it in a greater-than sign in place of the last hash. A count
  of nothing draws an empty bar.
target: solution.ts
interface: "export function tallyBar(count: number, width: number): string"
stop_conditions:
  - Whether a width of nothing should still mark a cut bar is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
