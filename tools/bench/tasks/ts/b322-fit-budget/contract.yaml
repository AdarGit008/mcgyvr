id: b322-fit-budget
task_type: function_implementation
task: >-
  Implement fitBudget. Given the prices of the items on offer and an
  amount to spend, return how many items can be bought by always
  taking the cheapest that is still affordable. Each item may be
  bought once only. Reject an amount below zero with an error.
target: solution.ts
interface: "export function fitBudget(prices: number[], budget: number): number"
stop_conditions:
  - Whether the money left over after the last purchase should be reported as well is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
