id: b339-net-pay
task_type: bug_fix
task: >-
  netPay takes a percentage off gross pay and then subtracts a flat
  fee, and it subtracts the fee first, so the percentage comes off the
  wrong amount. Fix it. The percentage is rounded down and pay never
  falls below zero. Return the complete fixed file.
target: solution.ts
target_content: |
  /** Gross pay less a percentage and then a flat fee. */
  export function netPay(gross: number, rate: number, fee: number): number {
    const afterFee = gross - fee;
    return Math.max(afterFee - Math.floor((afterFee * rate) / 100), 0);
  }
interface: "export function netPay(gross: number, rate: number, fee: number): number"
stop_conditions:
  - Whether the flat fee should still apply when gross pay is nothing is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
