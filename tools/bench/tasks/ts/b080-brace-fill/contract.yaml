id: b080-brace-fill
task_type: function_implementation
task: >-
  Implement fillTemplate. A template is literal text holding placeholders,
  each an opening brace, a name of one or more letters, digits or
  underscores, and a closing brace. Build the output by walking the
  template once: literal characters pass through untouched — a closing
  brace on its own is literal — and each placeholder is replaced by the
  value the mapping holds under its name; the same name may appear any
  number of times. Reject a non-string template, an opening brace that is
  never closed, a placeholder whose name is empty or holds a character
  outside letters, digits and underscores, and a placeholder whose name
  the mapping does not hold, with an error.
target: solution.ts
