id: b376-count-by
task_type: function_implementation
task: >-
  Implement countBy. Given records that each carry several named
  fields, return how many records hold each value of one named field.
  A record lacking that field is passed over. Reject a field name that
  is empty text with an error.
target: solution.ts
interface: "export function countBy(records: Record<string, string>[], field: string): Record<string, number>"
stop_conditions:
  - Whether field names should be matched ignoring case is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
