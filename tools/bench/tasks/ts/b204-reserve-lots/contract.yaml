id: b204-reserve-lots
task_type: function_implementation
task: >-
  Implement reserveLots. Stock sits in lots, each a triple of lot id, a
  use-by date written as YYYY-MM-DD, and the units on hand. Orders are
  pairs of order id and units wanted, filled one after another in the order
  given. An order always draws from the lot with the earliest use-by date
  that still holds units, the smaller lot id winning a tie of dates, and
  takes as much as that lot can give before moving on to the next lot, so
  one order may draw from several lots. Record every draw as a triple of
  order id, lot id and units taken, in the order the draws happen. When the
  stock runs out part way through an order, the draws already made stand
  and the units still wanted are recorded as a pair of order id and
  shortfall. Return an object holding picks, the list of draws, and short,
  the list of shortfalls.
target: solution.ts
interface: "export function reserveLots(lots: [string, string, number][], orders: [string, number][]): { picks: [string, string, number][]; short: [string, number][] }"
stop_conditions:
  - Whether two lots may carry the same lot id is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
