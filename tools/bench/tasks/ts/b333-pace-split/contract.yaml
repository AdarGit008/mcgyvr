id: b333-pace-split
task_type: function_implementation
task: >-
  Implement paceOf and paceList. paceOf returns the seconds taken per
  kilometre on a leg, rounded down. paceList returns the pace of every
  leg of a run, given each leg's seconds and its distance, in order.
  Reject a leg covering no ground with an error.
target: solution.ts
interface: "export function paceOf(seconds: number, kilometres: number): number
export function paceList(legs: { seconds: number; kilometres: number }[]): number[]"
stop_conditions:
  - Whether a leg's distance may be given as a fraction of a kilometre is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
