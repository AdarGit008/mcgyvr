id: b192-tile-renders
task_type: function_implementation
task: >-
  Implement tileRenders. A map viewer keeps rendered tiles in a cache that
  holds at most size of them. Requests arrive in order as two-item lists of
  the tick the request was made at, a non-negative whole number that never
  goes backwards, and the tile's name. A tile rendered at tick t answers
  every request from tick t up to but not including tick t plus freshFor
  straight from the cache; any other request renders that tile again, which
  stores it under the current tick in place of its earlier render. When a
  render must store a tile the cache is not already holding and the cache
  already holds size tiles, the held tile whose render is oldest is dropped
  first, a tie going to the name that sorts first. Return the renders that
  happened, in order, each a two-item list of the tick and the tile's name.
  Reject a freshFor or a size that is not a positive whole number, with an
  error.
target: solution.ts
target_content: |
  /** Replay tile requests against a size-limited cache of fresh renders. */
  export function tileRenders(requests: [number, string][], freshFor: number, size: number): [number, string][] {
    if (!Number.isInteger(freshFor) || freshFor < 1 || !Number.isInteger(size) || size < 1) {
      throw new Error("freshFor and size must be positive integers");
    }
    const held = new Map<string, number>();
    const renders: [number, string][] = [];
    for (const [tick, name] of requests) {
      // TODO: serve a still-fresh render, else make room when full and record one.
    }
    return renders;
  }
interface: "export function tileRenders(requests: [number, string][], freshFor: number, size: number): [number, string][]"
stop_conditions:
  - How a request whose tick sits earlier than an earlier request's tick is handled is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
