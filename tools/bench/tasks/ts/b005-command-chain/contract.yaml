id: b005-command-chain
task_type: function_implementation
task: >-
  Implement chainOfCommand, headcount and widestTeam over an
  organisation chart. A chart node carries a name and a list called
  reports holding the nodes for the people who report directly to it,
  each of the same shape. chainOfCommand walks the chart from its head
  and returns the list of names leading from the head down to the given
  person, both ends included; the head alone is a one-name chain. It
  visits every node, and a node whose name is empty or not a string is
  an error wherever it sits. A person found nowhere in the chart is an
  error, as is a person found more than once, and a person argument
  that is empty or not a string. headcount returns how many people the
  chart holds, the head included. widestTeam returns the largest count
  of direct reports any single person has, zero when nobody has any.
target: solution.ts
interface: |-
  export function chainOfCommand(root: object, person: string): string[]
  export function headcount(root: object): number
  export function widestTeam(root: object): number
stop_conditions:
  - Whether a reports list may be missing rather than empty is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
