id: b295-grid-cell
task_type: function_implementation
task: >-
  Implement cellName and gridCells. cellName turns a row and a column,
  both counted from zero, into a spreadsheet name: a column letter
  from A upward followed by a row number counted from one. gridCells
  returns the names of every cell in a grid of a given size, row by
  row.
target: solution.ts
interface: "export function cellName(row: number, column: number): string
export function gridCells(rows: number, columns: number): string[]"
stop_conditions:
  - What a column beyond the twenty-sixth should be named is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
