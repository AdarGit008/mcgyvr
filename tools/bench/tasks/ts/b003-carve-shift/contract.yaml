id: b003-carve-shift
task_type: function_implementation
task: >-
  Implement carveShift. A work shift runs from start up to but not
  including end, and every argument is a whole number; the bounds may be
  negative. Carve the shift into work stretches: each stretch lasts at
  most span units, consecutive stretches are separated by a rest of
  exactly rest units, and carving walks forward from the start until the
  shift is used up. A stretch that would last fewer than least units is
  dropped and carving stops there, so the tail of a shift can go unused;
  the final kept stretch may be shorter than span. Return the stretches
  in order as half-open [from, to) pairs of integers. Reject an argument
  that is not a whole number, a start that does not precede end, a span
  or rest below 1, and a least below 1 or above span, with an error.
target: solution.ts
target_content: |
  /** Work stretches of a shift: span-long, rest-separated, short tails dropped. */
  export function carveShift(
    start: number,
    end: number,
    span: number,
    rest: number,
    least: number,
  ): number[][] {
    for (const value of [start, end, span, rest, least]) {
      if (!Number.isInteger(value)) {
        throw new Error("every argument must be an integer");
      }
    }
    if (start >= end) {
      throw new Error("shift start must precede its end");
    }
    if (span < 1 || rest < 1) {
      throw new Error("span and rest must be at least 1");
    }
    if (least < 1 || least > span) {
      throw new Error("least must be between 1 and span");
    }
    // TODO: walk the shift, cutting a stretch of at most span units, then
    // skipping rest units, dropping a final stretch shorter than least.
    return [];
  }
interface: "export function carveShift(start: number, end: number, span: number, rest: number, least: number): number[][]"
stop_conditions:
  - Whether an upper bound on the shift length is enforced is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
