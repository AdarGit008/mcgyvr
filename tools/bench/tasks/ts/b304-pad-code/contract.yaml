id: b304-pad-code
task_type: bug_fix
task: >-
  padCode pads a code with zeros on its left until it reaches a fixed
  width, and it pads on the right instead. Fix it. A code already at
  or beyond the width comes back unchanged. Return the complete fixed
  file.
target: solution.ts
target_content: |
  /** A code padded with zeros to a fixed width. */
  export function padCode(code: string, width: number): string {
    return code.padEnd(width, "0");
  }
interface: "export function padCode(code: string, width: number): string"
stop_conditions:
  - Whether a character other than a zero should ever be used for the padding is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
