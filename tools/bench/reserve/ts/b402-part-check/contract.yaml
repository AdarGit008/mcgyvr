id: b402-part-check
task_type: function_implementation
task: >-
  Implement partCheck. Say whether a stated total matches the sum of
  its parts closely enough, the two being allowed to differ by no more
  than a stated tolerance in either direction. No parts at all sum to
  nothing.
target: solution.ts
interface: "export function partCheck(total: number, parts: number[], tolerance: number): boolean"
stop_conditions:
  - Whether a tolerance below zero should ever be satisfied is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
