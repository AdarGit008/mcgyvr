id: b370-running-to
task_type: bug_fix
task: >-
  runningTo returns the total of the entries up to and including a
  stated position, and it stops one entry short. Fix it. A position
  past the end totals everything there is, and a position below zero
  totals nothing. Return the complete fixed file.
target: solution.ts
target_content: |
  /** The total of the entries up to and including a position. */
  export function runningTo(values: number[], upto: number): number {
    if (upto < 0) {
      return 0;
    }
    let total = 0;
    for (let i = 0; i < upto && i < values.length; i += 1) {
      total += values[i];
    }
    return total;
  }
interface: "export function runningTo(values: number[], upto: number): number"
stop_conditions:
  - Whether the position should count from one instead of zero is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
