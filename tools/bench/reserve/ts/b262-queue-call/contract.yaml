id: b262-queue-call
task_type: bug_fix
task: >-
  queueCall finds the next ticket to serve after the one just called,
  passing over any ticket that has been withdrawn, and it passes over
  one ticket too many: it begins looking after the ticket following
  the one called. Fix it. When nothing is left to serve it returns
  nothing. Return the complete fixed file.
target: solution.ts
target_content: |
  /** The next ticket to serve after the one just called. */
  export function queueCall(
    tickets: string[],
    withdrawn: string[],
    called: string,
  ): string | null {
    const at = tickets.indexOf(called);
    for (let i = at + 2; i < tickets.length; i += 1) {
      if (!withdrawn.includes(tickets[i])) {
        return tickets[i];
      }
    }
    return null;
  }
interface: "export function queueCall(tickets: string[], withdrawn: string[], called: string): string | null"
stop_conditions:
  - What should happen when the ticket just called is not on the list at all is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
