id: b247-receipt-net
task_type: bug_fix
task: >-
  receiptNet totals the amounts on a receipt while leaving out any
  line that has been voided, and it leaves nothing out: voided lines
  are counted along with the rest. Fix it. A receipt with no lines
  totals zero. Return the complete fixed file.
target: solution.ts
target_content: |
  /** The net total of a receipt, leaving out voided lines. */
  export function receiptNet(
    lines: { amount: number; voided: boolean }[],
  ): number {
    let net = 0;
    for (const line of lines) {
      net += line.amount;
    }
    return net;
  }
interface: "export function receiptNet(lines: { amount: number; voided: boolean }[]): number"
stop_conditions:
  - Whether a voided line with a negative amount should still be skipped is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
