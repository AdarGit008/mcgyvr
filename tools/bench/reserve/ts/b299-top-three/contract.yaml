id: b299-top-three
task_type: bug_fix
task: >-
  topThree returns the three highest scores, highest first, and it
  returns the three lowest instead. Fix it. A list holding fewer than
  three scores returns all of them, still highest first. Return the
  complete fixed file.
target: solution.ts
target_content: |
  /** The three highest scores, highest first. */
  export function topThree(scores: number[]): number[] {
    return [...scores].sort((a, b) => a - b).slice(0, 3);
  }
interface: "export function topThree(scores: number[]): number[]"
stop_conditions:
  - Whether the list it is given may be reordered in place is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
