id: b115-assign-bins
task_type: bug_fix
task: >-
  assignBins sorts items into named bins by wildcard patterns, and both
  its matching and its placement are wrong. The rules are a list of
  [name, patterns] pairs tried in order, each pattern a string that must
  match a whole item: a pattern without a star matches only its exact
  text, and a pattern with one star matches any item that begins with the
  text before the star and ends with the text after it, the star standing
  for any run of characters including none — but the two literal parts
  must fit into the item without overlapping, so ab*ba never matches aba.
  Every item lands in the bin of the first rule with a matching pattern
  only, and an item no rule matches lands in leftover. At present an item
  matched by several rules is copied into every one of their bins, and a
  short item is accepted whenever a middle-star pattern's two literal
  parts could only match by overlapping. Fix both, returning
  {bins, leftover} where bins holds every rule's name mapped to its
  matched items in input order, an empty list when a rule catches
  nothing. Also add the missing validation: reject a rules argument that
  is not a list, a rule that is not a two-item pair, a rule name that is
  not a non-empty string, a repeated rule name, a patterns field that is
  not a non-empty list, a pattern that is not a non-empty string, a
  pattern holding more than one star, and an items argument that is not a
  list of strings, with an error. Return the complete fixed file.
target: solution.ts
target_content: |
  function matchesPattern(item: string, pattern: string): boolean {
    const star = pattern.indexOf("*");
    if (star === -1) {
      return item === pattern;
    }
    return (
      item.startsWith(pattern.slice(0, star)) &&
      item.endsWith(pattern.slice(star + 1))
    );
  }

  export function assignBins(
    rules: [string, string[]][],
    items: string[],
  ): { bins: Record<string, string[]>; leftover: string[] } {
    if (!Array.isArray(rules)) {
      throw new Error("rules must be a list");
    }
    const bins: Record<string, string[]> = {};
    for (const rule of rules) {
      if (!Array.isArray(rule) || rule.length !== 2) {
        throw new Error("a rule is a [name, patterns] pair");
      }
      bins[rule[0]] = [];
    }
    const leftover: string[] = [];
    for (const item of items) {
      let placed = false;
      for (const [name, patterns] of rules) {
        if (patterns.some((pattern) => matchesPattern(item, pattern))) {
          bins[name].push(item);
          placed = true;
        }
      }
      if (!placed) {
        leftover.push(item);
      }
    }
    return { bins, leftover };
  }
interface: "export function assignBins(rules: [string, string[]][], items: string[]): { bins: Record<string, string[]>; leftover: string[] }"
stop_conditions:
  - Whether one rule may hold the same pattern twice is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
