id: b311-word-tally
task_type: function_implementation
task: >-
  Implement wordTally. Given a sentence, return how many times each
  word appears, ignoring case and recording the words in lower case.
  Any run of spaces separates two words, and an empty sentence gives
  an empty tally.
target: solution.ts
interface: "export function wordTally(sentence: string): Record<string, number>"
stop_conditions:
  - Whether punctuation attached to a word belongs to it is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
