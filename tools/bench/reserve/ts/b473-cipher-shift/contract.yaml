id: b473-cipher-shift
task_type: function_implementation
task: >-
  Implement cipherShift. Move every small letter forward through the
  alphabet by a given step, running back to the start after the last
  letter. Characters that are not small letters stay as they are, and
  a step of nothing leaves the whole text unchanged.
target: solution.ts
interface: "export function cipherShift(text: string, step: number): string"
stop_conditions:
  - Whether a step below nothing should move letters the other way is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
