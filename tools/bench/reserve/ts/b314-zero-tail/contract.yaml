id: b314-zero-tail
task_type: function_implementation
task: >-
  Implement zeroTail. Return how many zeros a whole number ends in,
  counting from the right and stopping at the first digit that is not
  a zero. A number not ending in a zero ends in none of them, and zero
  itself counts as ending in one.
target: solution.ts
interface: "export function zeroTail(value: number): number"
stop_conditions:
  - Whether a negative number should be counted in the same way is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
