id: b310-pair-keys
task_type: function_implementation
task: >-
  Implement pairKeys. Given a list of names and a list of codes,
  return a mapping from each name to the code standing in the matching
  position. Where the two lists differ in length the extra entries on
  the longer side are left out, and a name appearing twice keeps the
  later of its codes.
target: solution.ts
interface: "export function pairKeys(names: string[], codes: string[]): Record<string, string>"
stop_conditions:
  - Whether a name may be empty text is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
