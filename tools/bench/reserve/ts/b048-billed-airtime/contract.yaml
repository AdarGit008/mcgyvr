id: b048-billed-airtime
task_type: function_implementation
task: >-
  Implement billedAirtime. A telephone tariff bills a call by its
  measured duration in whole seconds: a zero-second call bills nothing,
  any other call up to the initial block long bills the whole initial
  block, and past the initial block airtime is billed in whole steps,
  every started step charged in full. Under an initial block of 30 and a
  step of 6, a 1-second call bills 30 seconds, a 31-second call bills 36
  and a 42-second call bills 42. Return the billed seconds. Reject a
  duration that is not a non-negative integer, an initial block that is
  not a positive integer, and a step that is not a positive integer,
  with an error.
target: solution.ts
target_content: |
  /** Billable airtime for a metered call, in whole seconds. */

  export function billedAirtime(duration: number, initial: number, step: number): number {
    if (!Number.isInteger(duration) || duration < 0) {
      throw new Error("duration must be a non-negative integer");
    }
    if (!Number.isInteger(initial) || initial <= 0) {
      throw new Error("initial block must be a positive integer");
    }
    if (!Number.isInteger(step) || step <= 0) {
      throw new Error("billing step must be a positive integer");
    }
    // TODO: a zero-second call bills nothing; a call inside the initial
    // block bills the whole block; past it, bill whole steps, any
    // started step charged in full.
    throw new Error("not implemented");
  }
interface: "export function billedAirtime(duration: number, initial: number, step: number): number"
stop_conditions:
  - No upper bound on the measured duration is stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
