id: b270-stripe-rows
task_type: function_implementation
task: >-
  Implement stripeRows. A wall is painted row by row from the top
  using a repeating list of colours, taken in order and starting again
  at the first once the list runs out. Given the number of rows and
  the colours, return the colour of each row. Asking for no rows gives
  an empty list.
target: solution.ts
interface: "export function stripeRows(rows: number, colours: string[]): string[]"
stop_conditions:
  - What should happen when no colours are supplied at all is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
