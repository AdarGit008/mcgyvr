id: b490-slot-in
task_type: function_implementation
task: >-
  Implement slotIn. Place one further reading into a run already
  standing in order, so the run stays in order. A reading matching one
  already there is placed after it. A reading larger than everything
  there closes the run.
target: solution.ts
interface: "export function slotIn(ordered: number[], value: number): number[]"
stop_conditions:
  - Whether a run arriving out of order should first be put in order is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
