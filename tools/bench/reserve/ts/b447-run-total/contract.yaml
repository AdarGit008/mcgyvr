id: b447-run-total
task_type: bug_fix
task: >-
  runTotal reports the total of every run of readings that stay at or
  above a floor, one total for each run, and it adds every reading it
  meets whether or not the run has ended. Fix it. A run that never
  reaches the floor gives no totals. Return the complete fixed file.
target: solution.ts
target_content: |
  /** One total for each run of readings at or above a floor. */
  export function runTotal(readings: number[], floor: number): number[] {
    const totals: number[] = [];
    let running = 0;
    for (const reading of readings) {
      running += reading;
      if (reading < floor && running > 0) {
        totals.push(running);
        running = 0;
      }
    }
    if (running > 0) {
      totals.push(running);
    }
    return totals;
  }
interface: "export function runTotal(readings: number[], floor: number): number[]"
stop_conditions:
  - Whether a run of a single reading should be reported is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
