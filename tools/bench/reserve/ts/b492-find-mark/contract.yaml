id: b492-find-mark
task_type: bug_fix
task: >-
  findMark looks for a mark in a run already standing in order,
  halving the stretch it has left to search at every step. It reports
  where the mark stands, counting from zero, and reports minus one
  where the run does not hold it at all. Fix findMark. Return the
  complete fixed file.
target: solution.ts
target_content: |
  export function findMark(ordered: number[], mark: number): number {
    let low = 0;
    let high = ordered.length - 1;
    while (low <= high) {
      const mid = Math.floor((low + high) / 2);
      if (ordered[mid] === mark) {
        return mid;
      }
      if (ordered[mid] < mark) {
        low = mid + 1;
      } else {
        high = mid - 1;
      }
    }
    return low;
  }
interface: "export function findMark(ordered: number[], mark: number): number"
stop_conditions:
  - Whether a run holding the mark twice should report the earlier place is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
