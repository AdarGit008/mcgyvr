id: b369-run-index
task_type: function_implementation
task: >-
  Implement runIndex. Return the position at which a value appears for
  the nth time in a list, counting positions from zero, or minus one
  when it does not appear that often. Reject a count of zero or less
  with an error.
target: solution.ts
interface: "export function runIndex(entries: string[], value: string, nth: number): number"
stop_conditions:
  - Whether the count should be able to run from the end of the list is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
