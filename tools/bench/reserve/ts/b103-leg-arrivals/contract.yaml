id: b103-leg-arrivals
task_type: function_implementation
task: >-
  Implement legArrivals, the itinerary tracker of a small clock-time
  module whose two companions are already in place. parseClock turns a
  24-hour clock string — exactly two digits, a colon, two digits, hours 00
  to 23, minutes 00 to 59 — into minutes since midnight, rejecting any
  other text or a non-string with an error. formatClock renders an integer
  from 0 to 1439 back into that zero-padded form and rejects anything else
  with an error. legArrivals takes a departure clock string and a list of
  legs, each a two-integer list of travel minutes and layover minutes: the
  traveller leaves at the departure time, rides each leg in turn, and
  waits out its layover before starting the next. Return one [clock, days]
  pair per leg, the arrival clock string and how many midnights have
  passed since departure by that arrival; an empty leg list yields an
  empty list. Reject a leg that is not a two-item list, travel minutes
  that are not a positive integer, and layover minutes that are not a
  non-negative integer, with an error; a malformed departure fails
  parseClock's own check.
target: solution.ts
target_content: |
  /** Clock-time helpers and the leg-by-leg arrival tracker built on them. */

  export function parseClock(text: string): number {
    if (typeof text !== "string" || !/^\d\d:\d\d$/.test(text)) {
      throw new Error("a clock reads HH:MM");
    }
    const hours = Number(text.slice(0, 2));
    const minutes = Number(text.slice(3));
    if (hours > 23 || minutes > 59) {
      throw new Error("no such clock time");
    }
    return hours * 60 + minutes;
  }

  export function formatClock(minutes: number): string {
    if (!Number.isInteger(minutes) || minutes < 0 || minutes > 1439) {
      throw new Error("minutes must lie in 0..1439");
    }
    const hours = Math.floor(minutes / 60);
    const rest = minutes % 60;
    return `${String(hours).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
  }

  export function legArrivals(
    departure: string,
    legs: number[][],
  ): [string, number][] {
    const start = parseClock(departure);
    // TODO: replay each leg — validate it, ride its travel minutes, record
    // the arrival clock and how many midnights have passed, then wait out
    // the layover before the next leg.
    return [];
  }
interface: |-
  export function parseClock(text: string): number
  export function formatClock(minutes: number): string
  export function legArrivals(departure: string, legs: number[][]): [string, number][]
stop_conditions:
  - Whether a layover after the final leg means anything is not stated.
