id: b285-trim-zeros
task_type: function_implementation
task: >-
  Implement trimZeros. Remove the leading zeros from a number written
  as text, always leaving at least one digit behind. A leading minus
  sign stays in front of the result. Text that is not a run of digits,
  with or without that sign, comes back exactly as it was.
target: solution.ts
interface: "export function trimZeros(text: string): string"
stop_conditions:
  - Whether a leading plus sign should be handled in the same way as a minus is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
