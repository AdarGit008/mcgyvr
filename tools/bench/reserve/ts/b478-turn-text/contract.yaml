id: b478-turn-text
task_type: function_implementation
task: >-
  Implement turnText. Say whether the second text can be reached from
  the first by moving some number of characters off the front and
  adding them to the back in the same order. Texts of unlike length
  never match, and two texts holding nothing do.
target: solution.ts
interface: "export function turnText(first: string, second: string): boolean"
stop_conditions:
  - Whether a text should be counted as a turn of itself is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
