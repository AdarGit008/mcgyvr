id: b098-month-ledger
task_type: bug_fix
task: >-
  monthLedger folds a worklog into monthly rows incorrectly. Each entry
  is a [stamp, minutes] pair: the stamp names a calendar day as
  YYYY-MM-DD and the minutes are the whole minutes worked that sitting;
  entries arrive in any order and a month may appear in many entries.
  The correct result has one [month, totalMinutes, entryCount] row per
  distinct month, the month written YYYY-MM, the total summing every
  entry of that month and the count telling how many entries fed it,
  rows sorted by month ascending; no entries means no rows. At present
  months that should stay apart come back merged into one row, and a
  merged row's total carries only whichever entry came last instead of a
  sum. Fix the grouping so every distinct calendar month gets its own
  correctly totalled row, and add the missing validation: reject a stamp
  that is not a YYYY-MM-DD string, a stamp whose month is outside 01 to
  12 or whose day is outside 01 to 31, and minutes that are not a
  positive integer, with an error. Return the complete fixed file.
target: solution.ts
target_content: |
  /** Per-month totals of a day-stamped worklog. */
  export function monthLedger(entries: [string, number][]): [string, number, number][] {
    if (!Array.isArray(entries)) {
      throw new Error("entries must be a list");
    }
    const minutesBy: Record<string, number> = {};
    const countBy: Record<string, number> = {};
    for (const [stamp, minutes] of entries) {
      const key = stamp.slice(0, 6);
      minutesBy[key] = minutes;
      countBy[key] = (countBy[key] ?? 0) + 1;
    }
    return Object.keys(minutesBy)
      .sort()
      .map((key) => [key, minutesBy[key], countBy[key]]);
  }
interface: "export function monthLedger(entries: [string, number][]): [string, number, number][]"
stop_conditions:
  - Whether a day that fits its bounds but not its month, like February 30, is rejected is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
