id: b075-byte-size
task_type: function_implementation
task: >-
  Implement parseByteSize. A storage size is written as a whole-number
  count followed directly by a binary unit suffix: B for bytes, KiB for
  1024 bytes, MiB for 1024 KiB and GiB for 1024 MiB, so "4KiB" is 4096 and
  "3MiB" is 3145728. The count is a run of decimal digits and may be 0.
  Return the size in bytes. The suffixes are case-sensitive, and "KB",
  "kib" and every other spelling not listed above is unknown. Reject a
  non-string argument, the empty string, a missing count, a missing or
  unknown unit, and any character beyond the count and its suffix, with an
  error.
