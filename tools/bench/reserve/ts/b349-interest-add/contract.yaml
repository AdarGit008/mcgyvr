id: b349-interest-add
task_type: function_implementation
task: >-
  Implement interestAdd. Add simple interest to an amount: the
  interest is the amount times a whole-percent rate for each year that
  passes, rounded down. Return the amount with that interest added. No
  years at all leaves the amount exactly as it was.
target: solution.ts
interface: "export function interestAdd(amount: number, rate: number, years: number): number"
stop_conditions:
  - Whether interest should itself earn interest each year is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
