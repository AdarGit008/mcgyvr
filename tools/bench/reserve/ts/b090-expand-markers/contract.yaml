id: b090-expand-markers
task_type: function_implementation
task: >-
  Implement expandMarkers. A message template names its insertions with
  percent-delimited markers: %city% is a marker whose name is city, and a
  name must be a letter or underscore followed by letters, digits or
  underscores. Scan the template left to right, replacing each marker with
  the value the mapping holds under that name; the two characters %%
  produce one literal percent sign, and replacement text is inserted
  exactly as given, never rescanned. A name may be used any number of
  times, the mapping may hold entries the template never uses, and a
  template with no markers comes back unchanged. Reject a template that is
  not a string, a marker whose name the mapping does not hold, a marker
  whose name is malformed, a percent sign opened and never closed before
  the end of the template, and a value picked for insertion that is not a
  string, with an error.
target: solution.ts
interface: "export function expandMarkers(template: string, values: Record<string, string>): string"
stop_conditions:
  - Whether the mapping's unused entries must also hold string values is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
