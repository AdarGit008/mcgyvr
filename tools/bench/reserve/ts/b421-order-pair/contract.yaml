id: b421-order-pair
task_type: bug_fix
task: >-
  lowOf returns the smaller of a pair's two numbers. orderPairs puts
  every pair in a list into order by that smaller number, and it
  orders them by the larger one instead. Fix orderPairs. A tie leaves
  the earlier pair earlier. Return the complete fixed file.
target: solution.ts
target_content: |
  export function lowOf(pair: number[]): number {
    return pair[0] < pair[1] ? pair[0] : pair[1];
  }

  /** The pairs in order by their smaller number. */
  export function orderPairs(pairs: number[][]): number[][] {
    const ordered = [...pairs];
    ordered.sort((a, b) => Math.max(a[0], a[1]) - Math.max(b[0], b[1]));
    return ordered;
  }
interface: "export function lowOf(pair: number[]): number
export function orderPairs(pairs: number[][]): number[][]"
stop_conditions:
  - Whether a pair may hold its two numbers in either order is not stated.
demonstration: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
