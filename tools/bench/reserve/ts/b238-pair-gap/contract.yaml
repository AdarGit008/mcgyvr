id: b238-pair-gap
task_type: function_implementation
task: >-
  Implement pairGap. Given a list of whole numbers, return the two
  values lying closest together in value, smaller one first. When two
  pairs are equally close, return the one that comes earlier once the
  values are in ascending order. Reject a list holding fewer than two
  values with an error.
target: solution.ts
interface: "export function pairGap(values: number[]): number[]"
stop_conditions:
  - Whether the input list may be reordered in place is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
