id: b362-up-runs
task_type: function_implementation
task: >-
  Implement up_runs. Return the length of the longest run of readings
  that rises at every step, each strictly above the one before it. A
  reading that does not rise begins a new run, and a list holding
  nothing has a longest run of nothing.
target: solution.py
interface: "def up_runs(readings: list) -> int"
stop_conditions:
  - Whether two equal readings should continue a run or break it is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
