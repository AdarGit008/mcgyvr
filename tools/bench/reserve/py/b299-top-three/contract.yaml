id: b299-top-three
task_type: bug_fix
task: >-
  top_three returns the three highest scores, highest first, and it
  returns the three lowest instead. Fix it. A list holding fewer than
  three scores returns all of them, still highest first. Return the
  complete fixed file.
target: solution.py
target_content: |
  def top_three(scores: list) -> list:
      """The three highest scores, highest first."""
      return sorted(scores)[:3]
interface: "def top_three(scores: list) -> list"
stop_conditions:
  - Whether the list it is given may be reordered in place is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
