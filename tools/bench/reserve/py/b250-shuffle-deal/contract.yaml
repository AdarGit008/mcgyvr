id: b250-shuffle-deal
task_type: bug_fix
task: >-
  shuffle_deal deals cards round the table one at a time into a number
  of hands, and deal_counts reports how many cards each hand holds.
  shuffle_deal deals wrongly: it hands out consecutive blocks instead
  of going round. Fix it. Dealing into no hands at all yields nothing.
  Return the complete fixed file.
target: solution.py
target_content: |
  def shuffle_deal(cards: list, hands: int) -> list:
      """Deal cards into hands, one at a time round the table."""
      if hands == 0:
          return []
      dealt = [[] for _ in range(hands)]
      for i, card in enumerate(cards):
          dealt[i // hands].append(card)
      return dealt


  def deal_counts(dealt: list) -> list:
      return [len(hand) for hand in dealt]
interface: "def shuffle_deal(cards: list, hands: int) -> list\ndef deal_counts(dealt: list) -> list"
stop_conditions:
  - Which hand should receive the first card when dealing begins is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
