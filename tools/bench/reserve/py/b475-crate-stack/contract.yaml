id: b475-crate-stack
task_type: function_implementation
task: >-
  crate_height names how tall one crate of a kind stands. crate_stack
  keeps the crates that fit below a ceiling, taken in the order given
  and stopping at the first that would carry the pile past it.
  Implement crate_stack. A pile reaching the ceiling exactly still
  fits, and an empty run keeps nothing.
target: solution.py
interface: "def crate_height(kind: str) -> int
def crate_stack(kinds: list[str], ceiling: int) -> list[str]"
stop_conditions:
  - Whether a ceiling below nothing should be rejected is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
