id: b213-macro-expand
task_type: function_implementation
task: >-
  Implement expand_macro. A snippet's text may carry macro references,
  each written as a dollar sign, an opening parenthesis, a name of
  lowercase letters and digits, an optional colon followed by a fallback,
  and a closing parenthesis: $(who) or $(who:nobody). A reference to a
  name the macros mapping holds becomes that macro's value, and the value
  is itself read for references the same way, so one macro may reach
  through others to any depth. A reference to a name the mapping does not
  hold becomes its fallback taken as written — a fallback never carries
  parentheses — or the empty string when the reference gives none. Every
  other character of the text passes through untouched. Return the
  expanded text. Reject a text whose expansion reaches a name already
  being expanded, a cycle, with an error.
target: solution.py
target_content: |
  import re

  REFERENCE = re.compile(r"\$\(([a-z0-9]+)(?::([^()]*))?\)")


  def _expand_into(text: str, macros: dict[str, str], active: tuple[str, ...]) -> str:
      # TODO: swap each $(name) or $(name:fallback) reference for the macro's
      # expanded value or its fallback, refusing a name already in active.
      return text


  def expand_macro(text: str, macros: dict[str, str]) -> str:
      # TODO: start the expansion with no macro active yet.
      return text
interface: "def expand_macro(text: str, macros: dict[str, str]) -> str"
stop_conditions:
  - Whether a reference whose name carries capital letters should be left as written or refused is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
