id: b044-route-hops
task_type: bug_fix
task: >-
  route_hops answers how many links a rider must travel between two
  stations of a transit map, and it wrongly treats every link as one-way,
  so a trip the map allows can come back unreachable or longer than it
  is. Fix it: a link joins two stations that may be ridden in either
  direction, the result is the smallest number of links leading from the
  origin to the goal, an origin equal to the goal costs zero links, and a
  goal no chain of links reaches yields -1; the map may hold rings, which
  must not trap the search. Also add the missing validation: reject an
  origin or goal that is not a non-empty string, a link that is not a
  two-item list, and a link station that is not a non-empty string, with
  an error. Return the complete fixed file.
target: solution.py
target_content: |
  """Fewest links to ride between two stations of a transit map."""


  def route_hops(links: list, origin: str, goal: str) -> int:
      next_stops = {}
      for link in links:
          next_stops.setdefault(link[0], []).append(link[1])
      seen = {origin}
      queue = [(origin, 0)]
      for station, hops in queue:
          if station == goal:
              return hops
          for neighbour in next_stops.get(station, []):
              if neighbour not in seen:
                  seen.add(neighbour)
                  queue.append((neighbour, hops + 1))
      return -1
interface: "def route_hops(links: list, origin: str, goal: str) -> int"
stop_conditions:
  - Whether a link may join a station to itself is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
