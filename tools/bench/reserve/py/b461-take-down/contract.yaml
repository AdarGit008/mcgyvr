id: b461-take-down
task_type: bug_fix
task: >-
  take_down removes a stated amount from a stock figure and returns
  what is left, and it removes the amount twice over. Fix it. Removing
  more than is held is rejected with an error. Return the complete
  fixed file.
target: solution.py
target_content: |
  def take_down(held: int, amount: int) -> int:
      """What is left after an amount is taken from stock."""
      if amount > held:
          raise ValueError("more than is held cannot be taken")
      return held - amount - amount
interface: "def take_down(held: int, amount: int) -> int"
stop_conditions:
  - Whether an amount below nothing should add to the stock is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
