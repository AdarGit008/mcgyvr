id: b247-receipt-net
task_type: bug_fix
task: >-
  receipt_net totals the amounts on a receipt while leaving out any
  line that has been voided, and it leaves nothing out: voided lines
  are counted along with the rest. Fix it. A receipt with no lines
  totals zero. Return the complete fixed file.
target: solution.py
target_content: |
  def receipt_net(lines: list) -> int:
      """The net total of a receipt, leaving out voided lines."""
      net = 0
      for line in lines:
          net += line["amount"]
      return net
interface: "def receipt_net(lines: list) -> int"
stop_conditions:
  - Whether a voided line with a negative amount should still be skipped is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
