id: b383-store-put
task_type: bug_fix
task: >-
  put_one returns a store with one key set, leaving the store it was
  given untouched, and it writes into that store instead. put_all sets
  several keys the same way. Fix put_one so the caller's store is
  never altered. An empty key is rejected with an error. Return the
  complete fixed file.
target: solution.py
target_content: |
  def put_one(store: dict, key: str, value: str) -> dict:
      if key == "":
          raise ValueError("a key must be named")
      store[key] = value
      return store


  def put_all(store: dict, pairs: list) -> dict:
      """Several keys set at once, the given store left untouched."""
      out = store
      for key, value in pairs:
          out = put_one(out, key, value)
      return out
interface: "def put_one(store: dict, key: str, value: str) -> dict
def put_all(store: dict, pairs: list) -> dict"
stop_conditions:
  - Whether a key made only of spaces should count as empty is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
