id: b262-queue-call
task_type: bug_fix
task: >-
  queue_call finds the next ticket to serve after the one just called,
  passing over any ticket that has been withdrawn, and it passes over
  one ticket too many: it begins looking after the ticket following
  the one called. Fix it. When nothing is left to serve it returns
  nothing. Return the complete fixed file.
target: solution.py
target_content: |
  def queue_call(tickets: list, withdrawn: list, called: str):
      """The next ticket to serve after the one just called."""
      at = tickets.index(called)
      for i in range(at + 2, len(tickets)):
          if tickets[i] not in withdrawn:
              return tickets[i]
      return None
interface: "def queue_call(tickets: list, withdrawn: list, called: str)"
stop_conditions:
  - What should happen when the ticket just called is not on the list at all is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
