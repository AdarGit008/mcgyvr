id: b397-pick-max
task_type: function_implementation
task: >-
  Implement pick_max. Given records that each may carry a named
  numeric field, return the record holding the highest value of it.
  When two records tie the earlier one wins, and a set in which none
  carry the field gives an empty record.
target: solution.py
interface: "def pick_max(records: list, field: str) -> dict"
stop_conditions:
  - Whether a record lacking the field should ever win is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
