id: b071-shelf-count
task_type: bug_fix
task: >-
  shelf_count replays a stock shelf's movement ledger and reports the shelf
  wrongly. The first argument is the count already on the shelf, the second
  a ledger of moves applied in order, each a two-item pair: ["receive",
  qty] puts qty units onto the shelf and ["issue", qty] draws qty units off
  it. Return {ending, peak}: the count left at the end and the highest
  count the shelf held at any moment, the starting count included — an
  empty ledger reports the starting count for both. At present the peak is
  tracked from zero rather than from the starting count, so a ledger
  holding only issues reports a peak of zero however full the shelf began,
  and an issue larger than the current count silently drives the shelf
  negative. Also add the missing validation: reject a starting count that
  is not a non-negative integer, a move that is not a two-item pair, a qty
  that is not a positive integer, a kind other than receive and issue, and
  an issue drawing more than the shelf then holds, with an error. Return
  the complete fixed file.
target: solution.py
target_content: |
  def shelf_count(on_hand, moves):
      ending = on_hand
      peak = 0
      for kind, qty in moves:
          if kind == "receive":
              ending += qty
              peak = max(peak, ending)
          else:
              ending -= qty
      return {"ending": ending, "peak": peak}
interface: "def shelf_count(on_hand: int, moves: list) -> dict"
stop_conditions:
  - Whether a qty has an upper bound is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
