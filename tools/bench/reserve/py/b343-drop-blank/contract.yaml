id: b343-drop-blank
task_type: bug_fix
task: >-
  drop_blank removes the empty labels from a list, and it removes
  labels made only of spaces as well, which is more than it was asked
  to do. Fix it so only a label with no characters at all goes, and
  what is left keeps its order. Return the complete fixed file.
target: solution.py
target_content: |
  def drop_blank(labels: list) -> list:
      """The labels that are not empty, in order."""
      return [label for label in labels if label.strip()]
interface: "def drop_blank(labels: list) -> list"
stop_conditions:
  - Whether a label of a single tab should count as empty is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
