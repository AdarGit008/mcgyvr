id: b081-stock-average
task_type: bug_fix
task: >-
  run_stockbook replays one warehouse item's stockbook and costs its issues
  wrongly. A move is a list opening with its action: a receive move,
  ["receive", quantity, cost], books quantity units bought at cost cents
  each, and an issue move, ["issue", quantity], sends quantity units out.
  The book returns {held, worth, issued} after the final move: held the
  units on hand, worth the cents the held stock cost, issued the cents
  relieved by everything sent out. Under moving-average costing an issue
  relieves the floor of worth times its quantity divided by held; the
  current code prices issues at the most recent receive's unit cost
  instead, so the book drifts whenever receives arrived at different
  prices, and nothing stops an issue from overdrawing the stock. Fix the
  costing and add the missing validation: reject an issue of more units
  than are held and an issue quantity that is not a positive integer, with
  an error. The helper receipt_cents is correct — it already rejects a
  receive quantity that is not a positive integer and a unit cost that is
  not a non-negative integer of cents — and must not change. Return the
  complete fixed file.
target: solution.py
target_content: |
  """One warehouse item's stockbook under moving-average costing."""


  def receipt_cents(qty, unit_cents):
      if not isinstance(qty, int) or qty <= 0:
          raise ValueError("receive quantity must be a positive integer")
      if not isinstance(unit_cents, int) or unit_cents < 0:
          raise ValueError("unit cost must be a non-negative integer of cents")
      return qty * unit_cents


  def run_stockbook(moves):
      held = 0
      worth = 0
      issued = 0
      last_unit = 0
      for move in moves:
          if move[0] == "receive":
              qty = move[1]
              worth += receipt_cents(qty, move[2])
              held += qty
              last_unit = move[2]
          elif move[0] == "issue":
              qty = move[1]
              relief = qty * last_unit
              worth -= relief
              issued += relief
              held -= qty
      return {"held": held, "worth": worth, "issued": issued}
interface: |-
  def run_stockbook(moves: list) -> dict
  def receipt_cents(qty: int, unit_cents: int) -> int
stop_conditions:
  - How a move whose action is neither receive nor issue is handled is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
