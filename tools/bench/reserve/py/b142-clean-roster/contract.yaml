          raise ValueError("clean_roster expects a list of names")
      seen = set()
      kept = []
      for raw in names:
          pass  # TODO: reject a bad entry, tidy its spacing, keep only first appearances
      return kept
interface: "def clean_roster(names: list) -> list"
stop_conditions:
  - How letter case beyond ASCII letters compares between two entries is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
