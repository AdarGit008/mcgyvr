id: b142-clean-roster
task_type: function_implementation
task: >-
  Implement clean_roster. A tool crib's sign-out sheet accumulates borrower
  names typed in a hurry. Normalize the sheet: trim each entry's leading
  and trailing whitespace and collapse every internal run of whitespace to
  a single space; then drop repeats — two cleaned entries that match
  ignoring letter case count as the same borrower — keeping each
  borrower's first cleaned spelling, in first-appearance order. Return the
  cleaned list. Reject an argument that is not a list, an entry that is
  not a string, and an entry that is empty or only whitespace, with an
  error.
target: solution.py
target_content: |
