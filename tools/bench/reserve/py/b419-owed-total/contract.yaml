id: b419-owed-total
task_type: bug_fix
task: >-
  owed_total adds up what is owed across a ledger, counting a charge
  as owed and a payment as reducing it, and it counts payments as owed
  too. Fix it. A ledger entry is a payment when its amount stands
  below nothing. Reject a total that would fall below nothing with an
  error. Return the complete fixed file.
target: solution.py
target_content: |
  def owed_total(entries: list) -> int:
      """What is owed across a ledger of charges and payments."""
      total = 0
      for entry in entries:
          total += abs(entry)
      if total < 0:
          raise ValueError("the total cannot fall below nothing")
      return total
interface: "def owed_total(entries: list) -> int"
stop_conditions:
  - Whether an entry of exactly nothing should count as either is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
