id: b018-status-word
task_type: function_implementation
task: >-
  Implement decode_status_word. The input is one 16-bit telemetry status
  word, an integer from 0 to 65535. Bits 15 down to 12 carry the channel,
  unsigned. Bits 11 down to 2 carry the reading, a 10-bit two's-complement
  value from -512 to 511. Bit 1 is the stale flag. Bit 0 is a parity bit
  the sender picks so that the whole word carries an even count of one
  bits. Return the decoded fields as {channel, reading, stale} with stale
  as a boolean. Reject a word that is not an integer, counting booleans as
  non-integers, a word below 0 or above 65535, and a word whose count of
  one bits is odd, with an error.
target: solution.py
