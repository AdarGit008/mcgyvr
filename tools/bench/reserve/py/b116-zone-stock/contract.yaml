id: b116-zone-stock
task_type: function_implementation
task: >-
  Implement zone_stock, with its helper rack_units. A storeroom is a tree
  of zones: a zone carries a name, its bins — a mapping from sku to the
  units racked right there — and its children, a list of sub-zones.
  rack_units takes one zone's bins and a sku and returns the units the
  bins record for that sku, zero when the sku is not listed; it rejects
  a sku that is not a non-empty string and a listed count for that sku
  that is not a positive integer, with an error. zone_stock walks the
  tree from the given zone, each zone before its children and the
  children in order, and returns {total, holders}: total the units of
  the sku racked across the whole tree, holders the names of the zones
  whose own bins list the sku, in visiting order. Reject a zone that is
  not such a record, a zone name that is missing or not a non-empty
  string, bins that are not a mapping, children that are not a list,
  and one name on two zones anywhere in the tree, with an error.
target: solution.py
interface: |-
  def zone_stock(zone: dict, sku: str) -> dict
  def rack_units(bins: dict, sku: str) -> int
stop_conditions:
  - Whether counts recorded for skus other than the requested one are validated is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
