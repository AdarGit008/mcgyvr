id: b109-pick-snippet
task_type: function_implementation
task: >-
  Implement pick_snippet. The query is a string of search words and
  sentences is a non-empty list of sentence strings. Words are maximal
  runs of ASCII letters and digits, compared lowercased, so matching
  ignores case and punctuation and only whole words count. Score each
  sentence by how many distinct query words appear among its words —
  repeats add nothing. Return the sentence with the highest score; when
  two sentences tie, the one with fewer words in total wins, and a tie on
  that too falls to the earlier sentence. Reject a query that is not a
  string, a query with no words in it, a sentences argument that is not a
  non-empty list, a sentence that is not a non-empty string, and a query
  no sentence matches at all, with an error.
target: solution.py
target_content: |
  import re


  def pick_snippet(query, sentences):
      def words_of(text):
          return re.findall(r"[a-z0-9]+", text.lower())

      if not isinstance(query, str):
          raise ValueError("query must be a string")
      wanted = set(words_of(query))
      if not wanted:
          raise ValueError("query holds no words")
      if not isinstance(sentences, list) or not sentences:
          raise ValueError("sentences must be a non-empty list")
      # TODO: check each sentence is a non-empty string, score it by how
      # many distinct query words it holds, and return the best scorer —
      # fewer total words breaks a tie, then the earlier sentence; reject
      # when no sentence holds any query word.
      return sentences[0]
interface: "def pick_snippet(query: str, sentences: list) -> str"
stop_conditions:
  - Whether letters beyond ASCII count as word characters is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
