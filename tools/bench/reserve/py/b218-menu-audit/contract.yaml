id: b218-menu-audit
task_type: function_implementation
task: >-
  Implement audit_menu. A café's menu is a tree of nodes, each node holding
  label, its wording, and items, the list of nodes filed under it, empty for a
  plain dish. Walk the tree from the root and return the complaints the menu
  earns as a list of strings, a node's own complaints before those of anything
  filed under it and nodes visited in the order they are filed. A node's trail
  is the labels from the root down to it joined by " > ". Each node earns
  "<trail>: blank label" when its label is empty or nothing but spaces, then
  "<trail>: duplicate" when a node filed earlier under the same parent carries
  the very same label, then "<trail>: too deep" when it sits further below the
  root than max_depth allows, the root itself sitting at 0. A menu with nothing
  to complain about returns an empty list. Reject a max_depth that is not a
  whole number of at least 0 with an error.
target: solution.py
interface: "def audit_menu(root: dict, max_depth: int) -> list[str]"
stop_conditions:
  - Whether labels differing only in letter case count as the same label is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
