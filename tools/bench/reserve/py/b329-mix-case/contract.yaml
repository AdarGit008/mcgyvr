id: b329-mix-case
task_type: function_implementation
task: >-
  Implement mix_case. Return the text with its letters alternating
  case, the first letter upper, the next lower and so on. A character
  that is not a letter is left exactly as it is and does not move the
  alternation along.
target: solution.py
interface: "def mix_case(text: str) -> str"
stop_conditions:
  - Whether the alternation should start again at each new word is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
