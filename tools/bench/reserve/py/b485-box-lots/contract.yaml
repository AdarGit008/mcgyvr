id: b485-box-lots
task_type: bug_fix
task: >-
  box_lots packs entries into lots of a given size, filling each lot
  in the order the entries arrive before opening the next. A closing
  lot that does not fill is still packed and given back with the rest.
  Fix box_lots. A run holding nothing packs nothing. Return the
  complete fixed file.
target: solution.py
target_content: |
  def box_lots(entries: list[str], size: int) -> list[list[str]]:
      packed = []
      lot = []
      for entry in entries:
          lot.append(entry)
          if len(lot) == size:
              packed.append(lot)
              lot = []
      return packed
interface: "def box_lots(entries: list[str], size: int) -> list[list[str]]"
stop_conditions:
  - Whether a lot size below one should be rejected is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
