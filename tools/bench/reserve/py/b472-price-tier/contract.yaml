id: b472-price-tier
task_type: function_implementation
task: >-
  tier_rate names the charge in cents for one unit at a given count.
  tier_cost gives the whole charge in cents for that count, taking
  every unit at the rate its count earns. Implement tier_cost. A count
  of nothing costs nothing, and any other charge is lifted to a
  hundred cents where it falls below that.
target: solution.py
interface: "def tier_rate(units: int) -> int
def tier_cost(units: int) -> int"
stop_conditions:
  - Whether a count below nothing should be rejected is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
