id: b497-fold-rests
task_type: function_implementation
task: >-
  is_rest says whether an entry is a rest, meaning it holds nothing
  once its blank space is taken off. fold_rests gives back the run
  with every unbroken stretch of rests standing as a single dash, and
  every other entry left as it was. Implement fold_rests.
target: solution.py
interface: "def is_rest(entry: str) -> bool
def fold_rests(entries: list[str]) -> list[str]"
stop_conditions:
  - Whether a run made up only of rests should give back a single dash is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
