id: b088-locked-options
task_type: bug_fix
task: >-
  settle_options builds the options a tool actually runs with from three
  sources, and its precedence is wrong: a value given as a flag loses to
  the one from the file, and a locked key is silently overwritten instead
  of being refused. Fix it: start from the defaults mapping, let the file
  mapping replace entries key by key, then let the flag mapping replace
  both — except that a key named in the locked list is pinned once the
  file has spoken, so a flag entry for such a key is an error, never an
  override. A key appearing in only one source passes through, an empty
  source changes nothing, and none of the sources may be mutated. Return
  the settled flat mapping. Also add the missing validation: reject a
  source that is not a flat mapping of string values, and a locked
  argument that is not a list of strings, with an error. Return the
  complete fixed file.
target: solution.py
target_content: |
  """The options a tool runs with, settled from defaults, file and flags."""


  def settle_options(defaults: dict, file_values: dict,
                     flag_values: dict, locked: list) -> dict:
      settled = {}
      for key, value in defaults.items():
          settled[key] = value
      for key, value in flag_values.items():
          settled[key] = value
      for key, value in file_values.items():
          settled[key] = value
      return settled
interface: "def settle_options(defaults: dict, file_values: dict, flag_values: dict, locked: list) -> dict"
stop_conditions:
  - Whether an empty string is a legal option key is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
