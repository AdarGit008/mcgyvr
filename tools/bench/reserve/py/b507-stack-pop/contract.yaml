id: b507-stack-pop
task_type: function_implementation
task: >-
  Implement stack_pop. Work through a run of orders against a pile.
  The order to take removes whatever went on last; every other order
  puts its own text on the pile. Give back the pile that is left,
  oldest first. Reject an order to take from an empty pile with an
  error.
target: solution.py
interface: "def stack_pop(orders: list[str]) -> list[str]"
stop_conditions:
  - Whether an order holding nothing should be put on the pile is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
