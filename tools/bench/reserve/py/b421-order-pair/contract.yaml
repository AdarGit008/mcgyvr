id: b421-order-pair
task_type: bug_fix
task: >-
  low_of returns the smaller of a pair's two numbers. order_pairs puts
  every pair in a list into order by that smaller number, and it
  orders them by the larger one instead. Fix order_pairs. A tie leaves
  the earlier pair earlier. Return the complete fixed file.
target: solution.py
target_content: |
  def low_of(pair: list) -> int:
      return pair[0] if pair[0] < pair[1] else pair[1]


  def order_pairs(pairs: list) -> list:
      """The pairs in order by their smaller number."""
      return sorted(pairs, key=lambda pair: max(pair[0], pair[1]))
interface: "def low_of(pair: list) -> int
def order_pairs(pairs: list) -> list"
stop_conditions:
  - Whether a pair may hold its two numbers in either order is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
