id: b010-normalize-label
task_type: bug_fix
task: >-
  normalize_label cleans up user-typed labels incorrectly: whitespace
  around the label turns into stray hyphens instead of being removed, and
  a run of consecutive separators becomes several hyphens instead of one.
  Fix it: trim surrounding whitespace, lowercase, replace every run of
  spaces, underscores and hyphens with a single hyphen, and drop any
  hyphens left at either end, so a label typed as " Team  Alpha " becomes
  "team-alpha". The 32-character limit and the reserved names "new",
  "all" and "none" continue to apply, judged on the finished label. Also
  add the missing validation: reject a non-string argument, any character
  in the trimmed input other than ASCII letters, digits, spaces,
  underscores and hyphens, and a label that is empty once normalized,
  with an error. Return the complete fixed file.
target: solution.py
target_content: |
  """Normalize a user-typed label into its canonical hyphenated form."""

  RESERVED = ("new", "all", "none")


  def normalize_label(raw: str) -> str:
      label = raw.lower()
      label = label.replace(" ", "-")
      label = label.replace("_", "-")
      if len(label) > 32:
          raise ValueError("label is longer than 32 characters")
      if label in RESERVED:
          raise ValueError("label is a reserved name")
      return label
interface: "def normalize_label(raw: str) -> str"
stop_conditions:
  - Which rejection wins when a label violates more than one rule is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
