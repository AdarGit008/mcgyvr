id: b052-weave-rounds
task_type: function_implementation
task: >-
  Implement weave_rounds, whose companion widest_list is already written.
  The input is a list of lanes, each lane a list of items. widest_list
  returns the length of the longest lane, and zero when there are no lanes.
  weave_rounds merges the lanes round by round into one flat list: round
  zero takes the first item of every lane in lane order, round one takes
  the second item of every lane that still has one, and so on until even
  the widest lane is exhausted. No lanes at all, and lanes that are all
  empty, both weave into an empty list; a single lane weaves into a copy of
  itself. Reject an argument that is not a list and a lane that is not a
  list, with an error.
target: solution.py
target_content: |
  def widest_list(lanes):
      widest = 0
      for lane in lanes:
          if len(lane) > widest:
              widest = len(lane)
      return widest


  def weave_rounds(lanes):
      # TODO: validate the argument, then take round zero of every lane in
      # lane order, round one of every lane that still has one, and so on.
      raise NotImplementedError
interface: |-
  def weave_rounds(lanes: list) -> list
  def widest_list(lanes: list) -> int
stop_conditions:
  - What widest_list does with an argument that is not a list of lists is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
