id: b136-amount-column
task_type: function_implementation
task: >-
  Implement total_amounts; its digit-arithmetic helpers are already written.
  The input is a list of amount strings, each decimal digits with an
  optional dot followed by one or more fraction digits; an underscore may
  sit between two digits of the whole part as visual grouping, as in
  "1_204.50". Sum the amounts exactly by digit arithmetic — a total may
  exceed what floating point holds — and return it as a string whose whole
  part is grouped with underscores every three digits from the right and
  whose fraction carries exactly as many digits as the longest fraction
  among the inputs, or no dot at all when no input has one. Reject an
  argument that is not a list, an empty list, an amount that is not a
  string, and a malformed amount — empty, a digit missing before its dot or
  after it, an underscore not between two whole-part digits, or any other
  character — with an error.
target: solution.py
target_content: |
  """Sum a column of decimal amount strings exactly, by digit arithmetic."""

  import re


  def add_digits(a, b):
      carry = 0
      out = []
      for i in range(max(len(a), len(b))):
          da = int(a[len(a) - 1 - i]) if i < len(a) else 0
          db = int(b[len(b) - 1 - i]) if i < len(b) else 0
          carry, digit = divmod(da + db + carry, 10)
          out.append(str(digit))
      if carry:
          out.append(str(carry))
      return "".join(reversed(out))


  def group_thousands(digits):
      grouped = []
      for i, ch in enumerate(digits):
          if i > 0 and (len(digits) - i) % 3 == 0:
              grouped.append("_")
          grouped.append(ch)
      return "".join(grouped)


  def total_amounts(amounts: list) -> str:
      # TODO: validate every amount, align the fraction digits, and add with
      # add_digits so totals beyond float precision stay exact; group the
      # whole part of the result with group_thousands.
      total = 0.0
      for amount in amounts:
          total += float(amount.replace("_", ""))
      return str(total)
interface: "def total_amounts(amounts: list) -> str"
stop_conditions:
  - Whether leading zeros in an amount's whole part are accepted is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
