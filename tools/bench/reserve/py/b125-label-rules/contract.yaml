id: b125-label-rules
task_type: bug_fix
task: >-
  best_action picks the wrong rule; compile_rules is correct and must not
  change. compile_rules turns a list of [pattern, action] pairs into the
  rule table best_action searches. A pattern faces a whole candidate
  string: the character ? stands for exactly one character, a single *
  stands for a run of zero or more characters, and every other character
  stands for itself, so a pattern without * only fits text of exactly its
  own length, and a pattern with * splits into a head anchored at the
  start and a tail anchored at the end, fitting when the text is long
  enough for both. compile_rules records each rule's pattern, action and
  literals — how many pattern characters are neither ? nor * — and
  rejects a pattern or action that is not a non-empty string, a pattern
  holding more than one *, and a pattern repeated in the list, with an
  error. best_action must return the action of the fitting rule with the
  most literals, the earliest such rule on a tie, or a null result when no
  rule fits, and must reject a candidate that is not a string with an
  error — that rejection is missing. At present best_action checks a
  pattern only up to its * against the start of the candidate: the end is
  never anchored and lengths are never compared, so a starless pattern
  accepts any longer text that begins correctly and a *-tail is ignored,
  and it returns the first rule in table order that survives this loose
  test, so rule order silently outranks literals. Fix best_action to
  anchor both ends and pick by literals. Return the complete fixed file.
target: solution.py
target_content: |
  """Wildcard label rules: compile once, then pick the most specific action."""


  def segment_matches(segment, text, start):
      for offset, wanted in enumerate(segment):
          at = start + offset
          if wanted != "?" and (at >= len(text) or wanted != text[at]):
              return False
      return True


  def compile_rules(pairs):
      rules = []
      seen = set()
      for pattern, action in pairs:
          if not isinstance(pattern, str) or pattern == "":
              raise ValueError("pattern must be a non-empty string")
          if not isinstance(action, str) or action == "":
              raise ValueError("action must be a non-empty string")
          if pattern.count("*") > 1:
              raise ValueError("at most one * per pattern")
          if pattern in seen:
              raise ValueError("pattern repeated: " + pattern)
          seen.add(pattern)
          literals = sum(1 for piece in pattern if piece not in "?*")
          rules.append({"pattern": pattern, "action": action, "literals": literals})
      return rules


  def best_action(rules, text):
      for rule in rules:
          pattern = rule["pattern"]
          star = pattern.find("*")
          head = pattern if star == -1 else pattern[:star]
          if len(text) >= len(head) and segment_matches(head, text, 0):
              return rule["action"]
      return None
interface: |-
  def compile_rules(pairs: list) -> list
  def best_action(rules: list, text: str)
stop_conditions:
  - Whether the candidate text may itself contain ? or * as ordinary characters is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
