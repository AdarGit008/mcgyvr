id: b372-group-runs
task_type: bug_fix
task: >-
  run_of returns how many times a value repeats without a break from a
  given place. group_runs breaks a list into those runs, and it
  forgets the final one. Fix group_runs. A list holding nothing breaks
  into no runs at all. Return the complete fixed file.
target: solution.py
target_content: |
  def run_of(entries: list, start: int) -> int:
      length = 1
      while start + length < len(entries) and entries[start + length] == entries[start]:
          length += 1
      return length


  def group_runs(entries: list) -> list:
      """The list broken into runs of equal neighbouring values."""
      runs = []
      i = 0
      while i < len(entries):
          length = run_of(entries, i)
          if i + length < len(entries):
              runs.append(entries[i : i + length])
          i += length
      return runs
interface: "def run_of(entries: list, start: int) -> int
def group_runs(entries: list) -> list"
stop_conditions:
  - Whether values that are equal but of different kinds should join one run is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
