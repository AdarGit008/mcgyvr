id: b237-blot-mask
task_type: bug_fix
task: >-
  blot_mask hides a reference code by starring out everything except
  its last four characters, and it masks the wrong end: it keeps the
  first four visible instead. Fix it. A code of four characters or
  fewer comes back untouched. Return the complete fixed file.
target: solution.py
target_content: |
  def blot_mask(code: str) -> str:
      """Hide a reference code, leaving only its tail readable."""
      if len(code) <= 4:
          return code
      return code[:4] + "*" * (len(code) - 4)
interface: "def blot_mask(code: str) -> str"
stop_conditions:
  - Whether a code containing spaces should have them masked too is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
