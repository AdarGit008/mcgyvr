id: b420-drop-mark
task_type: bug_fix
task: >-
  drop_mark removes every occurrence of a marked character from a
  text, and it removes everything except that character instead. Fix
  it. A text not holding the character comes back unchanged. Return
  the complete fixed file.
target: solution.py
target_content: |
  def drop_mark(text: str, mark: str) -> str:
      """The text with every occurrence of a marked character removed."""
      out = ""
      for ch in text:
          if ch == mark:
              out += ch
      return out
interface: "def drop_mark(text: str, mark: str) -> str"
stop_conditions:
  - Whether the marked character may be more than one character is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
