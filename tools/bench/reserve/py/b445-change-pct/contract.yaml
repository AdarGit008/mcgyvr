id: b445-change-pct
task_type: bug_fix
task: >-
  change_pct reports the change from an old value to a new one as a
  whole percentage of the old value, rounded down, and it takes the
  percentage of the new value instead. Fix it. An old value of nothing
  reports no change. Return the complete fixed file.
target: solution.py
target_content: |
  def change_pct(old: int, fresh: int) -> int:
      """The change from an old value to a new one, as a percentage of the old."""
      if old == 0:
          return 0
      return (fresh - old) * 100 // fresh
interface: "def change_pct(old: int, fresh: int) -> int"
stop_conditions:
  - Whether a value below nothing should be accepted is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
