id: b039-pivot-margins
task_type: function_implementation
task: >-
  Implement pivot_margins. The input is a flat list of entries, each a
  [row, column, amount] triple; pivot it into a dense table. Entries
  landing on the same row and column pair accumulate into one cell.
  Return {rows, cols, cells, row_totals, col_totals, grand, blanks,
  leaders}: rows and cols are the distinct labels, each ordered by its
  descending total with ties alphabetical ascending; cells is the matrix
  of sums in that ordering, holding zero where no entry landed;
  row_totals, col_totals and grand are the margin sums; blanks counts the
  cells that received no entry at all — a cell whose amounts cancel to
  zero is not blank; leaders gives, per row, the column label of that
  row's largest cell, ties going to the leftmost tied column in the
  returned column order. Amounts may be negative. No entries yields empty
  lists and a zero grand and blanks. Reject an entries argument that is
  not a list, an entry that is not a three-item list, a row or column
  label that is not a non-empty string, and an amount that is not an
  integer, with an error.
target: solution.py
interface: "def pivot_margins(entries: list) -> dict"
stop_conditions:
  - Whether label comparison should fold letter case is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
