id: b378-nest-get
task_type: bug_fix
task: >-
  nest_get walks a path of keys into nested mappings and returns what
  it finds, or empty text when the path leads nowhere, and it gives up
  as soon as a step holds a mapping rather than following it. Fix it.
  An empty path returns empty text. Return the complete fixed file.
target: solution.py
target_content: |
  def nest_get(tree: dict, path: list) -> str:
      """What a path of keys finds in nested mappings."""
      here = tree
      for key in path:
          if not isinstance(here, dict):
              return ""
          nxt = here.get(key)
          if not isinstance(nxt, str):
              return ""
          here = nxt
      return here if isinstance(here, str) else ""
interface: "def nest_get(tree: dict, path: list) -> str"
stop_conditions:
  - Whether a path may name a key holding a list is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
