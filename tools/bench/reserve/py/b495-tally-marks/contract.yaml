id: b495-tally-marks
task_type: function_implementation
task: >-
  mark_value names what one mark is worth. tally_marks totals a line
  of marks, but a mark standing straight after another of its own kind
  is worth twice its usual value. Implement tally_marks. A line
  holding no marks totals nothing.
target: solution.py
interface: "def mark_value(mark: str) -> int
def tally_marks(line: str) -> int"
stop_conditions:
  - Whether a run of three of a kind should double again on the third is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
