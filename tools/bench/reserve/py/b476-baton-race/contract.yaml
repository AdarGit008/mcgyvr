id: b476-baton-race
task_type: bug_fix
task: >-
  baton_race totals a race from the time of each leg and the cost of
  one handover. A handover falls between two legs, so it is paid once
  less often than there are legs, never before the first or after the
  last. Fix baton_race. A race with no legs totals nothing. Return the
  complete fixed file.
target: solution.py
target_content: |
  def baton_race(legs: list[int], handover: int) -> int:
      if len(legs) == 0:
          return 0
      total = 0
      for leg in legs:
          total += leg
      return total + handover * len(legs)
interface: "def baton_race(legs: list[int], handover: int) -> int"
stop_conditions:
  - Whether a handover cost below nothing should be rejected is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
