id: b040-panel-coverage
task_type: bug_fix
task: >-
  panel_coverage misreads two of its statistics and validates nothing.
  Each panel is an [x1, y1, x2, y2] axis-aligned rectangle on the integer
  grid, covering x1 up to but not including x2 and y1 up to but not
  including y2. The report carries union, the total ground covered by at
  least one panel; overlap, the ground covered by two or more; deepest,
  the greatest number of panels stacked over any single point, zero with
  no panels; perimeter, the length of the boundary between covered and
  uncovered ground, seams between covered patches not included; and
  bounds, the tightest [min_x, min_y, max_x, max_y] enclosing every
  panel, null with none. As shipped, overlap comes back zero wherever
  exactly two panels share ground — only ground under at least three
  registers — and perimeter counts every side of every covered patch,
  seams included, so it runs long whenever coverage spans more than one
  patch. Fix both statistics. Also add the missing validation: reject a
  panels argument that is not a list, a panel that is not a four-item
  list, a coordinate that is not an integer, and a panel whose x1 does
  not lie below its x2 or whose y1 does not lie below its y2, with an
  error. Return the complete fixed file.
target: solution.py
target_content: |
  """Coverage statistics for axis-aligned panels laid over an integer grid."""


  def panel_coverage(panels: list) -> dict:
      if not panels:
          return {
              "union": 0,
              "overlap": 0,
              "deepest": 0,
              "perimeter": 0,
              "bounds": None,
          }
      xs = sorted({edge for panel in panels for edge in (panel[0], panel[2])})
      ys = sorted({edge for panel in panels for edge in (panel[1], panel[3])})
      covered = [[False] * len(ys) for _ in xs]
      union = 0
      overlap = 0
      deepest = 0
      for i in range(len(xs) - 1):
          for j in range(len(ys) - 1):
              depth = 0
              for p in panels:
                  if (
                      p[0] <= xs[i]
                      and xs[i + 1] <= p[2]
                      and p[1] <= ys[j]
                      and ys[j + 1] <= p[3]
                  ):
                      depth += 1
              area = (xs[i + 1] - xs[i]) * (ys[j + 1] - ys[j])
              if depth >= 1:
                  union += area
                  covered[i][j] = True
              if depth > 2:
                  overlap += area
              if depth > deepest:
                  deepest = depth
      perimeter = 0
      for i in range(len(xs) - 1):
          for j in range(len(ys) - 1):
              if covered[i][j]:
                  width = xs[i + 1] - xs[i]
                  height = ys[j + 1] - ys[j]
                  perimeter += 2 * (width + height)
      bounds = [
          min(p[0] for p in panels),
          min(p[1] for p in panels),
          max(p[2] for p in panels),
          max(p[3] for p in panels),
      ]
      return {
          "union": union,
          "overlap": overlap,
          "deepest": deepest,
          "perimeter": perimeter,
          "bounds": bounds,
      }
interface: "def panel_coverage(panels: list) -> dict"
stop_conditions:
  - Whether coordinate magnitudes are bounded is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
