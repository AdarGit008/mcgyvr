      raise NotImplementedError
interface: |-
  def expand_selection(spec: str) -> list
  def read_span(segment: str) -> list
stop_conditions:
  - Whether a page number may carry leading zeros is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
