id: b042-page-selection
task_type: function_implementation
task: >-
  Implement expand_selection, whose helper read_span is already written. A
  page selection is the comma-separated form print dialogs use, like
  1-3,7,10-12: each piece is either one page number or a low-high span
  joined by a dash, every number a positive whole number. read_span turns
  one piece into its [low, high] pair — a lone page repeats as both
  ends — and errors on a piece that is not digits or digits-dash-digits
  and on a span whose high end sits below its low end. expand_selection
  splits the selection on commas, expands every piece through read_span,
  and returns the selected pages as one flat ascending list; each piece
  must start past the highest page already selected, so pieces may touch —
  4,5-6 selects 4, 5 and 6 — but never overlap or run backwards. Reject a
  selection that is not a string or is empty, a malformed piece — an empty
  piece included — a backwards span, and a piece that does not move the
  selection forward, with an error.
target: solution.py
target_content: |
  import re


  def read_span(segment: str) -> list:
      m = re.fullmatch(r"([1-9]\d*)(?:-([1-9]\d*))?", segment)
      if m is None:
          raise ValueError("malformed piece: " + segment)
      low, high = int(m.group(1)), int(m.group(2) or m.group(1))
      if high < low:
          raise ValueError("span runs backwards: " + segment)
      return [low, high]


