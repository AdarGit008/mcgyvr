id: b047-charge-gauge
task_type: bug_fix
task: >-
  charge_percent converts a raw pack reading in millivolts into the whole
  percentage a battery gauge shows, and it does so wrongly on two fronts:
  the fraction is truncated instead of rounded, so a reading sitting
  halfway between two percentages drops to the lower one, and a reading
  outside the calibrated range runs straight off the scale, reporting a
  negative percentage below the empty bound and beyond 100 above the full
  bound. Fix it: the empty bound reads 0, the full bound reads 100, a
  reading at or past either bound clamps to that end, and a reading
  between them maps linearly onto 0 to 100 and rounds half up to a whole
  percent. Also add the missing validation: reject a reading or bound
  that is not an integer, and an empty bound that does not lie below the
  full bound, with an error. band_label is correct and must not change.
  Return the complete fixed file.
target: solution.py
target_content: |
  """Battery gauge readings for a millivolt-calibrated pack."""


  def charge_percent(mv, empty_mv, full_mv):
      return ((mv - empty_mv) * 100) // (full_mv - empty_mv)


  def band_label(percent):
      if isinstance(percent, bool) or not isinstance(percent, int) or not 0 <= percent <= 100:
          raise ValueError("percent must be an integer from 0 to 100")
      if percent < 15:
          return "low"
      return "ok" if percent < 85 else "full"
interface: |-
  def charge_percent(mv: int, empty_mv: int, full_mv: int) -> int
  def band_label(percent: int) -> str
stop_conditions:
  - Whether the calibration bounds may be negative millivolt values is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
