id: b061-ticket-lifecycle
task_type: bug_fix
task: >-
  replay_ticket replays a support ticket's event log and gets the
  lifecycle wrong. A ticket starts in state new. The lawful moves are:
  triage takes a new ticket to triaged, resolve takes a triaged ticket
  to resolved, reopen takes a resolved ticket back to triaged, and
  archive takes a resolved ticket to archived, which is final. The
  replay applies the events in order and returns the final state; an
  empty log leaves the ticket new. The current code sends a reopened
  ticket back to new instead of triaged, and it silently skips an
  event it does not recognise or that its current state does not
  allow. Fix the reopen transition and add the missing validation:
  raise an error for an event name that is not one of the four events,
  and for an event that is not lawful in the ticket's current state.
  Return the complete fixed file.
target: solution.py
target_content: |
  """Replay a support ticket's lifecycle and report its final state."""

  TRANSITIONS = {
      "new": {"triage": "triaged"},
      "triaged": {"resolve": "resolved"},
      "resolved": {"reopen": "new", "archive": "archived"},
      "archived": {},
  }


  def replay_ticket(events: list) -> str:
      state = "new"
      for event in events:
          next_state = TRANSITIONS[state].get(event)
          if next_state is not None:
              state = next_state
      return state
interface: "def replay_ticket(events: list) -> str"
stop_conditions:
  - Whether an event log entry that is not a string is treated as unknown is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
