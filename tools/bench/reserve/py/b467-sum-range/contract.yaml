id: b467-sum-range
task_type: function_implementation
task: >-
  Implement sum_range. Return the total of every whole number from a
  first up to and including a second. A first standing above the
  second totals nothing, and the two being the same totals that one
  number.
target: solution.py
interface: "def sum_range(first: int, last: int) -> int"
stop_conditions:
  - Whether numbers below nothing should be totalled in the same way is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
