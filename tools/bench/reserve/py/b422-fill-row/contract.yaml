id: b422-fill-row
task_type: bug_fix
task: >-
  blank_row returns a row of a stated width holding nothing but zeros.
  fill_rows returns a grid of a stated number of such rows, and it
  hands back the same row over and over so writing into one writes
  into all. Fix fill_rows. A width below nothing is rejected with an
  error. Return the complete fixed file.
target: solution.py
target_content: |
  def blank_row(width: int) -> list:
      if width < 0:
          raise ValueError("a width cannot be below nothing")
      return [0] * width


  def fill_rows(rows: int, width: int) -> list:
      """A grid of blank rows, each one its own row."""
      shared = blank_row(width)
      return [shared for _ in range(rows)]
interface: "def blank_row(width: int) -> list
def fill_rows(rows: int, width: int) -> list"
stop_conditions:
  - Whether a grid of no rows should still check the width is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
