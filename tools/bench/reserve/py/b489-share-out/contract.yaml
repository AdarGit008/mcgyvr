id: b489-share-out
task_type: function_implementation
task: >-
  Implement share_out. Break a whole amount into a given number of
  parts, as near to even as they go. Where something is left over, it
  is handed one apiece to the parts standing earliest. Reject a count
  of parts below one with an error.
target: solution.py
interface: "def share_out(amount: int, parts: int) -> list[int]"
stop_conditions:
  - Whether an amount below nothing should be broken up at all is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
