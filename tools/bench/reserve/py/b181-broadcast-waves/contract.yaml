id: b181-broadcast-waves
task_type: function_implementation
task: >-
  Implement broadcast_waves. A newsroom relays a bulletin through desks: each
  link string names one hop as sender>receiver, and start names the desk the
  bulletin leaves from. Report how the bulletin spreads, one wave per hop.
  The first wave holds start alone; each later wave holds every desk reached
  by a link from a desk in the wave just before it that no earlier wave
  already held, sorted alphabetically. Desks the bulletin never reaches do
  not appear, and links pointing back into an earlier wave add nothing.
  Render each wave as its desks joined by ", " and join the waves with
  newlines. Reject a link that is not two non-empty desk names around a
  single ">" with an error.
target: solution.py
target_content: |
  def broadcast_waves(links, start):
      """Report a bulletin's spread through the desks, one wave per hop."""
      onward = {}
      for link in links:
          parts = link.split(">")
          if len(parts) != 2 or parts[0] == "" or parts[1] == "":
              raise ValueError("a link must be written sender>receiver")
          onward.setdefault(parts[0], []).append(parts[1])
      lines = []
      # TODO: step outward from start one hop at a time, sorting each new wave.
      return "\n".join(lines)
interface: "def broadcast_waves(links: list, start: str) -> str"
stop_conditions:
  - Whether a desk may appear twice inside a single wave's link list is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
