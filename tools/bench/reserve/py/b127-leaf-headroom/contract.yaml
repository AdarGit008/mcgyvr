id: b127-leaf-headroom
task_type: function_implementation
task: >-
  Implement leaf_headroom. A shared request allowance is carved into a tree
  of quota groups. Every node carries limit, a non-negative integer of
  request units; a node with a children field is a group, children mapping
  child names to nodes, and a node without children is a leaf carrying used,
  the units it has already burned; the root is always a group. Each node
  from the root down to a leaf constrains that leaf: the node's limit minus
  the units burned across the node's whole subtree, a leaf's own burn being
  its used. A leaf's headroom is the smallest of those slacks, floored at
  zero when some enclosure is overspent. Return a flat mapping from each
  leaf's path — the child names from the root down, joined with slashes —
  to its headroom; a group with no children contributes no leaves. Reject a
  root that is not a group, a node that is not a plain object, a limit that
  is not a non-negative integer, a group that carries used, a children field
  that is not a mapping of names to nodes, a leaf whose used is missing or
  not a non-negative integer, an empty child name, and a child name holding
  a slash, with an error.
target: solution.py
interface: "def leaf_headroom(tree: dict) -> dict"
stop_conditions:
  - Whether extra fields on a node beyond limit, children and used are tolerated is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
