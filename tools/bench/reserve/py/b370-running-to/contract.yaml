id: b370-running-to
task_type: bug_fix
task: >-
  running_to returns the total of the entries up to and including a
  stated position, and it stops one entry short. Fix it. A position
  past the end totals everything there is, and a position below zero
  totals nothing. Return the complete fixed file.
target: solution.py
target_content: |
  def running_to(values: list, upto: int) -> int:
      """The total of the entries up to and including a position."""
      if upto < 0:
          return 0
      total = 0
      for value in values[:upto]:
          total += value
      return total
interface: "def running_to(values: list, upto: int) -> int"
stop_conditions:
  - Whether the position should count from one instead of zero is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
