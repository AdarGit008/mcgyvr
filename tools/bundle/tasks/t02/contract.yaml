id: t02-merge-intervals
task_type: function_implementation
task: >-
  Implement mergeIntervals. Given a list of [start, end] pairs, return the
  smallest list of non-overlapping pairs covering the same points, sorted
  ascending by start. Intervals that merely touch (end === next start) do
  merge. The function must be pure - it must not mutate the argument array
  nor any of the inner arrays it was given, and every returned pair must be
  a fresh array. Throw an Error for a pair whose start is greater than its
  end.
target: solution.ts
interface: "export function mergeIntervals(intervals: number[][]): number[][]"
stop_conditions:
  - Whether an interval may be open-ended is not stated.
acceptance: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
