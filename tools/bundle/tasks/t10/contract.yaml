id: t10-binary-search-bounds
task_type: bug_fix
task: |
  binarySearch never finds a value in the last position: the search window
  excludes its upper bound. Fix the bounds so every present value is found
  and -1 is returned for an absent one. The array is sorted ascending.
  Return the complete fixed file.
target: solution.ts
target_content: |
  /** The index of target in a sorted array, or -1. */
  export function binarySearch(items: readonly number[], target: number): number {
    let low = 0;
    let high = items.length - 1;
    while (low < high) {
      const mid = Math.floor((low + high) / 2);
      if (items[mid] === target) {
        return mid;
      }
      if (items[mid] < target) {
        low = mid + 1;
      } else {
        high = mid - 1;
      }
    }
    return -1;
  }
interface: "export function binarySearch(items: readonly number[], target: number): number"
stop_conditions:
  - Which index to return when the array holds duplicates is not stated.
acceptance: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
