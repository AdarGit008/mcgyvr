id: t05-chunk
task_type: function_implementation
task: >-
  Implement chunk. Split an array into consecutive groups of at most size
  elements, preserving order; the final group is shorter when the length
  does not divide evenly. An empty array yields an empty array. The input
  array must not be mutated. Throw an Error unless size is a positive
  integer.
target: solution.ts
interface: "export function chunk<T>(items: readonly T[], size: number): T[][]"
stop_conditions:
  - Whether a size larger than the array is an error or one group is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
