id: t20-read-config
task_type: bug_fix
task: |
  Implement read_config, which parses KEY=VALUE lines and strips whitespace
  around both the key and the value. Blank lines are skipped, and so are
  lines whose first non-space character is '#'. Split on the FIRST '=' only,
  because a value may contain '='. An empty value is allowed, so "KEY="
  yields the empty string, but an empty key raises ValueError, and so does a
  non-comment line with no '=' in it. A later duplicate key overrides an
  earlier one.
target: solution.py
interface: "def read_config(text: str) -> dict[str, str]"
stop_conditions:
  - Whether a '#' appearing after a value begins starts a comment is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
