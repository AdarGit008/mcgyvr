id: t11-mutable-default-argument
task_type: bug_fix
task: |
  tag_item uses a mutable default argument, so calls that rely on the
  default share one list: tag_item("a") returns ["a"] and then tag_item("b")
  returns ["a","b"] instead of ["b"]. Fix it so those calls are independent.
  When a list IS passed, keep appending to it in place and returning that
  same list. Return the complete fixed file.
target: solution.py
target_content: |
  def tag_item(name, tags=[]):
      tags.append(name)
      return tags
interface: "def tag_item(name: str, tags: list[str] | None = None) -> list[str]"
stop_conditions:
  - Whether a name already present should be appended again is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
