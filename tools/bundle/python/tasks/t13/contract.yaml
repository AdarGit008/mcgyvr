id: t13-reverse-words-drops-one
task_type: bug_fix
task: |
  reverse_words drops a word: its loop stops before index 0, so "a b c"
  becomes "c b" instead of "c b a". Fix it. Words are separated by single
  spaces, and the empty string maps to the empty string. Return the complete
  fixed file.
target: solution.py
target_content: |
  def reverse_words(sentence):
      words = sentence.split(" ")
      out = []
      for i in range(len(words) - 1, 0, -1):
          out.append(words[i])
      return " ".join(out)
interface: "def reverse_words(sentence: str) -> str"
stop_conditions:
  - How runs of several spaces should be treated is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
