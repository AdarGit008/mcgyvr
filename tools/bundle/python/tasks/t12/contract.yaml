id: t12-mutate-dict-while-iterating
task_type: bug_fix
task: |
  drop_small raises RuntimeError, because it deletes from the dict it is
  iterating over. Fix it. It must delete in place and return the SAME dict
  object — callers rely on identity, so rebuilding a new dict is wrong, and
  the acceptance script checks. Return the complete fixed file.
target: solution.py
target_content: |
  def drop_small(counts, threshold):
      for key in counts:
          if counts[key] < threshold:
              del counts[key]
      return counts
interface: "def drop_small(counts: dict[str, int], threshold: int) -> dict[str, int]"
stop_conditions:
  - Whether a count exactly equal to the threshold should be dropped is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
