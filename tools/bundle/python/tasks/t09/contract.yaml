id: t09-factorial-base-case
task_type: bug_fix
task: |
  factorial recurses past zero because its base case only stops at 0 by
  returning 0, which makes every result zero. Fix it so factorial(0) is 1
  and factorial(5) is 120, and raise ValueError for a negative n. Keep it
  recursive or make it iterative, whichever you prefer. Return the complete
  fixed file.
target: solution.py
target_content: |
  def factorial(n):
      if n == 0:
          return 0
      return n * factorial(n - 1)
interface: "def factorial(n: int) -> int"
stop_conditions:
  - The largest n that must be supported is not stated.
demonstration: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
