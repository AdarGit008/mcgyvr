id: t19-safe-divide
task_type: bug_fix
task: |
  Implement safe_divide, which returns a divided by b as a float. A divisor
  of zero — int or float — returns None rather than raising. A non-numeric a
  or b (str, None, list, and so on) raises TypeError. A bool is NOT accepted
  as numeric here even though Python will divide by True quite happily:
  raise TypeError for it.
target: solution.py
interface: "def safe_divide(a, b) -> float | None"
stop_conditions:
  - Whether a Decimal or Fraction argument counts as numeric is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
