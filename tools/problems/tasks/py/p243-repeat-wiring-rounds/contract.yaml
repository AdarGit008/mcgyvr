id: p243-repeat-wiring-rounds
task_type: bug_fix
task: >-
  apply_cycle_power replays a patch panel. The panel is a list of whole
  numbers; the number parked at slot i says which slot the plug in slot i is
  moved to when the panel is replayed once. Every slot from zero up to one
  below the list length shows up exactly once. Replaying the panel a stated
  number of rounds gives another panel of the same shape, and the code
  computes it the quick way: it gathers the slots into rings by following
  the moves round until they come back, then slides each ring forward by the
  number of rounds. The slide is wrong. It reduces the round count against
  the number of slots on the whole panel instead of against the number of
  slots on the ring being slid, so any panel whose rings are not all of one
  length lands its plugs somewhere else entirely once the round count
  reaches the panel size. Reduce each ring's slide against that ring's own
  length. Leave the ring gathering, the zero-round case and the rejections
  alone: a panel that is not a list, an empty panel, an entry that is not a
  whole number, an entry naming a slot the panel does not have, a slot named
  twice, and a round count that is not a whole number of zero or more all
  keep raising an error. Return the complete fixed file.
target: solution.py
target_content: |
  def apply_cycle_power(panel: list[int], rounds: int) -> list[int]:
      if not isinstance(panel, list) or not panel:
          raise ValueError("the panel must be a non-empty list")
      if not isinstance(rounds, int) or isinstance(rounds, bool) or rounds < 0:
          raise ValueError("rounds must be a whole number of zero or more")
      size = len(panel)
      named = set()
      for entry in panel:
          if not isinstance(entry, int) or isinstance(entry, bool):
              raise ValueError("every entry must be a whole number")
          if entry < 0 or entry >= size:
              raise ValueError("entry names a slot the panel does not have")
          if entry in named:
              raise ValueError("a slot is named twice")
          named.add(entry)
      slide = rounds % size
      settled = [False] * size
      moved = [0] * size
      for start in range(size):
          if settled[start]:
              continue
          ring = []
          at = start
          while not settled[at]:
              settled[at] = True
              ring.append(at)
              at = panel[at]
          for i in range(len(ring)):
              moved[ring[i]] = ring[(i + slide) % len(ring)]
      return moved
interface: "def apply_cycle_power(panel: list[int], rounds: int) -> list[int]"
stop_conditions:
  - Whether a negative round count should mean replaying the panel backwards is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
