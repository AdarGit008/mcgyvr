id: p477-tighten-note-phrases
task_type: bug_fix
task: >-
  tighten_note_phrases rewrites a note in a ward's own contractions and gets
  the matching wrong. The first argument is the text, a string. The second is
  the book, a mapping whose every key is a phrase of one or more lowercase
  words parted by single spaces, and whose every value is the contraction to
  write in that phrase's place, a non-empty string of lowercase letters and
  digits beginning with a letter. Read the text from the left. At each
  character take the longest phrase in the book that matches from there,
  comparing blind to case, and only when the run it covers is bounded on both
  sides by something other than a letter or a digit, the ends of the text
  counting as bounds; write the contraction in that run's place and carry on
  from just past it. Where the run opens with a capital letter the contraction
  is written with its own opening character raised, and otherwise exactly as
  the book writes it. A contraction once written is never read again. Give back
  the shortened text. The code below tries the phrases in the order the book
  lists them rather than longest first, and will match a phrase buried in the
  middle of a longer word instead of only where letters and digits stop. Repair
  both, keep raising an error for a text that is not a string, a book that is
  not a mapping, a key that is not one or more lowercase words parted by single
  spaces, and a value that is not a non-empty string of lowercase letters and
  digits beginning with a letter, and return the complete fixed file.
target: solution.py
target_content: |
  import re

  _KEY = re.compile(r"[a-z]+( [a-z]+)*\Z")
  _VALUE = re.compile(r"[a-z][a-z0-9]*\Z")


  def tighten_note_phrases(text: str, book: dict) -> str:
      if not isinstance(text, str):
          raise ValueError("tighten_note_phrases expects a string of text")
      if not isinstance(book, dict):
          raise ValueError("the book is not a mapping")

      shelf = {}
      for key, value in book.items():
          if not isinstance(key, str) or _KEY.match(key) is None:
              raise ValueError("a key is not lowercase words parted by single spaces")
          if not isinstance(value, str) or _VALUE.match(value) is None:
              raise ValueError(
                  "a value is not a contraction of lowercase letters and digits"
              )
          shelf[key] = value

      phrases = list(book)
      out = []
      at = 0
      while at < len(text):
          hit = None
          for phrase in phrases:
              run = text[at : at + len(phrase)]
              if len(run) == len(phrase) and run.lower() == phrase:
                  hit = run
                  break
          if hit is None:
              out.append(text[at])
              at += 1
              continue
          value = shelf[hit.lower()]
          opener = hit[0]
          out.append(value[0].upper() + value[1:] if opener != opener.lower() else value)
          at += len(hit)
      return "".join(out)
interface: "def tighten_note_phrases(text: str, book: dict) -> str"
stop_conditions:
  - Whether a phrase may be split across a line break in the text is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
