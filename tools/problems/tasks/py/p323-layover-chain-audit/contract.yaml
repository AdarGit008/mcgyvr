id: p323-layover-chain-audit
task_type: bug_fix
task: >-
  check_layovers audits a chain of hops a traveller has already picked out and
  names the first thing wrong with it, but it currently misjudges the awkward
  chains. Fix it. Each hop is a record with ref, board, alight, leaves and
  lands: board and alight name halts, while leaves and lands are whole
  minutes with lands past leaves. A chain is sound when the opening hop
  leaves no sooner than readyAt, when every later hop boards precisely at the
  halt where the hop before it alighted, and when every later hop leaves no
  sooner than the previous hop's landing minute plus layover — a wait of
  exactly layover is enough. Walk the hops in the order given and stop dead
  at the first fault: the opening hop can only be faulted as early, and every
  later hop is faulted as place before it is faulted as tight. Return a
  record with verdict, at and arrive. A sound chain answers with the word
  sound, an at of -1, and arrive holding the last hop's landing minute; a
  faulted chain answers with the fault word early, place or tight, an at
  holding the zero-based position of the offending hop, and an arrive of -1.
  Keep raising an error when the hop list is not a list or holds nothing,
  when a hop is not a record carrying all five names, when a ref or a halt
  name is not a non-empty string, when a hop boards and alights at one halt,
  when leaves or lands is not a whole number, when lands is not past leaves,
  and when layover or readyAt is not a whole number of zero or more. Return
  the complete fixed file.
target: solution.py
target_content: |
  PARTS = ("ref", "board", "alight", "leaves", "lands")


  def _counted(value):
      return isinstance(value, int) and not isinstance(value, bool)


  def _named(value):
      return isinstance(value, str) and value != ""


  def check_layovers(hops, layover, ready_at) -> dict:
      if not isinstance(hops, list) or not hops:
          raise ValueError("the hop list must be a non-empty list")
      if not _counted(layover) or layover < 0:
          raise ValueError("layover must be a whole number of zero or more")
      if not _counted(ready_at) or ready_at < 0:
          raise ValueError("ready_at must be a whole number of zero or more")
      chain = []
      for raw in hops:
          if not isinstance(raw, dict):
              raise ValueError("a hop must be a record")
          for part in PARTS:
              if part not in raw:
                  raise ValueError("a hop is missing " + part)
          if not _named(raw["ref"]):
              raise ValueError("a ref must be a non-empty string")
          if not _named(raw["board"]) or not _named(raw["alight"]):
              raise ValueError("a halt name must be a non-empty string")
          if raw["board"] == raw["alight"]:
              raise ValueError("a hop must not board and alight at one halt")
          if not _counted(raw["leaves"]) or not _counted(raw["lands"]):
              raise ValueError("leaves and lands must be whole numbers")
          if raw["lands"] <= raw["leaves"]:
              raise ValueError("lands must be past leaves")
          chain.append(raw)
      for i in range(1, len(chain)):
          if chain[i]["leaves"] <= chain[i - 1]["lands"] + layover:
              return {"verdict": "tight", "at": i, "arrive": -1}
          if chain[i]["board"] != chain[i - 1]["alight"]:
              return {"verdict": "place", "at": i, "arrive": -1}
      return {"verdict": "sound", "at": -1, "arrive": chain[-1]["lands"]}
interface: "def check_layovers(hops, layover, ready_at) -> dict"
stop_conditions:
  - Whether one halt may be called at twice by a chain is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
