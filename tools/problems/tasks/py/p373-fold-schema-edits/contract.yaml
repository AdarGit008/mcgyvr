id: p373-fold-schema-edits
task_type: bug_fix
task: >-
  fold_schema_edits rewrites the header of a record file. The first argument
  lists the headings the file starts with, non-empty strings none of which
  repeats; the second lists edits worked through in turn, each a mapping whose
  op reads add, drop or rename and whose field names a heading. An add hangs
  the named heading on the end, a drop lifts it out and closes the gap behind
  it, and a rename swaps it for the edit's into while holding its place. Both
  an add and a rename refuse a heading the file already carries, and a drop or
  a rename refuses a heading that is not there. That refusal is tested against
  the wrong thing: the code looks the candidate up in the list it was handed
  rather than in the header as the edits have left it, so a heading freed by an
  earlier drop is turned away although nothing holds it now, and a heading
  brought in by an earlier add is let through a second time, leaving the header
  with a pair of identical entries. Test the candidate against the header as it
  stands. Leave the rest alone: the ordering, the gap closing, a rename holding
  its place, the header being allowed to run empty, and the errors raised for a
  first argument that is not a non-empty list, a heading that is not a
  non-empty string, a repeat among the headings handed in, a second argument
  that is not a list, an edit that is not a mapping, an edit whose field or
  whose into is not a non-empty string, and an op outside the three. Return the
  complete fixed file.
target: solution.py
target_content: |
  def fold_schema_edits(fields: list, edits: list) -> list:
      if not isinstance(fields, list) or len(fields) == 0:
          raise ValueError("the header must be a non-empty list")
      header = []
      for field in fields:
          if not isinstance(field, str) or field == "":
              raise ValueError("every heading must be a non-empty string")
          if field in header:
              raise ValueError("the header repeats " + field)
          header.append(field)
      if not isinstance(edits, list):
          raise ValueError("the edits must be a list")
      for edit in edits:
          if not isinstance(edit, dict):
              raise ValueError("every edit must be a mapping")
          field = edit.get("field")
          if not isinstance(field, str) or field == "":
              raise ValueError("every edit must name a non-empty heading")
          op = edit.get("op")
          if op == "add":
              if field in fields:
                  raise ValueError(field + " is already taken")
              header.append(field)
          elif op == "drop":
              if field not in header:
                  raise ValueError("no heading called " + field)
              header.remove(field)
          elif op == "rename":
              into = edit.get("into")
              if not isinstance(into, str) or into == "":
                  raise ValueError("a rename must give a non-empty into")
              if field not in header:
                  raise ValueError("no heading called " + field)
              if into in fields:
                  raise ValueError(into + " is already taken")
              header[header.index(field)] = into
          else:
              raise ValueError("an op must be add, drop or rename")
      return header
interface: "def fold_schema_edits(fields: list, edits: list) -> list"
stop_conditions:
  - Whether headings should be compared without regard to letter case is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
