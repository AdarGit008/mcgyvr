id: p068-lattice-route-count
task_type: bug_fix
task: >-
  lattice_route_count counts the distinct routes across a rectangular grid
  from its top-left cell to its bottom-right cell, stepping only right or
  down and never onto a cell marked 1. The current code seeds every clear
  cell of the first row and of the first column as reachable in one way,
  including the cells sitting beyond a marked one, so it counts routes that
  would have to leap over an obstacle to exist. Fix the counting so a
  first-row or first-column cell is reachable only through its predecessor;
  keep returning 0 when either corner is marked, keep the single clear cell
  counting 1, and keep rejecting with an error an empty or ragged grid and
  a cell that is not 0 or 1. Return the complete fixed file.
target: solution.py
target_content: |
  def lattice_route_count(grid):
      if not isinstance(grid, list) or not grid:
          raise ValueError("grid must be a non-empty list of rows")
      cols = len(grid[0]) if isinstance(grid[0], list) else 0
      for row in grid:
          if not isinstance(row, list) or len(row) != cols or cols == 0:
              raise ValueError("grid rows must be equal-length non-empty lists")
          for cell in row:
              if isinstance(cell, bool) or cell not in (0, 1):
                  raise ValueError("cells must be 0 or 1")
      rows = len(grid)
      if grid[0][0] == 1 or grid[rows - 1][cols - 1] == 1:
          return 0
      routes = [[0] * cols for _ in range(rows)]
      for c in range(cols):
          routes[0][c] = 1 if grid[0][c] == 0 else 0
      for r in range(rows):
          routes[r][0] = 1 if grid[r][0] == 0 else 0
      for r in range(1, rows):
          for c in range(1, cols):
              if grid[r][c] == 1:
                  routes[r][c] = 0
              else:
                  routes[r][c] = routes[r - 1][c] + routes[r][c - 1]
      return routes[rows - 1][cols - 1]
interface: "def lattice_route_count(grid: list) -> int"
stop_conditions:
  - Whether counts may exceed the exact integer range on very large grids is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
