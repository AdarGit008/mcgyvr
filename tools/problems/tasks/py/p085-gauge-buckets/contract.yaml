id: p085-gauge-buckets
task_type: bug_fix
task: >-
  gauge_buckets tallies pulses into equal-width pockets and mis-bins exactly
  the awkward ones. Fix it: the arguments are a list of integer pulses, an
  integer base, a positive width and a positive pocket count, and pocket i
  spans base + i*width up to but not including base + (i+1)*width. Return
  count + 2 tallies as one flat list: first the number of pulses under the
  base, then each pocket in order, and last the number of pulses at or
  past the top of the final pocket. A pulse sitting exactly on the edge
  two pockets share belongs to the higher pocket, and nothing is silently
  dropped: every pulse lands in exactly one tally.
target: solution.py
target_content: |
  def gauge_buckets(pulses, base, width, pockets):
      tallies = [0] * (pockets + 2)
      for pulse in pulses:
          if pulse < base:
              continue
          slot = round((pulse - base) / width)
          if slot >= pockets:
              slot = pockets - 1
          tallies[1 + slot] += 1
      return tallies
interface: "def gauge_buckets(pulses: list, base: int, width: int, pockets: int) -> list"
stop_conditions:
  - Whether width and the pocket count have an upper bound is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
