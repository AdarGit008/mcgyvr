id: p317-pack-clue-line
task_type: bug_fix
task: >-
  pack_clue_line draws a clue's groups crowded as far to the left as they will
  go, and it forgets that neighbouring groups are never allowed to touch. Fix
  it. Build a string of the given width in which the first clue becomes that
  many # characters starting at the very left edge, each later clue becomes
  its own group of # characters set down after exactly one dot separating it
  from the group before, and every position still left over on the right holds
  a dot. An empty clue list draws a width of nothing but dots. Also add
  checking: a width that is not a whole number above zero, a clue that is not
  a whole number above zero, a clue list that is not a list, and a clue list
  whose groups and separators together outgrow the width are each an error.
  Return the complete fixed file.
target: solution.py
target_content: |
  """The clue's groups crowded as far to the left as they will go."""


  def pack_clue_line(width, clues):
      line = ""
      for clue in clues:
          line += "#" * clue
      while len(line) < width:
          line += "."
      return line
interface: "def pack_clue_line(width: int, clues: list) -> str"
stop_conditions:
  - Whether a drawing that exactly fills the width should still end with a dot is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
