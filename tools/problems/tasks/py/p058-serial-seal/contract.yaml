id: p058-serial-seal
task_type: function_implementation
task: >-
  Implement seal_serial. A serial is a string of exactly eight decimal
  digits. Its seal is computed under the SR-11 scheme: multiply each digit,
  left to right, by the repeating weight cycle 3, 7, 1, 3, 7, 1, 3, 7; sum
  the eight products; take the remainder of that sum modulo eleven. A
  remainder of ten seals as the letter K; any other remainder seals as its
  own digit character. Return the nine-character string consisting of the
  serial followed by its seal character. Raise an error for a non-string
  argument and for any input that is not exactly eight characters 0 to 9.
target: solution.py
interface: "def seal_serial(serial: str) -> str"
stop_conditions:
  - Whether the weight cycle ever changes per batch of serials is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
