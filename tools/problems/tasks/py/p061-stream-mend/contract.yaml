id: p061-stream-mend
task_type: bug_fix
task: >-
  Fix reassemble_stream. The first argument is the exact length of the
  original message; the second is a list of fragments, each a pair of a
  character offset and a piece of text, delivered in arbitrary order.
  Fragments may duplicate one another and may overlap, and wherever two
  fragments cover the same position they must carry the same character.
  Rebuilding requires every position of the message to be covered by at
  least one fragment and every fragment to lie entirely within the declared
  length; disagreement on a shared position, an uncovered position, a
  negative offset, or a fragment running past the end is an error. The
  current code merely sorts the fragments by offset and glues their texts
  together, so overlapping or duplicated coverage corrupts honest streams
  and an out-of-place fragment can slip through whenever the glued lengths
  happen to add up. Place characters by their offsets instead. Return the
  complete fixed file.
target: solution.py
target_content: |
  def reassemble_stream(total: int, fragments: list[list]) -> str:
      parts = sorted(fragments, key=lambda fragment: fragment[0])
      message = "".join(fragment[1] for fragment in parts)
      if len(message) != total:
          raise ValueError("incomplete stream")
      return message
interface: "def reassemble_stream(total: int, fragments: list[list]) -> str"
stop_conditions:
  - Whether fragments may arrive after reassembly has already succeeded is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
