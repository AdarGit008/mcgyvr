id: p158-dense-rank-map
task_type: bug_fix
task: >-
  dense_rank_map turns a list of integers into dense ranks, but the current
  code hands back the wrong numbers. Under order "asc" the smallest value
  earns rank 1; under "desc" the largest does. Equal values always share
  one rank, and the next distinct value takes exactly the next rank —
  dense ranking never skips a number however wide a tie is. The result
  reports each element's rank at that element's original position. The
  buggy version looks each value up in a sorted copy, so a tie swallows
  the rank after it, and it fakes descending order by reversing the rank
  list, which shuffles positions instead of flipping the comparison. Fix
  both, and add the missing validation: throw an error when the list is
  empty, when an element is not an integer, and when the order word is
  neither "asc" nor "desc".
target: solution.py
target_content: |
  def dense_rank_map(values, order):
      ordered = sorted(values)
      ranks = [ordered.index(v) + 1 for v in values]
      if order == "desc":
          ranks.reverse()
      return ranks
interface: "def dense_rank_map(values: list, order: str) -> list"
stop_conditions:
  - Whether the input list may be mutated in place is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
