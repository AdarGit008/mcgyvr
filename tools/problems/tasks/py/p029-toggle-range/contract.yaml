id: p029-toggle-range
task_type: bug_fix
task: |
  toggle_range flips one bit too few. The function returns its value
  argument, a non-negative integer below 2**30, with every bit from
  position lo through position hi INCLUSIVE inverted, where positions run
  0 (least significant) through 29. The mask the current code builds stops
  one bit short of hi: inverting positions 0 through 3 of 0 should give 15
  but gives 7, and a single-bit range with lo equal to hi flips nothing at
  all. Fix the mask so the bit at hi is inverted too, and keep the
  existing validation as it is: a lo greater than hi, a position outside
  0..29, a value that is negative or at least 2**30, and a non-integer
  argument are rejected with an error. Return the complete fixed file.
target: solution.py
target_content: |
  def toggle_range(value: int, lo: int, hi: int) -> int:
      for argument in (value, lo, hi):
          if not isinstance(argument, int) or isinstance(argument, bool):
              raise ValueError("toggle_range expects integer arguments")
      if value < 0 or value >= 2**30:
          raise ValueError("value must be within 0..2**30-1")
      if lo < 0 or hi > 29:
          raise ValueError("bit positions must be within 0..29")
      if lo > hi:
          raise ValueError("lo must not exceed hi")
      mask = ((1 << (hi - lo)) - 1) << lo
      return value ^ mask
interface: "def toggle_range(value: int, lo: int, hi: int) -> int"
stop_conditions:
  - Whether the valid position range could ever widen past bit 29 is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
