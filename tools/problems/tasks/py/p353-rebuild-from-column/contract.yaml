id: p353-rebuild-from-column
task_type: bug_fix
task: >-
  rebuild_from_last_column undoes a block-sorting fold, and it goes wrong
  the moment a letter shows up more than once. Repair it. The fold being
  undone worked this way: a text of one or more lowercase letters was spun
  into as many spins as it has letters, spin k opening at place k and
  running on through the front; the spins were laid out in dictionary
  order; the closing letter of each spin, read down that layout, formed the
  column string, and the seat the unspun text took in the layout became the
  home number. Given the column and the home, hand back the text that was
  spun. What is broken is the pairing of equal letters: when two seats of
  the layout open on the very same letter, the earlier seat is the one
  whose letter sits earlier in the column, and the code pairs them back to
  front, so a text with a repeated letter returns scrambled — the column
  "nnbaaa" with home 3 must rebuild "banana" and instead rebuilds "bababa".
  Leave everything else where it is: the errors thrown for a column that is
  not a string, an empty column, a column holding anything but lowercase
  letters, a home that is not a whole number, and a home outside the run
  from zero up to one below the column's length. Return the complete fixed
  file.
target: solution.py
target_content: |
  def rebuild_from_last_column(column, home):
      if not isinstance(column, str):
          raise ValueError("the column must be a string")
      if len(column) == 0:
          raise ValueError("the column must not be empty")
      for letter in column:
          if not ("a" <= letter <= "z"):
              raise ValueError("the column holds a letter outside a to z")
      if not isinstance(home, int) or isinstance(home, bool):
          raise ValueError("the home must be a whole number")
      if home < 0 or home >= len(column):
          raise ValueError("the home is outside the column")
      width = len(column)
      seats = sorted(range(width), key=lambda place: (column[place], -place))
      seat = home
      pieces = []
      for _step in range(width):
          seat = seats[seat]
          pieces.append(column[seat])
      return "".join(pieces)
interface: "def rebuild_from_last_column(column: str, home: int) -> str"
stop_conditions:
  - Whether a text built from a shorter block repeated, whose spins are not all different, can arrive is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
