id: p047-render-data-size
task_type: bug_fix
task: >-
  render_data_size turns a byte count into a human-readable compound like
  "3GiB 2KiB", but the current code was written for decimal prefixes and
  pads its output with noise. Fix it: the binary ladder applies, 1KiB is
  1024 bytes, 1MiB is 1024 KiB, 1GiB is 1024 MiB. Decompose the count
  greedily from GiB down, write each nonzero component as its number glued
  to its suffix, and join the written components with single spaces —
  components that are zero are simply absent. A count of zero renders as
  "0B". Reject a negative count and a count that is not an integer with an
  error. Return the rendered string.
target: solution.py
target_content: |
  def render_data_size(total: int) -> str:
      ladder = [("GiB", 1000000000), ("MiB", 1000000), ("KiB", 1000), ("B", 1)]
      parts = []
      rest = total
      for suffix, size in ladder:
          count = rest // size
          parts.append(f"{count}{suffix}")
          rest -= count * size
      return " ".join(parts)
interface: "def render_data_size(total: int) -> str"
stop_conditions:
  - Whether counts of a whole TiB or more need their own suffix is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
