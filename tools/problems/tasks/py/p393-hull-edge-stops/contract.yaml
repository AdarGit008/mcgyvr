id: p393-hull-edge-stops
task_type: bug_fix
task: >-
  hull_edge_stops is meant to tally the grid points a fence touches. The fence
  is the tightest convex ring drawn around a bunch of pegs, each peg a pair
  holding an x then a y, both whole numbers; pegs may repeat and a peg that
  falls inside the ring or flat along one of its sides changes nothing.
  Walking the ring once, tally every distinct grid point standing on it, the
  turning posts included and none tallied twice. The present code adds each
  side's steps and then one more for that side's far post, so every turning
  post is tallied a second time; it also hands back nothing whenever the pegs
  turn out to lie along a single straight run or upon one single spot, which
  are two shapes it is still supposed to answer for. Put both right: a ring
  flattened to a straight run touches the grid points strung along that run
  from one far end to the other, each counted once, and a ring flattened to
  one spot touches exactly one. Keep raising an error for an argument that is
  not a list, for a list holding nothing, for a peg that is not a pair of
  exactly two whole numbers, and for a coordinate whose magnitude passes one
  million. Return the complete fixed file.
target: solution.py
target_content: |
  def _whole(value) -> bool:
      return isinstance(value, int) and not isinstance(value, bool)


  def _rungs(a: int, b: int) -> int:
      x, y = abs(a), abs(b)
      while y != 0:
          x, y = y, x % y
      return x


  def hull_edge_stops(pegs: list) -> int:
      if not isinstance(pegs, list) or not pegs:
          raise ValueError("hull_edge_stops expects a non-empty list of pegs")
      points = []
      for peg in pegs:
          if (
              not isinstance(peg, list)
              or len(peg) != 2
              or not _whole(peg[0])
              or not _whole(peg[1])
          ):
              raise ValueError("a peg must be a pair of two whole numbers")
          if abs(peg[0]) > 1000000 or abs(peg[1]) > 1000000:
              raise ValueError("a coordinate magnitude passes one million")
          points.append([peg[0], peg[1]])
      points.sort()
      spots = []
      for point in points:
          if not spots or spots[-1] != point:
              spots.append(point)

      def turn(o, a, b):
          return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])

      def chain_of(order):
          chain = []
          for point in order:
              while len(chain) >= 2 and turn(chain[-2], chain[-1], point) <= 0:
                  chain.pop()
              chain.append(point)
          return chain

      if len(spots) == 1:
          posts = [spots[0]]
      else:
          posts = chain_of(spots)[:-1] + chain_of(list(reversed(spots)))[:-1]

      if len(posts) < 3:
          return 0
      stops = 0
      for index, here in enumerate(posts):
          following = posts[(index + 1) % len(posts)]
          stops += _rungs(following[0] - here[0], following[1] - here[1]) + 1
      return stops
interface: "def hull_edge_stops(pegs: list) -> int"
stop_conditions:
  - Whether the grid points strictly inside the ring are wanted alongside the tally is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
