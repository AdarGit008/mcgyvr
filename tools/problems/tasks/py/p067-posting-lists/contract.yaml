id: p067-posting-lists
task_type: function_implementation
task: >-
  Implement posting_lists. Given the documents of a tiny search engine as a
  list of strings, build the inverted index: a mapping from each indexed
  term to the ascending list of distinct document positions (0-based
  indices into the input) whose text contains that term. Terms are maximal
  runs of ASCII letters and digits, lowercased before indexing; a term made
  only of digits is not indexed, and neither is a term of a single
  character. However many times one document repeats a term, the document
  appears once in that term's list. Reject with an error an input that is
  not a list and any document that is not a string.
target: solution.py
interface: "def posting_lists(documents: list) -> dict"
stop_conditions:
  - Whether the index should also record how often a term occurs is not stated.
acceptance: ["python accept.py"]
risk: low
scope:
  allow: ["solution.py"]
