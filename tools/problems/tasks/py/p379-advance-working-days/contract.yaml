id: p379-advance-working-days
task_type: bug_fix
task: >-
  advance_working_days walks a diary forward or back by a number of working
  days. The first argument is the day to set off from, a zero-padded
  YYYY-MM-DD string in the years 1900 through 2999; the second is how many
  working days to move, a whole number no further from nought than five
  thousand; the third lists further days the diary is shut, written the same
  way, on top of Saturday and Sunday, which are always shut. Moving forward
  means stepping one calendar day at a time from the day set off from, striking
  one off the tally each time a working day is stepped onto, and halting the
  moment the tally runs out; moving back does the same in the other direction.
  The day set off from is never itself struck off, whether it works or not. A
  move of nought is the special case: it goes nowhere, but it does roll the day
  set off from forward to the first working day at or after it, and that is
  what the code gets wrong -- it hands the day set off from straight back, so a
  Saturday, a Sunday or a shut day asked for with nought is reported as though
  the diary were open. Roll it forward instead. Leave the rest where it stands:
  the stepping in both directions, the tally never taking the starting day in,
  the zero-padded YYYY-MM-DD answer, the calendar worked from the digits with
  nothing borrowed from a built-in date facility, and the errors raised for a
  starting day or a shut day that is not a well-formed date naming a real month
  and a day existing in it inside those years, a shut day named twice, a move
  that is not a whole number or reaches beyond five thousand, and a walk that
  would leave the years 1900 through 2999.
target: solution.py
target_content: |
  import re

  LENGTHS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
  SHAPE = re.compile(r"\d{4}-\d{2}-\d{2}")
  MOVE_CAP = 5000


  def _leaps(year):
      return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


  def _stamp_of(year, month, day):
      shifted = year - 1 if month <= 2 else year
      era = shifted // 400
      year_of_era = shifted - era * 400
      day_of_year = (153 * (month + (-3 if month > 2 else 9)) + 2) // 5 + day - 1
      day_of_era = year_of_era * 365 + year_of_era // 4 - year_of_era // 100 + day_of_year
      return era * 146097 + day_of_era - 719468


  def _spell(stamp):
      shifted = stamp + 719468
      era = shifted // 146097
      day_of_era = shifted - era * 146097
      year_of_era = (
          day_of_era - day_of_era // 1460 + day_of_era // 36524 - day_of_era // 146096
      ) // 365
      year = year_of_era + era * 400
      day_of_year = day_of_era - (365 * year_of_era + year_of_era // 4 - year_of_era // 100)
      marker = (5 * day_of_year + 2) // 153
      day = day_of_year - (153 * marker + 2) // 5 + 1
      month = marker + 3 if marker < 10 else marker - 9
      if month <= 2:
          year += 1
      return "{:04d}-{:02d}-{:02d}".format(year, month, day)


  def _read_date(text):
      if not isinstance(text, str) or SHAPE.fullmatch(text) is None:
          raise ValueError("a date must read YYYY-MM-DD")
      year = int(text[0:4])
      month = int(text[5:7])
      day = int(text[8:10])
      if year < 1900 or year > 2999:
          raise ValueError("the year must lie between 1900 and 2999")
      if month < 1 or month > 12:
          raise ValueError("the month must lie between 01 and 12")
      held = 29 if month == 2 and _leaps(year) else LENGTHS[month - 1]
      if day < 1 or day > held:
          raise ValueError("the day does not exist in its month")
      return _stamp_of(year, month, day)


  LOW = _stamp_of(1900, 1, 1)
  HIGH = _stamp_of(2999, 12, 31)


  def _within(stamp):
      if stamp < LOW or stamp > HIGH:
          raise ValueError("the walk leaves the years 1900 through 2999")
      return stamp


  def advance_working_days(start: str, count: int, closures: list) -> str:
      stamp = _read_date(start)
      if not isinstance(count, int) or isinstance(count, bool):
          raise ValueError("the move must be a whole number")
      if count < -MOVE_CAP or count > MOVE_CAP:
          raise ValueError("the move may not pass " + str(MOVE_CAP) + " either way")
      if not isinstance(closures, list):
          raise ValueError("the shut days must be a list")
      shut = set()
      for closure in closures:
          marked = _read_date(closure)
          if marked in shut:
              raise ValueError("a shut day is named twice")
          shut.add(marked)

      def works(at):
          return (at + 3) % 7 < 5 and at not in shut

      if count == 0:
          return start
      step = 1 if count > 0 else -1
      left = abs(count)
      while left > 0:
          stamp = _within(stamp + step)
          if works(stamp):
              left -= 1
      return _spell(stamp)
interface: "def advance_working_days(start: str, count: int, closures: list) -> str"
stop_conditions:
  - Whether a shut day falling on a Saturday or a Sunday is worth refusing is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
