id: p473-audit-tour-card
task_type: bug_fix
task: >-
  audit_tour_card checks a warden's route card against the floor plan and gets
  the walking wrong. The first argument is the rooms, a list of mappings in
  floor-plan order, each carrying exactly the four keys room (a non-empty
  string, no two alike), hop (a whole number at nought or above, being the
  minutes from the doorway before it, or from the foyer for the very first),
  dwell (a whole number above nought) and merit (a whole number at nought or
  above). The second argument is the card, a list of room names the warden has
  written down. The third is the allowance, a whole number of minutes at nought
  or above. A card can be read only when every name on it belongs to a room on
  the floor, no name appears twice, and the names run in floor-plan order. The
  minutes a card costs are the hop of every room from the first through the
  last room named on the card, whether named or only walked past, plus the
  dwell of each named room; an empty card costs nought minutes. Give back a
  mapping whose minutes is that cost, whose merit adds up the merit of the
  named rooms, whose spare is the allowance less the minutes and may fall below
  nought, and whose ok says whether the minutes sit within the allowance, an
  exact spend counting as within. The code below adds up the hop of every room
  on the floor rather than stopping at the last room named on the card, and
  calls an exact spend an overrun. Repair both, keep raising an error for a
  rooms argument that is not a list, a room that is not a mapping, a room whose
  keys are not exactly the four named, a room name that is not a non-empty
  string or is repeated on the floor, a hop that is not whole or falls below
  nought, a dwell that is not whole or falls below one, a merit that is not
  whole or falls below nought, an allowance that is not whole or falls below
  nought, a card that is not a list, a card entry that is not a string or names
  no room, and a card whose names repeat or fall out of floor-plan order, and
  return the complete fixed file.
target: solution.py
target_content: |
  def _whole(value):
      return isinstance(value, int) and not isinstance(value, bool)


  def audit_tour_card(rooms: list, card: list, allowance: int) -> dict:
      if not isinstance(rooms, list):
          raise ValueError("audit_tour_card expects a list of rooms")
      if not isinstance(card, list):
          raise ValueError("the card is not a list")
      if not _whole(allowance) or allowance < 0:
          raise ValueError("the allowance is not whole or falls below nought")

      floor = []
      where = {}
      for entry in rooms:
          if not isinstance(entry, dict):
              raise ValueError("a room is not a mapping")
          if sorted(entry) != ["dwell", "hop", "merit", "room"]:
              raise ValueError("a room's keys are not exactly the four named")
          name = entry["room"]
          if not isinstance(name, str) or name == "":
              raise ValueError("a room name is not a non-empty string")
          if name in where:
              raise ValueError("a room name is repeated on the floor")
          hop = entry["hop"]
          if not _whole(hop) or hop < 0:
              raise ValueError("a hop is not whole or falls below nought")
          dwell = entry["dwell"]
          if not _whole(dwell) or dwell < 1:
              raise ValueError("a dwell is not whole or falls below one")
          merit = entry["merit"]
          if not _whole(merit) or merit < 0:
              raise ValueError("a merit is not whole or falls below nought")
          where[name] = len(floor)
          floor.append({"room": name, "hop": hop, "dwell": dwell, "merit": merit})

      last = -1
      dwelt = 0
      merit = 0
      for name in card:
          if not isinstance(name, str):
              raise ValueError("a card entry is not a string")
          if name not in where:
              raise ValueError("a card entry names no room on the floor")
          seat = where[name]
          if seat <= last:
              raise ValueError("a card repeats a name or falls out of floor-plan order")
          last = seat
          dwelt += floor[seat]["dwell"]
          merit += floor[seat]["merit"]

      walked = sum(room["hop"] for room in floor)

      minutes = walked + dwelt
      return {
          "minutes": minutes,
          "merit": merit,
          "spare": allowance - minutes,
          "ok": minutes < allowance,
      }
interface: "def audit_tour_card(rooms: list, card: list, allowance: int) -> dict"
stop_conditions:
  - Whether the foyer itself may appear on the card is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
