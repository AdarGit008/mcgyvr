id: p503-judge-vane-trick
task_type: bug_fix
task: >-
  judge_vane_trick settles one trick of Vane, a four-handed pastime made up for
  this exercise and governed by nothing but the paragraph below. A card is a
  heat from 2 to 9 written first and then a plume letter — k for kelp, n for
  nettle, p for pith, t for thorn — so "5k" and "9t" are cards. The argument
  is a mapping with "trump" (a plume letter or the word "bare"), "lead" (the
  seat from 0 to 3 that laid the opening card), "holdings" (a list of exactly
  four non-empty lists, holdings[s] being every card seat s was sitting on
  before the trick, no card repeated within a holding and no card sitting in
  two holdings at once) and "played" (a list of exactly four cards in laying
  order, the card at place i having been laid by seat (lead + i) modulo 4, and
  each of them found in the layer's own holding). The plume of the opening
  card is the called plume. A seat past the opening one reneges when the card
  it laid carries some other plume although its holding still contained a card
  of the called plume; the opening seat can never renege. A card laid in
  renege is set aside and can take nothing. Among the cards not set aside, if
  trump is a plume and any of them carries it the hottest of those takes the
  trick, and otherwise the hottest card of the called plume takes it. The
  taker is worked out wrongly: the present code simply hands the trick to the
  hottest of all four cards laid, paying no attention to the called plume, to
  trump, or to the setting aside of reneged cards, so a hot card of an idle
  plume steals tricks it cannot touch. Put the taker back on the rules
  written above. Change nothing else: the "taker" and "revokes" keys of the
  returned mapping, revokes listing in ascending seat order every seat that
  reneged, and the errors raised for an argument that is not a mapping, a
  trump that is neither a plume letter nor "bare", a lead outside 0 to 3,
  holdings that are not four non-empty lists, a card that is not a heat from 2
  to 9 with a plume letter, one card sitting in two holdings, played that is
  not a list of exactly four cards, and a seat laying a card it never held.
  Return the complete fixed file.
target: solution.py
target_content: |
  import re

  CARD = re.compile(r"[2-9][knpt]")


  def judge_vane_trick(play: dict) -> dict:
      """Who took one Vane trick, and which seats reneged on the called plume."""
      if not isinstance(play, dict):
          raise ValueError("the play must be a mapping")
      trump = play.get("trump")
      if not isinstance(trump, str) or trump not in ("k", "n", "p", "t", "bare"):
          raise ValueError("trump must be a plume letter or the word bare")
      lead = play.get("lead")
      if not isinstance(lead, int) or isinstance(lead, bool) or lead < 0 or lead > 3:
          raise ValueError("lead must be a seat from 0 to 3")
      holdings = play.get("holdings")
      if not isinstance(holdings, list) or len(holdings) != 4:
          raise ValueError("holdings must be a list of exactly four holdings")
      seen = set()
      for holding in holdings:
          if not isinstance(holding, list) or not holding:
              raise ValueError("a holding must be a non-empty list of cards")
          for card in holding:
              if not isinstance(card, str) or CARD.fullmatch(card) is None:
                  raise ValueError("a card must be a heat from 2 to 9 and a plume letter")
              if card in seen:
                  raise ValueError("one card sits in two holdings")
              seen.add(card)
      played = play.get("played")
      if not isinstance(played, list) or len(played) != 4:
          raise ValueError("played must be a list of exactly four cards")
      seats = []
      for place in range(4):
          card = played[place]
          if not isinstance(card, str) or CARD.fullmatch(card) is None:
              raise ValueError("a card must be a heat from 2 to 9 and a plume letter")
          seat = (lead + place) % 4
          if card not in holdings[seat]:
              raise ValueError("a seat laid a card it never held")
          seats.append(seat)

      called = played[0][1]
      revokes = []
      for place in range(1, 4):
          if played[place][1] == called:
              continue
          if any(held[1] == called for held in holdings[seats[place]]):
              revokes.append(seats[place])
      revokes.sort()

      best = 0
      for place in range(1, 4):
          if int(played[place][0]) > int(played[best][0]):
              best = place

      return {"taker": seats[best], "revokes": revokes}
interface: "def judge_vane_trick(play: dict) -> dict"
stop_conditions:
  - Whether every seat's holding must hold the same number of cards is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
