id: p133-unmuted-alerts
task_type: bug_fix
task: >-
  unmuted_alerts builds the on-call shortlist after suppression, and the
  current code ignores the grouping entirely. Fix it: every alert is a
  record with id (a string, unique across the input), resource (a string
  naming what it fires on) and severity (a positive integer). An alert is
  muted exactly when some other alert on the same resource carries a
  strictly higher severity; equal severities never mute each other, and
  alerts on different resources never interact. Return the ids of the
  unmuted alerts ordered by severity descending, breaking ties by id
  ascending. An empty input yields an empty list. Raise an error when two
  alerts share an id and when a severity is not a positive integer.
target: solution.py
target_content: |
  def unmuted_alerts(alerts):
      top = max((alert["severity"] for alert in alerts), default=0)
      keep = [alert["id"] for alert in alerts if alert["severity"] >= top]
      keep.sort()
      return keep
interface: "def unmuted_alerts(alerts: list) -> list"
stop_conditions:
  - Whether resource names are case-sensitive is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
