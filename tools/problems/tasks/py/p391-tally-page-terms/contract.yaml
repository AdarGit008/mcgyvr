id: p391-tally-page-terms
task_type: bug_fix
task: >-
  Fix tally_page_terms. The first argument is a list of index entries just as they
  were scraped off the page, the second a skip list. Every entry is folded to
  lowercase first, and then loses a trailing s — but only when at least four
  letters would survive the loss, so a short entry holds on to its s. Whatever
  the entry has become after both of those is its headword; a headword the skip
  list names is passed over, and every other headword adds one to its own tally.
  Give back the mapping of headword to tally. The version below never folds the
  case at all, so entries parting only over capitals are tallied apart, and it
  consults the skip list against the scraped entry rather than against the
  headword, so an entry whose headword ought to be skipped slips through
  instead. Repair both faults. Keep turning away with an error an entries or
  skips argument that is not a list and an entry that is not a non-empty
  string, and return the complete fixed file.
target: solution.py
target_content: |
  def tally_page_terms(entries: list[str], skips: list[str]) -> dict[str, int]:
      if not isinstance(entries, list) or not isinstance(skips, list):
          raise ValueError("entries and skips must both be lists")
      tally: dict[str, int] = {}
      for entry in entries:
          if not isinstance(entry, str) or entry == "":
              raise ValueError("every entry must be a non-empty string")
          if entry in skips:
              continue
          head = entry
          if head.endswith("s") and len(head) > 4:
              head = head[:-1]
          tally[head] = tally.get(head, 0) + 1
      return tally
interface: "def tally_page_terms(entries: list[str], skips: list[str]) -> dict[str, int]"
stop_conditions:
  - Whether a skip list entry may itself be written with capitals is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
