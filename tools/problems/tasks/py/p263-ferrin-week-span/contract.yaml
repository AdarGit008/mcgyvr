id: p263-ferrin-week-span
task_type: bug_fix
task: >-
  ferrin_week_span reports the inclusive span of one week of the Ferrin
  almanac. There a week runs Saturday through Friday; week 1 of a year opens
  on the first Saturday falling in January, and whatever days sit between
  January 1 and that Saturday form a stub numbered week 0 — a year whose
  January 1 is itself a Saturday carries no stub at all, and asking for its
  week 0 is refused. Later weeks count 1, 2, 3 upward, and the closing week
  of a year is cut off at December 31, so it may run anywhere from one to
  seven days. Everything is worked out from whole numbers alone with no
  standard-library calendar; a leap year is one divisible by 4 apart from
  centuries, which leap only when divisible by 400. The answer is a pair of
  zero-padded "YYYY-MM-DD" texts, opening day first, closing day second. The
  current code never applies that cut-off — it hands back the opening day
  plus six every time — so a year's closing week is reported as running past
  the end of December. Repair the cut-off and leave every refusal exactly as
  it stands: a year that is not a whole number in 1 through 9999, a week that
  is not a whole number of at least zero, a week the year never reaches, and
  week 0 of a year opening on a Saturday are all errors. Return the complete
  fixed file.
target: solution.py
target_content: |
  MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]


  def leaps(year):
      return (year % 4 == 0 and year % 100 != 0) or year % 400 == 0


  def opening_weekday(year):
      # Weekday of January 1, with 0 standing for Monday; day 0 of the count
      # is 0001-01-01, itself a Monday.
      prior = year - 1
      index = 365 * prior + prior // 4 - prior // 100 + prior // 400
      return index % 7


  def stamp(year, ordinal):
      remaining = ordinal
      for month in range(1, 13):
          held = MONTH_DAYS[month - 1] + (1 if month == 2 and leaps(year) else 0)
          if remaining <= held or month == 12:
              return f"{year:04d}-{month:02d}-{remaining:02d}"
          remaining -= held
      raise ValueError("unreachable")


  def whole(value):
      return isinstance(value, int) and not isinstance(value, bool)


  def ferrin_week_span(year: int, week: int) -> list:
      if not whole(year) or year < 1 or year > 9999:
          raise ValueError("year must be a whole number in 1..9999")
      if not whole(week) or week < 0:
          raise ValueError("week must be a whole number of at least zero")
      span = 366 if leaps(year) else 365
      opening = 1 + (5 - opening_weekday(year)) % 7
      if week == 0:
          if opening == 1:
              raise ValueError("the year opens on a Saturday, so it carries no week 0")
          return [stamp(year, 1), stamp(year, opening - 1)]
      first = opening + 7 * (week - 1)
      if first > span:
          raise ValueError("the year does not reach that week")
      last = first + 6
      return [stamp(year, first), stamp(year, last)]
interface: "def ferrin_week_span(year: int, week: int) -> list"
stop_conditions:
  - Whether the ordinal-to-date helper may be restructured while repairing the cut-off is not stated.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
