id: p481-audit-ringing-line
task_type: bug_fix
task: >-
  audit_ringing_line looks over a written line of ringing and lets a wild bell
  through. The argument is the rows, a non-empty list of rows, each row a list
  of whole numbers. The opening row must be rounds, the numbers one to however
  many there are in order, and it must hold at least two of them. Every later
  row is judged in turn on three counts. A row that is not as long as the
  opening row, or that does not hold each of the numbers one to however many
  there are exactly once, is faulted as shape. A row reached from the one
  before it by any bell shifting further than a single place, or by anything
  other than swaps of neighbours that leave every other bell where it stood, is
  faulted as jump. A row already rung earlier in the line is faulted as repeat,
  unless it is rounds and it is the last row written. Give back a mapping whose
  ok says whether the line is clean, whose fault names the first count failed
  and is the empty string for a clean line, and whose row is the number of the
  row that failed it, the opening row counting as one and a clean line giving
  nought. Where one row fails more than one count, shape is named before jump
  and jump before repeat. The code below asks only that a row holds the same
  bells as the row before it rather than that no bell shifted more than a
  single place, and it numbers the faulted row one too low. Repair both, keep
  raising an error for a rows argument that is not a list or is empty, a row
  that is not a list, a row entry that is not whole, an opening row holding
  fewer than two bells, and an opening row that is not rounds, and return the
  complete fixed file.
target: solution.py
target_content: |
  def _whole(value):
      return isinstance(value, int) and not isinstance(value, bool)


  def _is_rounds(row):
      return row == list(range(1, len(row) + 1))


  def _shapely(row, bells):
      return len(row) == bells and sorted(row) == list(range(1, bells + 1))


  def _holds_same(before, row):
      return sorted(before) == sorted(row)


  def audit_ringing_line(rows: list) -> dict:
      if not isinstance(rows, list) or len(rows) == 0:
          raise ValueError("audit_ringing_line expects a non-empty list of rows")
      for row in rows:
          if not isinstance(row, list):
              raise ValueError("a row is not a list")
          for bell in row:
              if not _whole(bell):
                  raise ValueError("a row entry is not whole")
      bells = len(rows[0])
      if bells < 2:
          raise ValueError("the opening row holds fewer than two bells")
      if not _is_rounds(rows[0]):
          raise ValueError("the opening row is not rounds")

      rung = {tuple(rows[0])}
      for seat in range(1, len(rows)):
          row = rows[seat]
          if not _shapely(row, bells):
              return {"ok": False, "fault": "shape", "row": seat}
          if not _holds_same(rows[seat - 1], row):
              return {"ok": False, "fault": "jump", "row": seat}
          mark = tuple(row)
          if mark in rung and not (_is_rounds(row) and seat == len(rows) - 1):
              return {"ok": False, "fault": "repeat", "row": seat}
          rung.add(mark)
      return {"ok": True, "fault": "", "row": 0}
interface: "def audit_ringing_line(rows: list) -> dict"
stop_conditions:
  - Whether a line may be written with no row after the opening one is not stated beyond the list being non-empty.
demonstration: ["python accept.py"]
risk: medium
scope:
  allow: ["solution.py"]
