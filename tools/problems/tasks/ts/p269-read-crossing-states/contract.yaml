id: p269-read-crossing-states
task_type: bug_fix
task: >-
  readCrossingStates reports what a bank of pedestrian crossings is showing
  at each of several moments. The controller repeats a period of whole
  seconds. Every crossing is a record carrying exactly a name, a start, a
  walk and a clear, and its start says how many seconds AFTER the
  controller's own second 0 that crossing's own sequence begins — so at
  controller second t the crossing stands at its own local second
  (t minus start), folded into the period. Local seconds 0 up to walk minus
  one show the letter W, the clear seconds that follow show C, and the rest
  of the period shows S. For every moment asked about, return one text
  carrying one letter per crossing in the order the crossings were declared.
  The present code folds the wrong way round — it adds the start to the
  moment instead of taking it away — so every crossing whose start is not
  zero is reported showing the wrong letter. Repair the fold, minding that
  the corrected subtraction can go below zero before it is folded, and leave
  every refusal as it stands: a period that is not a whole number in 1
  through 86400, an empty or non-list crossing list, a crossing that is not
  a record carrying exactly those four keys, a name that is not non-empty
  text, a start outside 0 through period minus one, a walk under one second
  or a clear under none, a walk and clear together outrunning the period, a
  repeated crossing name, a moments argument that is not a list, and a
  moment that is not a whole number in 0 through 1000000 are all errors.
  Return the complete fixed file.
target: solution.ts
target_content: |
  type Crossing = {
    name: string;
    start: number;
    walk: number;
    clear: number;
  };

  function whole(value: unknown): boolean {
    return typeof value === "number" && Number.isInteger(value);
  }

  export function readCrossingStates(
    period: number,
    crossings: Crossing[],
    moments: number[]
  ): string[] {
    if (!whole(period) || period < 1 || period > 86400) {
      throw new Error("period must be a whole number of seconds in 1..86400");
    }
    if (!Array.isArray(crossings) || crossings.length === 0) {
      throw new Error("crossings must be a non-empty list");
    }
    const seen = new Set();
    for (const crossing of crossings) {
      if (
        crossing === null ||
        typeof crossing !== "object" ||
        Array.isArray(crossing)
      ) {
        throw new Error("each crossing must be a record");
      }
      if (Object.keys(crossing).sort().join(",") !== "clear,name,start,walk") {
        throw new Error("each crossing carries exactly name, start, walk, clear");
      }
      if (typeof crossing.name !== "string" || crossing.name.length === 0) {
        throw new Error("a crossing name must be non-empty text");
      }
      if (
        !whole(crossing.start) ||
        !whole(crossing.walk) ||
        !whole(crossing.clear)
      ) {
        throw new Error("start, walk and clear must be whole numbers");
      }
      if (crossing.start < 0 || crossing.start >= period) {
        throw new Error("start must lie in 0..period-1");
      }
      if (crossing.walk < 1 || crossing.clear < 0) {
        throw new Error("walk must be at least one second and clear at least none");
      }
      if (crossing.walk + crossing.clear > period) {
        throw new Error("walk plus clear must not outrun the period");
      }
      if (seen.has(crossing.name)) {
        throw new Error("crossing names must not repeat");
      }
      seen.add(crossing.name);
    }
    if (!Array.isArray(moments)) {
      throw new Error("moments must be a list");
    }
    const out: string[] = [];
    for (const moment of moments) {
      if (!whole(moment) || moment < 0 || moment > 1000000) {
        throw new Error("each moment must be a whole number in 0..1000000");
      }
      let line = "";
      for (const crossing of crossings) {
        const local = (moment + crossing.start) % period;
        if (local < crossing.walk) {
          line += "W";
        } else if (local < crossing.walk + crossing.clear) {
          line += "C";
        } else {
          line += "S";
        }
      }
      out.push(line);
    }
    return out;
  }
interface: "export function readCrossingStates(period: number, crossings: object[], moments: number[]): string[]"
stop_conditions:
  - Whether the fold may be written with a modulus helper or inline is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
