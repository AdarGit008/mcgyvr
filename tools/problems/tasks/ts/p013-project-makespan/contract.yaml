id: p013-project-makespan
task_type: function_implementation
task: >-
  Implement projectMakespan. The input is a mapping from task name to the
  whole number of minutes that task takes, plus a list of dependency
  pairs, each [a, b] meaning task a must finish before task b may start.
  Any number of tasks may run at once, and a task starts the moment every
  one of its prerequisites is done. Return the least number of minutes in
  which the whole project can finish. Reject with an error a duration that
  is not a positive whole number, a pair naming a task absent from the
  mapping, a pair whose two names are equal, and dependencies that form a
  cycle.
target: solution.ts
interface: "export function projectMakespan(durations: Record<string, number>, deps: [string, string][]): number"
stop_conditions:
  - Whether duplicate dependency pairs are rejected or tolerated is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
