id: p099-preempt-overrun
task_type: bug_fix
task: >-
  preemptFirstOverrun simulates one machine under earliest-deadline-first
  scheduling with preemption. Each job mapping has a "name", an "at" (the
  minute it becomes available), a "work" (minutes of processing) and a
  "due". At every moment the machine runs, among available unfinished jobs,
  the one with the earliest due minute, taking the alphabetically smallest
  name on a tie; a newly available job with an earlier due minute takes the
  machine over at once, and the machine sits idle until the next arrival
  when nothing is available. Report the name of the job whose due minute is
  the earliest to pass with the job still unfinished (alphabetically
  smallest on a tie), or the empty string when every job finishes by its
  due minute, a finish exactly on the due minute being fine. The current
  code never preempts: once it picks a job it runs it to the end, so a
  short urgent arrival waits behind a long job and an overrun is reported
  that a preempting machine would avoid. Fix the simulation to preempt as
  specified, keep the idle handling and both tie rules, and keep rejecting
  with an error a repeated name, a name that is not a non-empty string, an
  "at" that is not a non-negative integer, and a "work" or "due" that is
  not a positive integer. Return the complete fixed file.
target: solution.ts
target_content: |
  export function preemptFirstOverrun(jobs: Array<Record<string, unknown>>): string {
    const seen = new Set<string>();
    for (const job of jobs) {
      if (typeof job.name !== "string" || job.name === "") {
        throw new Error("name must be a non-empty string");
      }
      if (seen.has(job.name)) {
        throw new Error(`name repeated: ${job.name}`);
      }
      seen.add(job.name);
      if (!Number.isInteger(job.at) || (job.at as number) < 0) {
        throw new Error("at must be a non-negative integer");
      }
      if (!Number.isInteger(job.work) || (job.work as number) <= 0) {
        throw new Error("work must be a positive integer");
      }
      if (!Number.isInteger(job.due) || (job.due as number) <= 0) {
        throw new Error("due must be a positive integer");
      }
    }
    const remaining = new Map<string, number>();
    const at = new Map<string, number>();
    const due = new Map<string, number>();
    for (const job of jobs) {
      remaining.set(job.name as string, job.work as number);
      at.set(job.name as string, job.at as number);
      due.set(job.name as string, job.due as number);
    }
    const finish = new Map<string, number>();
    let clock = 0;
    while (finish.size < jobs.length) {
      const ready = [...remaining.keys()].filter(
        (name) => !finish.has(name) && at.get(name)! <= clock,
      );
      if (ready.length === 0) {
        clock = Math.min(
          ...[...remaining.keys()]
            .filter((name) => !finish.has(name))
            .map((name) => at.get(name)!),
        );
        continue;
      }
      ready.sort((a, b) => due.get(a)! - due.get(b)! || (a < b ? -1 : 1));
      const run = ready[0];
      clock += remaining.get(run)!;
      remaining.set(run, 0);
      finish.set(run, clock);
    }
    const missed = jobs.filter(
      (job) => finish.get(job.name as string)! > (job.due as number),
    );
    if (missed.length === 0) {
      return "";
    }
    missed.sort(
      (a, b) =>
        (a.due as number) - (b.due as number) ||
        ((a.name as string) < (b.name as string) ? -1 : 1),
    );
    return missed[0].name as string;
  }
interface: "export function preemptFirstOverrun(jobs: Array<Record<string, unknown>>): string"
stop_conditions:
  - How large the minute values may grow within the time limit is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
