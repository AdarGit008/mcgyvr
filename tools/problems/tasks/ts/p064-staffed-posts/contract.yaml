id: p064-staffed-posts
task_type: function_implementation
task: >-
  Implement staffedPosts. A harbour has posts numbered 0 through posts-1
  and a list of applicants, each giving the post numbers they are qualified
  to hold. A post takes at most one applicant and an applicant holds at
  most one post. Return the greatest number of posts that can be staffed
  simultaneously. Handing every applicant, in order, the first free post
  they name is not enough: reaching the maximum can require moving an
  already placed applicant along to another of their posts, and chains of
  such reassignment must be followed. Reject with an error a posts count
  that is not a positive integer and any listed post number that is not an
  integer from 0 to posts-1.
target: solution.ts
interface: "export function staffedPosts(wanted: number[][], posts: number): number"
stop_conditions:
  - Whether an applicant may list the same post twice is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
