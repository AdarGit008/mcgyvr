id: p175-recorder-slots
task_type: bug_fix
task: >-
  recorderSnapshot replays a flight recorder's write script and reports what
  survived, and its bookkeeping is wrong in several places at once. Repair
  it. The recorder owns a fixed number of slots, numbered from zero and
  reused in a cycle. It remembers which slot carries the oldest surviving
  frame and how many frames it carries in all; it begins carrying nothing,
  with slot zero next in line. The script is read left to right: a frame
  number, always a whole number of zero or more, is written, while the
  value -1 ejects the oldest frame. A write made while spare slots remain
  lands that many places past the oldest slot, counting around the cycle. A
  write made while every slot is occupied lands on the slot carrying the
  oldest frame and destroys it, after which the oldest marker moves on one
  place; each such write is tallied as overwritten. An eject moves the
  oldest marker on one place and lowers the carried count, but an eject
  with nothing to give changes nothing and is tallied as starved instead.
  Return a record with order, the surviving frames listed oldest first,
  head, the slot number carrying the oldest surviving frame — or the slot
  the next write will take, when nothing survives — and the two tallies
  overwritten and starved. Throw an error when the slot count is not a
  positive whole number, when the script is not a list, and when a script
  entry is neither -1 nor a whole number of zero or more. Return the
  complete fixed file.
target: solution.ts
target_content: |
  export function recorderSnapshot(
    slots: number,
    script: number[],
  ): { order: number[]; head: number; overwritten: number; starved: number } {
    if (typeof slots !== "number" || !Number.isInteger(slots) || slots < 1) {
      throw new Error("the slot count must be a positive whole number");
    }
    if (!Array.isArray(script)) {
      throw new Error("the script must be a list");
    }
    const seats: number[] = new Array(slots).fill(-1);
    let head = 0;
    let carried = 0;
    let overwritten = 0;
    const starved = 0;
    for (const entry of script) {
      if (typeof entry !== "number" || !Number.isInteger(entry) || entry < -1) {
        throw new Error("a script entry must be -1 or a frame number");
      }
      if (entry === -1) {
        head = (head + 1) % slots;
        carried -= 1;
      } else if (carried === slots) {
        seats[head] = entry;
        overwritten += 1;
      } else {
        seats[(head + carried) % slots] = entry;
        carried += 1;
      }
    }
    const order: number[] = [];
    for (let at = 0; at < carried; at++) {
      order.push(seats[at]);
    }
    return { order, head, overwritten, starved };
  }
interface: "export function recorderSnapshot(slots: number, script: number[]): { order: number[]; head: number; overwritten: number; starved: number }"
stop_conditions:
  - Whether the same frame number may be written twice is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
