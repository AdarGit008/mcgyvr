id: p039-undo-editor
task_type: bug_fix
task: >-
  runEditor replays editing operations over a document that starts empty
  and returns the final text. ["type", s] appends the non-empty string s,
  ["erase", n] removes the last n characters, ["undo"] reverts the latest
  surviving edit, and ["redo"] reinstates the most recently undone one;
  undo with nothing to revert and redo with nothing to reinstate are silent
  no-ops. Performing a fresh edit must discard the entire redo history — a
  document cannot redo across a divergence. The current code keeps undone
  states alive after new edits, so a later redo resurrects text from an
  abandoned timeline. Fix that invariant while preserving everything else,
  including rejecting with an error an erase count that is not a positive
  integer or exceeds the current length, and an unknown operation name.
  Return the complete fixed file.
target: solution.ts
target_content: |
  export function runEditor(ops: (string | number)[][]): string {
    const past: string[] = [];
    const future: string[] = [];
    let text = "";
    for (const op of ops) {
      const kind = op[0];
      if (kind === "type") {
        const piece = op[1];
        if (typeof piece !== "string" || piece.length === 0) {
          throw new Error("type needs a non-empty string");
        }
        past.push(text);
        text = text + piece;
      } else if (kind === "erase") {
        const count = op[1];
        if (typeof count !== "number" || !Number.isInteger(count) || count < 1 || count > text.length) {
          throw new Error("erase count out of range");
        }
        past.push(text);
        text = text.slice(0, text.length - count);
      } else if (kind === "undo") {
        if (past.length > 0) {
          future.push(text);
          text = past.pop()!;
        }
      } else if (kind === "redo") {
        if (future.length > 0) {
          past.push(text);
          text = future.pop()!;
        }
      } else {
        throw new Error(`unknown operation ${String(kind)}`);
      }
    }
    return text;
  }
interface: "export function runEditor(ops: (string | number)[][]): string"
stop_conditions:
  - How many levels of undo history must be retained is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
