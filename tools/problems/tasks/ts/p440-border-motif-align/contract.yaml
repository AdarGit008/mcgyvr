id: p440-border-motif-align
task_type: bug_fix
task: >-
  alignBorderMotifs reports where a repeating border sits along a wall and
  gets both of its answers wrong. Repair it. A border repeats a run of
  patternLength motifs over and over, the motifs of one run numbered from 0
  upward, and it travels unbroken along a wall built of strips laid left to
  right. The widths argument gives, strip by strip in that order, how many
  motifs each strip carries. The border starts with motif 0 at the left edge
  of the leading strip. Report for every strip the number of the motif
  standing at its left edge, and report as well the 1-based place of the
  first strip after the leading one whose left edge carries motif 0 once
  more, or 0 when no strip after the leading one does. The code below adds up
  each strip's width already reduced against the pattern length but never
  reduces the running total itself, so an edge it reports may name a motif
  the run does not hold; and it hunts for that fresh start from the leading
  strip onward, which always answers with the leading strip itself. Mend both
  faults, and add the checking the code lacks: raise an error when the widths
  are not a list, when the list is empty, when a width is not a whole number
  of one or more, and when patternLength is not a whole number of one or
  more. Return a mapping under "edges", one motif number per strip in order,
  and "freshAt", that 1-based place. Return the complete fixed file.
target: solution.ts
target_content: |
  export function alignBorderMotifs(
    widths: number[],
    patternLength: number,
  ): { edges: number[]; freshAt: number } {
    const edges: number[] = [];
    let running = 0;
    for (const width of widths) {
      edges.push(running);
      running += width % patternLength;
    }
    let freshAt = 0;
    for (let i = 0; i < edges.length; i++) {
      if (edges[i] === 0) {
        freshAt = i + 1;
        break;
      }
    }
    return { edges, freshAt };
  }
interface: "export function alignBorderMotifs(widths: number[], patternLength: number): { edges: number[]; freshAt: number }"
stop_conditions:
  - Whether the wall's strips must together carry a whole number of runs is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
