id: p329-fold-visit-trail
task_type: bug_fix
task: >-
  foldVisitTrail folds a scattered pile of pings into the runs each handle
  left behind, and it currently miscounts them. Fix it. A ping is a
  two-element list of a handle, a non-empty string, and a stamp, a whole
  number. The pings come in scattered, so each handle's stamps must be put in
  rising order before anything is counted. Walking a handle's stamps in that
  order, a run carries on while each stamp sits closer than idle to the one
  before it, and a fresh run begins the moment a stamp is idle or more past
  its predecessor — a distance of exactly idle already breaks the run. Answer
  with one two-element list per handle, the handle and then the lengths of its
  runs in the order the runs were left, with the handles rising. Keep raising
  an error when the pings are not a list, when a ping is not a list of exactly
  two items, when a handle is not a non-empty string, when a stamp is not a
  whole number, when one handle carries the same stamp twice, and when idle
  is not a whole number of one or more. Return the complete fixed file.
target: solution.ts
target_content: |
  function marked(value: any): boolean {
    return typeof value === "number" && Number.isInteger(value);
  }

  function handled(value: any): boolean {
    return typeof value === "string" && value.length > 0;
  }

  export function foldVisitTrail(pings: any, idle: any): (string | number[])[][] {
    if (!Array.isArray(pings)) {
      throw new Error("the pings must be a list");
    }
    if (!marked(idle) || idle < 1) {
      throw new Error("idle must be a whole number of one or more");
    }
    const trails = new Map<string, number[]>();
    for (const ping of pings) {
      if (!Array.isArray(ping) || ping.length !== 2) {
        throw new Error("a ping must be a list of exactly two items");
      }
      const [handle, stamp] = ping;
      if (!handled(handle)) {
        throw new Error("a handle must be a non-empty string");
      }
      if (!marked(stamp)) {
        throw new Error("a stamp must be a whole number");
      }
      if (!trails.has(handle)) {
        trails.set(handle, []);
      }
      const stamps = trails.get(handle) as number[];
      if (stamps.includes(stamp)) {
        throw new Error("a handle carries one stamp twice");
      }
      stamps.push(stamp);
    }
    const folded: (string | number[])[][] = [];
    for (const handle of [...trails.keys()].sort()) {
      const stamps = trails.get(handle) as number[];
      const runs: number[] = [];
      for (let i = 0; i < stamps.length; i++) {
        if (i === 0 || stamps[i] - stamps[i - 1] > idle) {
          runs.push(1);
        } else {
          runs[runs.length - 1] += 1;
        }
      }
      folded.push([handle, runs]);
    }
    return folded;
  }
interface: "export function foldVisitTrail(pings: any, idle: any): (string | number[])[][]"
stop_conditions:
  - Whether two different handles may share a stamp is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
