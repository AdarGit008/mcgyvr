id: p033-keyset-page
task_type: function_implementation
task: >-
  Implement keysetPage. It pages through a sorted collection with a keyset
  cursor: given a list of integer ids in strictly increasing order, an
  integer cursor, and a page limit, return a mapping whose key "items"
  holds the first limit ids strictly greater than the cursor and whose key
  "done" holds true when no id remains beyond the page and false otherwise.
  To read the first page a caller passes any cursor smaller than the first
  id; a cursor need not itself appear among the ids. An empty id list gives
  an empty page that is done. Reject a limit that is not a positive
  integer, a cursor that is not an integer, and ids that are not strictly
  increasing, with an error.
target: solution.ts
interface: "export function keysetPage(ids: number[], cursor: number, limit: number): { items: number[]; done: boolean }"
stop_conditions:
  - Whether ids may be negative or zero is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
