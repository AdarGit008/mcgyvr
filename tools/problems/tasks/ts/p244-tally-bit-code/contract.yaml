id: p244-tally-bit-code
task_type: function_implementation
task: >-
  Implement buildWeightCode. The argument lists one entry per token; an
  entry is a list holding the token, a non-empty string of lowercase
  letters a to z, and its tally, a whole number of one or more. Build bits
  for every token such that no token's bits open any other token's bits,
  by this recipe and by no other, so that the answer is fixed. First put
  the tokens in rising letter order and hand them buds numbered from zero
  in that order, each bud carrying its token's tally as its load. Then,
  while more than one bud is live, choose the live bud of smallest load,
  breaking a tie by the smaller bud number, and call it the near bud;
  choose again the same way among the buds still live and call it the far
  bud; retire both and add one fresh live bud whose load is the two loads
  added, whose number is one past the highest number handed out so far, and
  which remembers the near bud and the far bud it was made from. The bud
  left live at the end is the crown. A token's bits are read walking down
  from the crown, writing 0 for each step onto a near bud and 1 for each
  step onto a far bud. A lone token has no walk and takes the bits "0".
  Return a mapping under three keys: "codes", a mapping from every token to
  its bits; "bits", each tally multiplied by the length of that token's
  bits and all of those added together; and "tallest", the length of the
  longest bits handed out. Raise an error when the argument is not a list,
  when it holds nothing, when an entry is not a list of exactly two things,
  when a token is not a non-empty string of lowercase letters, when a token
  shows up twice, and when a tally is not a whole number of one or more.
target: solution.ts
interface: "export function buildWeightCode(entries: any[]): any"
stop_conditions:
  - Whether the recipe must run faster than a scan of every live bud per round is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
