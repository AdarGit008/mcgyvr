id: p328-cut-idle-sittings
task_type: function_implementation
task: >-
  Implement cutIdleSittings. An event is a record with who, a non-empty string
  naming the visitor; at, a whole number of minutes; and kind, either the word
  hit or the word reset. Events arrive in no particular order. Take each
  visitor's events on their own, put them in rising order of at, and where two
  share an at keep the order they were handed in. The first event of a visitor
  opens a sitting. Every event after that opens a fresh sitting when any of
  three things is so: its kind is reset; its at is more than gap past the at
  of the event just before it; or letting it in would stretch the running
  sitting, measured from its earliest at to its latest, past cap. Failing all
  three the event joins the running sitting. Report one record per sitting
  carrying who, from and to — the earliest and latest at the sitting holds —
  and count, how many events fell inside it. Order the report by who rising
  and then by from rising. Raise an error when the events are not a list, when
  an event is not a record carrying all three names, when who is not a
  non-empty string, when at is not a whole number, when kind is neither hit
  nor reset, and when gap or cap is not a whole number of zero or more.
target: solution.ts
interface: "export function cutIdleSittings(events: any, gap: any, cap: any): { who: string; from: number; to: number; count: number }[]"
stop_conditions:
  - Whether a cap smaller than the gap is meaningful is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
