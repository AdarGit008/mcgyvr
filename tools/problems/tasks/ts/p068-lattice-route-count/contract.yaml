id: p068-lattice-route-count
task_type: bug_fix
task: >-
  latticeRouteCount counts the distinct routes across a rectangular grid
  from its top-left cell to its bottom-right cell, stepping only right or
  down and never onto a cell marked 1. The current code seeds every clear
  cell of the first row and of the first column as reachable in one way,
  including the cells sitting beyond a marked one, so it counts routes that
  would have to leap over an obstacle to exist. Fix the counting so a
  first-row or first-column cell is reachable only through its predecessor;
  keep returning 0 when either corner is marked, keep the single clear cell
  counting 1, and keep rejecting with an error an empty or ragged grid and
  a cell that is not 0 or 1. Return the complete fixed file.
target: solution.ts
target_content: |
  export function latticeRouteCount(grid: number[][]): number {
    if (!Array.isArray(grid) || grid.length === 0) {
      throw new Error("grid must be a non-empty array of rows");
    }
    const cols = Array.isArray(grid[0]) ? grid[0].length : 0;
    for (const row of grid) {
      if (!Array.isArray(row) || row.length !== cols || cols === 0) {
        throw new Error("grid rows must be equal-length non-empty arrays");
      }
      for (const cell of row) {
        if (cell !== 0 && cell !== 1) {
          throw new Error("cells must be 0 or 1");
        }
      }
    }
    const rows = grid.length;
    if (grid[0][0] === 1 || grid[rows - 1][cols - 1] === 1) {
      return 0;
    }
    const routes: number[][] = grid.map((row) => row.map(() => 0));
    for (let c = 0; c < cols; c++) {
      routes[0][c] = grid[0][c] === 0 ? 1 : 0;
    }
    for (let r = 0; r < rows; r++) {
      routes[r][0] = grid[r][0] === 0 ? 1 : 0;
    }
    for (let r = 1; r < rows; r++) {
      for (let c = 1; c < cols; c++) {
        routes[r][c] = grid[r][c] === 1 ? 0 : routes[r - 1][c] + routes[r][c - 1];
      }
    }
    return routes[rows - 1][cols - 1];
  }
interface: "export function latticeRouteCount(grid: number[][]): number"
stop_conditions:
  - Whether counts may exceed the exact integer range on very large grids is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
