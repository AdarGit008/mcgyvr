id: p231-sift-event-streams
task_type: bug_fix
task: >-
  siftEventStreams sorts events into the wrong lanes. Repair it. The
  severities, lowest first, are "chatter", "notice", "alarm" and "panic". The
  first argument is a list of lanes, each a mapping with "name" (a non-empty
  string, which another lane may carry too), "prefix" (a string, the empty one
  standing for every channel), "upTo" (a severity, the highest the lane will
  take) and "last" (true or false). The second argument is a list of events,
  each a mapping with "channel" (a non-empty string) and "severity" (a
  severity). Take the events in turn, and for each one walk the lanes in order:
  a lane catches the event when the channel begins with the lane's prefix and
  the event's severity stands no higher than the lane's own; once a lane whose
  "last" is true has caught it, walk no further for that event. Return a
  mapping with "lanes", one entry per distinct lane name in the order the names
  first appear among the lanes, each a mapping with "name" and "took" (the
  places of the events that name caught, counting from nought, ascending, each
  place named once however many lanes of that name caught it), and "dropped",
  the places of the events no lane caught at all, ascending. Raise an error
  when the lanes or the events are not a list, when a lane or an event is not a
  mapping, when a name or a channel is not a non-empty string, when a prefix is
  not a string, when a severity is not one of the four words, and when "last"
  is neither true nor false. Return the complete fixed file.
target: solution.ts
target_content: |
  /** Sifts events into lanes by channel prefix and severity ceiling. */
  export function siftEventStreams(
    lanes: Array<Record<string, unknown>>,
    events: Array<Record<string, unknown>>,
  ): Record<string, unknown> {
    const RANK = ["chatter", "notice", "alarm", "panic"];
    const gathered = lanes.map((lane: any) => ({
      name: lane.name as string,
      took: [] as number[],
    }));
    const dropped: number[] = [];
    events.forEach((event: any, at: number) => {
      let caught = false;
      lanes.forEach((lane: any, which: number) => {
        if (!event.channel.startsWith(lane.prefix)) return;
        if (RANK.indexOf(event.severity) >= RANK.indexOf(lane.upTo)) return;
        gathered[which].took.push(at);
        caught = true;
      });
      if (!caught) dropped.push(at);
    });
    return { lanes: gathered, dropped };
  }
interface: "export function siftEventStreams(lanes: Array<Record<string, unknown>>, events: Array<Record<string, unknown>>): Record<string, unknown>"
stop_conditions:
  - Whether one lane's prefix may be the opening of another lane's prefix is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
