id: p125-van-loading
task_type: function_implementation
task: >-
  Implement loadVans. Parcels arrive as a list of positive integer
  weights and are dispatched onto two vans by a fixed drill: consider
  parcels from heaviest to lightest, equal weights in their original
  order, and hand each parcel to whichever van currently carries less
  total weight, the first van when the two are even. Return the pair
  [first van total, second van total] once every parcel is aboard.
  Reject an empty parcel list and any weight below one with an error.
target: solution.ts
interface: "export function loadVans(parcels: number[]): number[]"
stop_conditions:
  - Behavior for fractional weights is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
