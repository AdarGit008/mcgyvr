id: p018-door-controller
task_type: bug_fix
task: >-
  finalDoorState walks a door through a list of events and reports where
  it ends up. The door starts locked. The event unlock moves it from
  locked to closed, lock from closed to locked, open from closed to open,
  and close from open to closed; those four are the only lawful moves. The
  current code applies whatever an event names, so a locked door swings
  open. Fix it: an event that does not apply in the current state must
  leave the state alone and count as ignored, and an event that is not one
  of the four names must be rejected with an error. Return the final state
  and the ignored count joined by a colon, like open:2.
target: solution.ts
target_content: |
  export function finalDoorState(events: string[]): string {
    const moves: Record<string, string> = {
      unlock: "closed",
      lock: "locked",
      open: "open",
      close: "closed",
    };
    let state = "locked";
    let ignored = 0;
    for (const event of events) {
      state = moves[event] ?? state;
    }
    return state + ":" + ignored;
  }
interface: "export function finalDoorState(events: string[]): string"
stop_conditions:
  - Whether event names are case-sensitive is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
