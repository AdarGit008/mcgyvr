id: p016-strip-tilings
task_type: function_implementation
task: >-
  Implement countStripTilings. Count the distinct ways to cover a grid two
  cells tall and width cells wide, completely and without overlap, using
  one-by-two dominoes (laid upright or flat) and two-by-two squares. A
  width of zero has exactly one covering, the empty one, and a width of
  one has exactly one, a single upright domino. Two coverings are distinct
  when any cell is served by a differently placed or differently shaped
  piece. Return the count. Reject with an error a width that is negative
  or not a whole number.
target: solution.ts
interface: "export function countStripTilings(width: number): number"
stop_conditions:
  - How large a width must be handled, and in what running time, is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
