id: p404-dispense-exact-change
task_type: function_implementation
task: >-
  Implement dispenseExactChange. A vending machine must pay out an amount of
  minor units exactly, drawing only on the coins its hopper actually holds.
  The hopper is given as pairs of a face value and how many coins of that
  face the hopper carries; a face may be listed with a stock of none. Work
  out the payout that uses the fewest coins altogether. Where two payouts
  need equally many coins, prefer the one taking more coins of the largest
  face; if those match too, prefer more of the next largest, and so on down
  the faces. Give back the chosen payout as pairs of face value and coins
  taken, largest face first, leaving out any face the payout does not touch;
  an amount of nothing is paid by the empty payout. When no combination of
  the stock lands on the amount exactly, refuse with an error rather than
  paying out something near it. Refuse with an error as well an amount that
  is not a whole number, an amount below nothing, an amount above 100000, a
  hopper that is not a list, a hopper listing no faces at all, an entry that
  is not a pair, a face value that is not a whole number above nothing, a
  stock that is not a whole number of nothing or more, and one face value
  listed twice.
target: solution.ts
interface: "export function dispenseExactChange(amount: number, hopper: number[][]): number[][]"
stop_conditions:
  - Whether the hopper pairs arrive in any particular order is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
