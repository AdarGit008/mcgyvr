id: p037-fifo-cache-trace
task_type: bug_fix
task: >-
  fifoCacheTrace replays a memoized function's call log through a bounded
  result cache and reports, call by call, whether the result was already
  cached. Eviction must be strictly first-in-first-out: when a miss lands
  in a full cache, the entry inserted earliest is discarded, and a hit must
  never refresh an entry's age — insertion order alone decides who leaves.
  The current code wrongly promotes an entry to youngest on every hit,
  which turns the policy into least-recently-used and makes it discard the
  wrong keys. Fix the eviction policy without changing the reported trace
  vocabulary of "hit" and "miss", keep rejecting a capacity that is not a
  positive integer with an error, and return the complete fixed file.
target: solution.ts
target_content: |
  export function fifoCacheTrace(capacity: number, keys: string[]): string[] {
    if (!Number.isInteger(capacity) || capacity < 1) {
      throw new Error("capacity must be a positive integer");
    }
    const cached: string[] = [];
    const trace: string[] = [];
    for (const key of keys) {
      const at = cached.indexOf(key);
      if (at !== -1) {
        cached.splice(at, 1);
        cached.push(key);
        trace.push("hit");
      } else {
        if (cached.length === capacity) {
          cached.shift();
        }
        cached.push(key);
        trace.push("miss");
      }
    }
    return trace;
  }
interface: "export function fifoCacheTrace(capacity: number, keys: string[]): string[]"
stop_conditions:
  - Whether keys are case-sensitive is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
