id: p251-stack-shape-name
task_type: function_implementation
task: >-
  Implement nameTriadStack. The argument is a list of whole numbers, each a
  pitch mark counted in half-tones and free to be negative or to repeat.
  Fold every mark to its class, the remainder left after dividing by
  twelve, always landing from 0 to 11, so a mark of -5 folds to 7. Throw
  away repeats; what is left is the stack. For each class in the stack,
  taken in rising order, work out the shape it would give if it were the
  base: subtract that class from every class of the stack, fold each answer
  to 0 to 11 again, and sort those rising. Look the shape up in this table,
  which is written in the order the rows are to be preferred: 0-4-7 major;
  0-3-7 minor; 0-3-6 diminished; 0-4-8 augmented; 0-5-7 quartal; 0-2-6
  narrow; 0-4-7-11 major seventh; 0-4-7-10 dominant seventh; 0-3-7-10 minor
  seventh; 0-3-6-9 shrunk seventh. Gather every class whose shape sits in
  the table; among them keep only those matching whichever row stands
  earliest in the table, and of those take the smallest class as the base.
  Return a mapping under two keys, "base" holding that class and "name"
  holding that row's name. When no class gives a shape the table knows,
  return "base" of -1 and "name" of "unknown". Raise an error when the
  argument is not a list, when it holds no marks, when a mark is not a
  whole number, and when the stack is left with fewer than three classes.
target: solution.ts
interface: "export function nameTriadStack(marks: number[]): any"
stop_conditions:
  - Whether a stack of more than four classes should ever be named is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
