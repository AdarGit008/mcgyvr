id: p090-run-loom
task_type: function_implementation
task: >-
  Implement runLoom. A loom program is a list of instructions run in order
  against a stack of integers that starts empty. ["put", n] pushes the
  integer n; ["twin"] pushes a copy of the top value; ["flip"] swaps the
  two topmost values; ["fuse"] pops two values and pushes their sum;
  ["scale"] pops two values and pushes their product; ["weave"] pops the
  top value and appends it to the woven output. A bad program never
  raises: the function always returns a mapping with keys status and
  output. Running off the end of the program gives status done. An
  instruction needing more stack than it has stops the run with status
  starved; an instruction whose name is none of the six stops it with
  status lost; a stopped run's mapping carries the extra key step, the
  0-based index of the offending instruction, and output holds whatever
  was woven before the stop.
target: solution.ts
interface: "export function runLoom(program: (string | number)[][]): { status: string; output: number[]; step?: number }"
stop_conditions:
  - Whether integer overflow of stack values is possible is not stated.
acceptance: ["node accept.mjs"]
risk: low
scope:
  allow: ["solution.ts"]
