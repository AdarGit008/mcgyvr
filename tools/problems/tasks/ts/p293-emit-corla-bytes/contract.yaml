id: p293-emit-corla-bytes
task_type: bug_fix
task: >-
  emitCorlaBytes turns a Corla listing into bytes, but it settles a spot the
  moment it meets one, so a spot named further down the listing comes out as
  address zero, and it tallies a spot's address in instructions where the
  machine tallies it in bytes. Cure both faults, which together want a
  walk that widths every instruction and fixes every spot before a single
  byte is settled. The listing is a list of text rows. Strip each row; skip
  it when it is empty or its first character is a hash. A row whose first
  character is a full stop names a spot, the rest of the row being a
  lowercase word of letters, digits and underscores, and the spot stands at
  the address the next byte will occupy while consuming no byte itself.
  Every other row is a keyword in capitals and, for two of them, one
  argument, the two divided by whitespace. NOP occupies one byte, 0. LOAD v
  occupies two, 16 then v, v being a decimal integer from 0 to 255. GOTO s
  occupies three, 32 then the high byte then the low byte of the address of
  spot s, written with its leading full stop. CALL s occupies three the same
  way but opens with 48. STOP occupies one byte, 64. Return the whole run of
  bytes. Go on rejecting with an error a non-list argument, a row that is
  not text, a keyword nobody knows, a wrong count of arguments, a v outside
  0 to 255, a badly spelled spot, a spot named twice, and a spot no row
  names. Return the complete fixed file.
target: solution.ts
target_content: |
  const SPOT = /^[a-z][a-z0-9_]*$/;

  export function emitCorlaBytes(lines: string[]): number[] {
    if (!Array.isArray(lines)) {
      throw new Error("emitCorlaBytes expects a list of rows");
    }
    const spots = new Map<string, number>();
    const bytes: number[] = [];
    let tally = 0;
    for (const raw of lines) {
      if (typeof raw !== "string") {
        throw new Error("every row must be text");
      }
      const row = raw.trim();
      if (row === "" || row.startsWith("#")) {
        continue;
      }
      if (row.startsWith(".")) {
        const name = row.slice(1);
        if (!SPOT.test(name)) {
          throw new Error("badly spelled spot: " + row);
        }
        if (spots.has(name)) {
          throw new Error("spot named twice: " + name);
        }
        spots.set(name, tally);
        continue;
      }
      const parts = row.split(/\s+/);
      tally += 1;
      if (parts[0] === "NOP" && parts.length === 1) {
        bytes.push(0);
      } else if (parts[0] === "STOP" && parts.length === 1) {
        bytes.push(64);
      } else if (parts[0] === "LOAD" && parts.length === 2) {
        if (!/^(?:0|[1-9][0-9]*)$/.test(parts[1]) || Number(parts[1]) > 255) {
          throw new Error("v outside 0 to 255: " + parts[1]);
        }
        bytes.push(16, Number(parts[1]));
      } else if ((parts[0] === "GOTO" || parts[0] === "CALL") && parts.length === 2) {
        const name = parts[1].startsWith(".") ? parts[1].slice(1) : parts[1];
        const seat = spots.get(name) ?? 0;
        bytes.push(parts[0] === "GOTO" ? 32 : 48, Math.floor(seat / 256), seat % 256);
      } else {
        throw new Error("keyword nobody knows: " + row);
      }
    }
    return bytes;
  }
interface: "export function emitCorlaBytes(lines: string[]): number[]"
stop_conditions:
  - Whether a listing may run past address 65535 is not stated.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
