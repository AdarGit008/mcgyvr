id: p463-redeem-point-batches
task_type: bug_fix
task: >-
  redeemPointBatches replays a loyalty account's ledger of points and gets the
  drawing order wrong. The argument is the events, a list of mappings dealt
  with in the order given, whose day never steps backwards. An earn event
  carries exactly the four keys kind (the word earn), day (a whole number at
  nought or above), points (a whole number above nought) and life (a whole
  number at nought or above); it opens a batch holding those points, spendable
  on any day from its own day through day plus life, that last day taken in. A
  burn event carries exactly the three keys kind (the word burn), day and
  points. Before an event is dealt with, every batch whose last spendable day
  falls before that event's day is struck out and whatever it still holds is
  added to the lapsed count. A burn draws from the live batches, soonest to
  lapse first and, where two batches lapse on the same day, the one opened
  earlier first; should the live batches together hold less than the burn asks
  for, not one point is drawn and that burn records nought. Give back a mapping
  whose taken lists what each burn actually drew, in burn order, whose lapsed
  is the total struck out unspent, and whose balance is what the live batches
  hold once the last event has been dealt with, with no further striking out.
  The code below draws from batches in the order they were opened rather than
  by how soon they lapse, and strikes a batch out on its last spendable day
  instead of the day after. Repair both, keep raising an error for an argument
  that is not a list, an event that is not a mapping, a kind outside earn and
  burn, an event whose keys are not the ones its kind calls for, a day that is
  not whole or steps backwards, points that are not whole or fall below one,
  and a life that is not whole or falls below nought, and return the complete
  fixed file.
target: solution.ts
target_content: |
  type Batch = { last: number; seq: number; left: number };

  function whole(value: unknown): boolean {
    return typeof value === "number" && Number.isInteger(value);
  }

  export function redeemPointBatches(
    events: Record<string, unknown>[],
  ): { taken: number[]; lapsed: number; balance: number } {
    if (!Array.isArray(events)) {
      throw new Error("redeemPointBatches expects a list of events");
    }
    let batches: Batch[] = [];
    const taken: number[] = [];
    let lapsed = 0;
    let seq = 0;
    let clock = 0;
    let started = false;

    for (const event of events) {
      if (typeof event !== "object" || event === null || Array.isArray(event)) {
        throw new Error("an event is not a mapping");
      }
      const kind = event["kind"];
      if (kind !== "earn" && kind !== "burn") {
        throw new Error("an event's kind is outside earn and burn");
      }
      const keys = Object.keys(event).sort().join(",");
      const wanted = kind === "earn" ? "day,kind,life,points" : "day,kind,points";
      if (keys !== wanted) {
        throw new Error("an event's keys are not the ones its kind calls for");
      }
      const day = event["day"];
      if (!whole(day) || Number(day) < 0) {
        throw new Error("a day is not whole or falls below nought");
      }
      if (started && Number(day) < clock) {
        throw new Error("a day steps backwards");
      }
      clock = Number(day);
      started = true;
      const points = event["points"];
      if (!whole(points) || Number(points) < 1) {
        throw new Error("points are not whole or fall below one");
      }

      const alive: Batch[] = [];
      for (const batch of batches) {
        if (batch.last <= clock) {
          lapsed += batch.left;
        } else {
          alive.push(batch);
        }
      }
      batches = alive;

      if (kind === "earn") {
        const life = event["life"];
        if (!whole(life) || Number(life) < 0) {
          throw new Error("a life is not whole or falls below nought");
        }
        batches.push({ last: clock + Number(life), seq, left: Number(points) });
        seq += 1;
        continue;
      }

      const want = Number(points);
      let held = 0;
      for (const batch of batches) {
        held += batch.left;
      }
      if (held < want) {
        taken.push(0);
        continue;
      }
      let need = want;
      for (const batch of batches) {
        if (need === 0) {
          break;
        }
        const drawn = Math.min(batch.left, need);
        batch.left -= drawn;
        need -= drawn;
      }
      batches = batches.filter((batch) => batch.left > 0);
      taken.push(want);
    }

    let balance = 0;
    for (const batch of batches) {
      balance += batch.left;
    }
    return { taken, lapsed, balance };
  }
interface: "export function redeemPointBatches(events: Record<string, unknown>[]): { taken: number[]; lapsed: number; balance: number }"
stop_conditions:
  - Whether two events may share one day is not stated beyond days never stepping backwards.
demonstration: ["node accept.mjs"]
risk: medium
scope:
  allow: ["solution.ts"]
