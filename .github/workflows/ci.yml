name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # BUILD-05 executes `bootstrap_command` from baseline.config.json, so
      # the gate needs the same toolchain a stranger's clean checkout would
      # use. Without it the crown check fails on the runner rather than on
      # anything about the repo. Kept in step with the test job's pin.
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: baseline self-check (rule-set integrity)
        run: node tools/baseline/baseline.mjs check --self-check
      - name: baseline gate
        run: node tools/baseline/baseline.mjs check --repo .
      - name: orientation survey (derived state; degrades without forge auth)
        run: node tools/baseline/baseline.mjs orient --repo .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The JS half of the gate's own bar (ADR-0025). Two reasons this job needs
      # a toolchain the baseline job's Node 20 does not supply:
      #
      # * the JS lint rung is only a rung if it can reject, and the test that
      #   proves it needs eslint plus the pinned typescript-eslint parser. A
      #   check that silently skips is the same defect as a rung that silently
      #   passes, one layer out.
      # * Node stopped running TypeScript unflagged at 23.6, so acceptance for
      #   a `.ts` target — and therefore the TypeScript arm's reference — needs
      #   a Node that strips types. On Node 20 those tests skipped here and
      #   passed only on a developer's machine.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # `ci`, not `install`: the lockfile is the pin, and the parser version is
      # part of the bar it applies.
      #
      # The PATH line is not optional. `require_tool` resolves every linter with
      # `shutil.which`, so a toolchain in `node_modules/.bin` is a toolchain the
      # gate cannot see: eslint and prettier read as *not installed*, their rungs
      # are skipped, and the preflight refuses the sweep. Installing without
      # exporting is the same "present but unreachable" shape ADR-0025 is about.
      - name: install the pinned JS toolchain
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: lint
        run: make lint
      - name: typecheck
        run: make typecheck
      # The config reference is generated from config.SCHEMA. This fails a
      # schema change that did not regenerate it, which is the only thing
      # keeping a documented key and a validated key from drifting apart.
      # It lives in this job on purpose: `test` is a required status check,
      # so drift cannot merge. A separate job would not be required.
      - name: config reference is current
        run: make docs-check
      - name: test
        run: make test
