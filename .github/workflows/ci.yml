name: ci
# The full Linux suite. `test` is the check a pull request into main needs
# before it may merge, so keep the workflow name `ci` and the job id `test`:
# the required context is `ci / test (pull_request)`, and renaming either one
# leaves every pull request waiting on a check that never reports.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pinned prettier (package-lock.json) for the one test that runs it,
      # tests/test_fix_outcomes_and_argv.py, which skips without
      # node_modules/.bin/prettier. `ci`, not `install`: the lockfile is the pin.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: install the pinned prettier
        run: npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      # The gate scripts' shellcheck test skips with no shellcheck on PATH.
      # Naming it here keeps the test from turning into a silent skip if the
      # runner image ever drops it. The index is refreshed first: a runner
      # image can ship one too stale to resolve the package.
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # One `make check` — a single `make setup`, then lint, typecheck,
      # docs-check and test in one pass. The four leaf targets each depend on
      # `setup`, so running them separately rebuilds the editable package four
      # times per run; `check` builds once and reuses it. pytest runs under
      # `-n auto` (xdist, pyproject.toml) to cut wall-clock. Not
      # PYTEST_ADDOPTS: tests that run pytest themselves inherit it, and a
      # nested run on xdist workers reports in a shape those tests do not read.
      #
      # docs-check lives in this job on purpose: `test` is the required status
      # check, so the config-reference / skill drift it guards cannot merge.
      # A separate job would not be required. The hub-wire schemas the
      # product ships are held by the suite itself
      # (tests/test_the_hub_wire_is_defined_once_in_the_product.py,
      # tests/test_the_rig_agent_speaks_the_hubs_published_schema.py).
      - name: check (lint, typecheck, docs, test)
        # The door refuses any ambient RUN_*/DOCKER_* variable (its own
        # vocabulary), and a runner may set some (RUN_TOOL_CACHE). Strip them
        # before `make check`.
        run: |
          for v in $(env | grep -E '^(RUN_|DOCKER_)' | cut -d= -f1); do unset "$v"; done
          make check
  # The package supports every Python from its `requires-python` floor up, and
  # a module can import on the floor and not on a newer one. This job runs the
  # test file that imports every module of the package, and compiles every
  # source file, on newer supported Pythons. It runs beside `test`, shares
  # nothing with it, and is not a required check.
  import-newer-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - name: import every module of the package
        run: |
          uv sync --frozen
          uv run --no-sync pytest tests/test_every_module_of_the_package_imports_under_every_supported_python.py
