name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: baseline self-check (rule-set integrity)
        run: node tools/baseline/baseline.mjs check --self-check
      - name: baseline gate
        run: node tools/baseline/baseline.mjs check --repo .
      - name: orientation survey (derived state; degrades without forge auth)
        run: node tools/baseline/baseline.mjs orient --repo .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: lint
        run: make lint
      - name: typecheck
        run: make typecheck
      - name: test
        run: make test
