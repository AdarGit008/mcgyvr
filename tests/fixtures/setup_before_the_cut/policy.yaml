# mcgyvr policy.yaml — one of the two files that define a setup.
#
# Generated by `mcgyvr setup`, and safe to edit by hand: re-running
# init reports what it would change rather than overwriting you.
#
# Comments below are rendered from the same schema the loader
# validates against, so they cannot drift from what is enforced.
#
# Credentials are never values here. A key is named by the
# environment variable that holds it, never written in this file.

# Which of the three use cases this install serves: `coding` (scoped edits
# judged by the deterministic gate), `chat` (a raw un-gated endpoint) or `agent`
# (an un-gated session over the files a contract names as its sources).
use_case: coding

# How mcgyvr is run. `hybrid` drives it from an API-tier orchestrator in the
# user's session; scoped work is offloaded to the local cheap-to-dear ladder,
# whose dearest rung is an API model so a task always completes. `local-only`
# makes mcgyvr the backend: a non-chat use case provisions a local orchestrator
# unit, and chat is just the ladder serving text.
deployment: hybrid

# The ordered list of unit names work climbs, cheapest first.
ladder: [local]

# Whether a batch of contracts spreads across units or queues on one.
fanout: none

# How many times each unit may be tried before escalation moves on.
# attempts:  # e.g. `{<unit>: 2}`

# How many candidates one attempt asks *this* unit for, overriding
# `breadth.draws` for the units named; a unit with no entry draws the breadth.
# Spelled the way `attempts` is because it is the same kind of per-unit routing
# decision, and it is policy rather than a unit fact, which is why it is not
# under `units`. `mcgyvr local_pool` prints the effective number where it
# exceeds one.
# draws:  # e.g. `{<unit>: 3}`

# How many of each named unit's slots riders may use at once (hitchhike): people
# the hub matches to you, whose requests for the unit's model the agent of
# `mcgyvr rig` passes to it and whose prompts you can read. A unit the map does
# not name shares none. It is policy, not a fact of the unit, so changing it
# never changes the setup's identity or its lock, and a running agent sends the
# hub the change within a second, with no reconnect. Below the unit's `width`,
# so you always keep a slot, and your own requests go first: a ride is taken
# only while the unit has a slot free, your requests and the rides in flight
# together fewer than its `width`, so riders use only slots you are not using,
# and a unit whose server does not report what it has in flight shares nothing.
# A ride that has started runs to its end; a request of yours that arrives
# meanwhile waits for a slot as any of yours does. A unit is shared only when it
# is on the `ladder`, needs no key (`api_key_env`), is not a relief rung, states
# its `window`, the context of each slot, and has a `width` of at most 16, the
# most the hub takes; one unit per model.
# rider_slots:  # e.g. `{<unit>: 1}` -- at most one below the unit's `width`

# How many rungs a task may climb before it is handed back unfinished.
max_escalations: 1

# Hard ceiling on how many attempts one task may spend in total.
# max_attempts:  # set a whole number of attempts, or leave it unset

# Wall-clock ceiling for one task, including acceptance commands.
task_timeout_s: 900

# The largest share of a unit's context window one contract may claim -- its
# prompt and its declared reply together -- checked before the contract is sent,
# so a contract claiming more fails unsent on the unit it was sent to. It is a
# ceiling no contract can raise: a contract's own `limits.max_window_fraction`
# may hold it to less, never to more, and the stricter of the two applies. Unset
# enforces no run-wide share.
# max_window_fraction:  # a share between 0 and 1

# Users this install serves at once, and therefore the slot count the local
# orchestrator unit is served at: one session per user. A written `width` on the
# orchestrator's unit wins. `1` is a single-user install, which for a local-only
# non-chat use case is flagged, not refused — the resident orchestrator consumes
# the card the ladder would otherwise use.
users: 1

# Which unit turns a prompt plus a repository into contracts, and what that unit
# is.
orchestrator:
  # What the bound unit is. `proposer` is today's behaviour: the bound unit
  # drafts contracts for `mcgyvr delegate`. `mcorch` makes the bound unit the
  # conversational agent itself, served at an Anthropic Messages address by
  # `mcgyvr mcorch serve` for a harness (Claude Code, pi) to point at, with the
  # `jev` unit answering its typed decisions. `mcorch` requires `deployment:
  # local-only`, because it replaces the API-tier orchestrator that `hybrid`
  # describes; a bound `unit` whose `window` is stated, because the window is
  # the one fact the agent budgets a conversation by; and `authoring`.
  type: proposer

  # How `type: mcorch` turns a request into contracts. `direct`: the rung writes
  # the contract itself. `prose`: the rung is asked for JSON proposals the way
  # `mcgyvr delegate` asks (`delegate.build_prompt`), and the deterministic
  # decomposer turns them into contracts. `classifier`: the `jev` unit answers
  # typed questions (task type, target, symbol), and the strategy falls back to
  # `prose` when its confidence is low or it chooses `code`, whose reply cap
  # only `prose` states. No default is shipped, because which strategy a local
  # rung does best is being measured, and the file must say which.
  # authoring:  # name one of `direct`, `prose`, `classifier`

  # The harness tools, by name, that `type: mcorch` keeps in the rung's prompt.
  # Every other tool the harness offers is dropped, and the drop is logged in
  # the mcorch transcript, so a local rung's prompt stays short and unconfusing.
  # Matching is exact on the tool's name. Empty means keep every tool.
  # tools:  # unset

  # Which unit serves this role. A unit is the one term.
  # unit:  # name one of the units declared under `units`

  # Model identifier as that unit names it; absent means the unit's own.
  # model:  # name a model the bound unit serves


# Which unit reads an applied diff in fresh context.
verifier:
  # Model verification of the applied diff, on top of the gate. On unless set to
  # `false`. With no `unit`, the reviewer is the next dearer local rung whose
  # model is not the builder's; where there is none, the work is accepted and
  # labelled unverified. A hosted unit reviews only when `unit` names it, or
  # stands in for a hosted `unit` as `unit` says.
  enabled: true

  # Which unit reviews. A unit is the one term. It reviews every rung's work
  # except work its own model wrote, because a model does not review its own
  # output. That work is reviewed by a fallback: the usable rung nearest this
  # unit on the ladder whose model is not the builder's — the rungs below it
  # first, dearest first, then the rungs above it, cheapest first. A local rung
  # may always be the fallback; a hosted one only when this unit is hosted and
  # the rung is below it on the ladder. The result and the journal name the
  # fallback and say it stood in; with none, the work is accepted and labelled
  # unverified, saying why.
  # unit:  # name one of the units declared under `units`

  # Model identifier as that unit names it; absent means the unit's own.
  # model:  # name a model the bound unit serves


# Which one unit answers every typed decision: a question answered with a
# single-token label rather than prose. Those are the gate's Jev rung, the
# reviewer's verdict, the fleet's choice of whether to wake a smarter rung, the
# ladder manager's choices and the typed proposer. Left unbound, each of those
# keeps asking the unit it asks today: the verifier, the reviewing rung, the
# fast rung or the orchestrator.
jev:
  # Which unit serves this role. A unit is the one term.
  # unit:  # name one of the units declared under `units`

  # Model identifier as that unit names it; absent means the unit's own.
  # model:  # name a model the bound unit serves


# Where a task's commands run.
sandbox:
  # `docker` runs each task in its own container, torn down after; with no
  # Docker daemon answering, the task is refused unless `allow_fallback` is on.
  # `tempdir` is the explicitly weaker mode for installs without Docker: a
  # contract's acceptance commands run without a shell, but each runs whatever
  # program it names, on the host, with only the host's process, network and
  # resource isolation.
  mode: tempdir

  # What `mode: docker` does when no Docker daemon answers. Off, the task is
  # refused and the refusal says how to go on. On, the task runs in the
  # `tempdir` sandbox instead and says so once — the weaker mode, chosen ahead
  # of time rather than read about after the run started.
  allow_fallback: false

  # The network a task container is attached to. `bridge` is Docker's default:
  # acceptance commands can fetch dependencies and reach the configured worker
  # endpoints — and anything else this machine can reach. `none` gives the
  # container no network at all, so a contract whose commands download anything
  # fails. `none` needs `mode: docker`: the `tempdir` sandbox runs on this host,
  # where the network cannot be taken away, and is refused under it.
  network: bridge

  # The sandbox a `chat` or `agent` run gets when its contract declares no
  # `acceptance` or `demonstration` command. Such a session runs no command: its
  # reply is only staged in a throwaway checkout of HEAD, which nothing checks.
  # `tempdir` stages it on this host, so a session never builds, pulls or starts
  # a container and needs no Docker. `docker` gives it a task container as
  # `mode: docker` gives `code`, with `allow_fallback` and `network` applying. A
  # session that declares a command is sandboxed by `mode`, like any task, and
  # `--sandbox` on `mcgyvr run` overrides both for one run. `mcgyvr setup
  # --session-sandbox` writes it.
  sessions: tempdir

  # Base image for task containers. Unset means detect the repository's stack
  # and build one.
  # image:  # name an image tag, or leave unset to let the stack be detected

  # Commands run once when the task image is built, before any task. In docker
  # mode the gate's type checker, eslint and prettier run in the task container,
  # because their configuration can load code from the task's workspace, so they
  # are found on the image's PATH. The image mcgyvr builds installs the one the
  # repository configures (mypy, eslint, prettier) when its dependency install
  # does not, at the lockfile's version where it pins one; pyright, or a checker
  # the repository does not configure, is yours to put on the image, here or
  # with `sandbox.image`. A checker the image lacks is skipped and said so, as
  # an absent checker is on the host.
  # setup:  # unset


# How accepted work gets back to you.
delivery:
  # Whether `mcgyvr run` commits an accepted change. Off, the change is left in
  # your working tree, uncommitted, for you to review and commit. On, it is
  # committed onto the branch you have checked out, or onto `branch` when that
  # is set. `run --commit` and `run --no-commit` decide for one run instead.
  # Nothing here pushes or opens a pull request: the last step off this machine
  # is yours.
  commit: false

  # The branch an accepted change is committed onto, instead of the one you have
  # checked out. It says where, not whether: nothing is committed while `commit`
  # is off. A branch that does not exist is created from the commit you have
  # checked out; one that does gets the commit on its tip, refused when its copy
  # of the target differs from the one the change was judged against. Either way
  # the branch you have checked out, your index and your working tree are left
  # exactly as they were, and the run prints the `git push` to run. A branch
  # checked out in another worktree is refused. `run --branch NAME` names one
  # for one run and implies `--commit`.
  # branch:  # name a branch, or leave unset to commit onto the branch you have checked out


# How many answers one attempt asks for.
breadth:
  # How many candidates one attempt asks its rung for before the gate picks
  # between them. Draws are not attempts: they share one prompt and one
  # attempt's budget, and the gate ranks the answers rather than the next
  # attempt being told what the last one got wrong. The default of 1 is one
  # draw, one verdict, and the draw is the answer.
  draws: 1

  # What every draw after the first samples at. Draw 0 of every attempt is
  # greedy (temperature 0.0), so a single-draw install sends what it always
  # sent, byte for byte; draws 1..n-1 sample at this temperature, because a
  # second draw exists to be a different candidate and a greedy one is the first
  # draw again. 0.0 is refused at load wherever any unit's effective draws
  # exceed 1: identical draws buy N gate runs and nothing else. The wire field
  # is the OpenAI-compatible `temperature`. The journal records the temperature
  # per row.
  # temperature:  # unset


# What may be fixed without asking a model.
cleanup:
  # Repair a change the gate rejected with the deterministic tools — the
  # declared imports, the linter's own autofixes, the formatter — and judge it
  # again on the same rung, instead of spending an attempt or a climb on what a
  # tool clears for nothing. The tools are the ones the gate already checks
  # with, so a repair produces the shape the rungs ask for rather than a second
  # opinion about it, and it costs no tokens by construction. It rewrites a file
  # after the gate has spoken about it, so the bytes that come back are not the
  # bytes the worker sent: the journal keeps the reply, the tree keeps the
  # repaired file, and the verdict says a repair ran. Set false to have the
  # rejection stand as the gate reached it. What no tool fixes — a failed
  # acceptance command, a name, a line too long to wrap — is rejected exactly as
  # before.
  enabled: true


# What the deterministic gate refuses, where a setup may choose otherwise.
gate:
  # A Python function that changes an object its caller passed in, on a line the
  # change adds: it assigns or deletes into a parameter, an element of one or a
  # loop variable over one (`rows[0] = x`, `item.count += 1`, `del table[key]`),
  # or calls append, extend, insert, remove, pop, clear, sort, reverse, update,
  # setdefault, add, discard or popitem on it. `self`, `cls`, `*args` and
  # `**kwargs` are not checked, nor is a parameter rebound to a new object on
  # every path before the change. `refuse` rejects the change. `report` does not
  # reject it: the finding is listed among the gate's observations, which an
  # enabled verifier is shown and the gate's retry note does not carry, and
  # `mcgyvr run` prints it once, before delivering the accepted change, as
  # reported by this setting. `skip` does not look. Delivery judges the change
  # again by the same setting. A contract whose `task` or `interface` asks for
  # in-place work stands the check down under every setting.
  param_mutation: refuse


# What mcgyvr may do to the machines that serve the units. A unit's HuggingFace
# cache is a fact about that unit and lives on it, not here: only the policy of
# starting and stopping a card is a setting.
serving:
  # Whether mcgyvr may take a card down and bring it back on its own. Off by
  # default, because the feature is a trade and not an improvement: turning it
  # on lets `mcgyvr run` stop containers on a rig other people share. It is a
  # key here and not a `--flag` for the reason `mcgyvr run --config` already
  # gives about which rung runs — the config a run is made under is what a run
  # is reproducible from, and a flag would let two runs share one config where
  # only one of them started and stopped containers on a shared rig, putting the
  # rig side effect outside the only record that explains the run. It also lets
  # `mcgyvr manage`, the ladder manager, put an idle unit to sleep and wake it
  # again on its own, but only while that command is running: with it on and no
  # manager running, nothing sleeps a card except a person. A sleep, the
  # manager's or a person's `mcgyvr serve sleep`, rests a vLLM card at level 2,
  # which keeps its process and drops its weights and KV cache, and stops the
  # containers of any other card, of a vLLM card with no sleep route, or of one
  # holding a unit split across machines, whose level 2 is not measured; either
  # way the next wake loads the model from disk. For that sleep it also makes
  # `mcgyvr emit` start every vLLM unit with `--enable-sleep-mode` and
  # `VLLM_SERVER_DEV_MODE=1`, which registers vLLM's development routes --
  # /sleep, /wake_up, /reset_prefix_cache and others -- on the unit's serving
  # port, unauthenticated: anyone who can reach that port can sleep, wake or
  # reset the unit. The emitted file says so in a comment. With the switch off,
  # emit writes neither. It governs the *decisions*: `mcgyvr serve sleep|wake`,
  # typed by a person who has therefore asked, is not gated by it. It is a key
  # of its own rather than part of `fanout` because `fanout` decides where work
  # goes among rungs that exist and this decides whether rungs come into
  # existence — two authorities, and only one of them touches a rig.
  # enable_sleep_wake:  # unset

  # Where this checkout keeps the launch specs `mcgyvr emit` wrote. The one
  # thing that has to be stated rather than derived, because `mcgyvr emit --out`
  # defaults to the current directory and a wake has to find the file again. It
  # is deliberately not a device and not a host: a `device: cuda:0` beside a
  # unit's `address` would be two statements of one fact and would go stale the
  # first time a unit was re-pointed, whereas this cannot go stale against
  # anything — it says where files are, not where work runs. A config that omits
  # it has no sleeping cards at all, only down ones: `asleep` is `down` plus a
  # launch spec mcgyvr holds for that card, and with no directory there is no
  # spec.
  # compose_dir:  # the directory `mcgyvr emit --out` writes to -- e.g. ~/.mcgyvr/fleets/<fleet>/compose -- or leave it unset and this ladder has no sleeping cards, only down ones


# What the ladder manager may do on its own. It runs only under `mcgyvr manage`,
# and only when `serving.enable_sleep_wake` is on and the ladder has units that
# can sleep and wake. Within this block it sleeps and wakes those units, changes
# `fanout` and changes which local unit leads; everything else it notices it
# prints as a recommendation and leaves alone. A vLLM unit sleeps at level 2,
# keeping its process and dropping its weights and KV cache; any other unit's
# containers are stopped. A wake loads the model from disk again.
manager:
  # How often the ladder manager asks its small model for a decision, in
  # seconds. The default of 30 is an estimate, not a measurement: nothing here
  # has timed how fast a queue builds or drains on your units. Lower it to react
  # sooner, at the price of more questions asked of a model that is itself
  # running on the ladder's hardware; raise it to ask less. The manager runs
  # only under `mcgyvr manage`, and only when `serving.enable_sleep_wake` is on
  # and the ladder has units that can sleep and wake. Everything it sees that
  # falls outside what this block lets it change, it prints as a recommendation
  # and does not do.
  # interval_s:  # unset

  # How many consecutive identical answers the manager must get before it acts
  # on one, so a single odd answer from a small model moves nothing. The default
  # of 3 is an estimate, not a measurement: it lets one stray answer fail to act
  # alone, and it has not been tuned against any real queue. With the default
  # interval it means about a minute and a half of the same answer before
  # anything happens. Set 1 to act on every answer.
  # confirm:  # unset

  # The least time between two switches, in seconds, so the manager cannot sleep
  # a unit and wake it again in a loop. A unit that changed state without the
  # manager -- a task woke it, or a person ran `mcgyvr serve` -- counts as a
  # switch too, and a unit is put to sleep only once it has been idle for this
  # long. A vLLM unit sleeps at level 2 and keeps its process; any other unit's
  # containers are stopped. Either way a wake loads the model from disk again,
  # so every switch costs a full load. The default of 600 is an estimate, not a
  # measurement. Set it above the time your sleeping units take to wake --
  # `mcgyvr serve wake` prints that time -- or the manager can be asking for a
  # unit back before the last wake has finished. 0 allows a switch on every
  # decision.
  # dwell_s:  # unset

  # The fan-out modes the manager may choose between, each one of `none`, `idle`
  # or `full` as `fanout` spells them, each listed once. The manager changes
  # `fanout` only among these, and fewer than two means there is nothing to
  # choose between, so it is never asked. Empty by default: a manager that was
  # not told which modes it may use leaves `fanout` as the file says.
  # fanouts:  # unset

  # The local units the manager may move to the front of the local family, each
  # listed once. Each must be on the `ladder` and must need no credential: a
  # unit that is not on the ladder is not one work climbs, and a unit with an
  # `api_key_env` is hosted, not local. Empty by default, which means the
  # manager is never asked which unit should lead and the ladder's own order
  # stands.
  # leads:  # unset


# Where mcgyvr keeps its own record of what it dispatched. To say what a run
# belongs to — an experiment, a build — set `MCGYVR_RUN_TAGS` to a JSON object
# of text, number or true/false values, e.g. `{"round": "r7"}`, at most 4096
# bytes: every row the run writes carries it under `run_tags`. Set to anything
# else, the run is refused before it starts.
journal:
  # Where every run journals what it asked, what came back and how it landed:
  # one `<orchestrator>.jsonl` per writer, the prompts and replies content-
  # addressed under `blobs/`, each run's result file under `results/`, and each
  # `chat` or `agent` session (its question and answer) under `sessions/`.
  # Deterministic runs are here too, with a row naming the program instead of a
  # model. This is mcgyvr's own record, it never lands in the repository a run
  # works on, and nothing on the command line moves it: it is the one place
  # every run is, which is what makes it worth asking questions of. `mcgyvr run
  # --record DIR` adds a second copy for your own use. Read either copy back
  # from DIR directly: one JSONL per writer, prompts and replies under `blobs/`,
  # results under `results/`.
  dir: "~/.local/state/mcgyvr/journal"
