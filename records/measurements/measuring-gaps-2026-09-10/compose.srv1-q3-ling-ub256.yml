services:
  Ling-3.0-tiny-Q4_K_M-8080:
    command:
    - --model
    - /home/adaramir/models/moe/Ling-3.0-tiny-Q4_K_M.gguf
    - --parallel
    - '2'
    - --port
    - '8080'
    - -b
    - '512'
    - -c
    - '8192'
    - -fa
    - 'on'
    - -ngl
    - '99'
    - -t
    - '6'
    - -ub
    - '256'
    - --verbose
    container_name: mcgyvr-srv1-Ling-3.0-tiny-Q4_K_M-8080
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            device_ids:
            - '0'
            driver: nvidia
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
    image: llamacpp:b10644-L3
    network_mode: host
    restart: unless-stopped
    volumes:
    - /home/adaramir/models/moe:/home/adaramir/models/moe:ro
    - /home/adaramir/models/moe:/models:ro
