version: 1
sources:
  srv2_llamacpp:
    base_url: http://srv2:8080
    api: openai
    image: llamacpp:b10644-L3
    max_parallel: 2
    context_window: 4096
models:
  deepseek-coder-v2-16b:
    geometry_json: ./deepseek-coder-v2-16b.geometry.json
ladder:
  tiers:
  - name: probe_deepseek-coder-v2-16b
    source: srv2_llamacpp
    model: deepseek-coder-v2-16b
    max_parallel: 2
  fanout: idle
verifier:
  enabled: false
sandbox:
  mode: docker
delivery:
  mode: branch
