services:
  m_a-8080:
    command:
    - --model
    - /home/adaramir/models/moe/m_a.gguf
    - --parallel
    - '2'
    - --port
    - '8080'
    - -b
    - '512'
    - -c
    - '8192'
    - -fa
    - 'on'
    - -ngl
    - '99'
    - -t
    - '10'
    - -ub
    - '512'
    container_name: mcgyvr-srv2-m_a-8080
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            device_ids:
            - '0'
            driver: nvidia
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
    image: llamacpp:b10644-L3
    network_mode: host
    restart: unless-stopped
    volumes:
    - /home/adaramir/models/moe:/home/adaramir/models/moe:ro
    - /home/adaramir/models/moe:/models:ro
  m_b-8081:
    command:
    - --model
    - /home/adaramir/models/moe/m_b.gguf
    - --parallel
    - '2'
    - --port
    - '8081'
    - -b
    - '512'
    - -c
    - '8192'
    - -fa
    - 'on'
    - -ngl
    - '99'
    - -t
    - '10'
    - -ub
    - '512'
    container_name: mcgyvr-srv2-m_b-8081
    depends_on:
      m_a-8080:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            device_ids:
            - '0'
            driver: nvidia
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
    image: llamacpp:b10644-L3
    network_mode: host
    restart: unless-stopped
    volumes:
    - /home/adaramir/models/moe:/home/adaramir/models/moe:ro
    - /home/adaramir/models/moe:/models:ro
