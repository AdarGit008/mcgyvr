services:
  srv1_deepseek:
    command:
    - --model
    - /home/adaramir/models/moe/deepseek-coder-v2-16b.gguf
    - --n-cpu-moe
    - '19'
    - --parallel
    - '2'
    - --port
    - '8080'
    - -b
    - '512'
    - -ub
    - '512'
    - -c
    - '8192'
    - -fa
    - 'on'
    - -ngl
    - '99'
    - -t
    - '6'
    container_name: mcgyvr-srv1-deepseek
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            device_ids:
            - '0'
            driver: nvidia
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
    image: llamacpp:b10644-L3
    network_mode: host
    restart: unless-stopped
    volumes:
    - /home/adaramir/models:/models:ro
    - /home/adaramir/models:/home/adaramir/models:ro
